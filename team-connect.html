   both fit rather than spilling over the ring. .6 is the mono advance width. */
.ring .t { font-family: var(--font-mono); line-height: 1; letter-spacing: -.02em;
  font-size: min(24px, calc(var(--size) * var(--hole) * .94 / (var(--len, 5) * .6))); }
@keyframes pulse { 50% { opacity: .45; } }
.scorelist { display: flex; flex-direction: column; gap: 6px; }
.scorerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; border-left: 4px solid var(--tc, var(--gold)); background: rgba(246, 244, 239, .03); }
.scorerow .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scorerow .pts { font-family: var(--font-mono); font-size: 20px; color: var(--tc, var(--gold)); }
.scorerow.pop { animation: scorePop .55s cubic-bezier(.2, .7, .3, 1.4); }
@keyframes scorePop { 35% { transform: scale(1.04); } }
.award-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.award-grid .btn.team { min-width: 120px; }
.award-grid .btn.team.done { outline: 2px solid var(--green); outline-offset: 2px; }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.turn-banner { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 12px; padding: 8px 14px; font-size: 15px; }
.turn-banner b { color: var(--tc, var(--gold)); }
.log { max-height: 200px; overflow: auto; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.log .li { display: flex; gap: 8px; color: var(--muted); }
.log .li .ts { font-family: var(--font-mono); color: var(--dim); flex: none; }
.log .li.undo { color: var(--amber); }
.share-status { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; border: 1px solid; font-weight: 700; font-size: 13px; }
.share-status.private { border-color: rgba(255, 77, 109, .5); background: rgba(255, 77, 109, .1); color: #ffc0cb; }
.share-status.safe { border-color: rgba(35, 213, 171, .5); background: rgba(35, 213, 171, .1); color: #b6f5e4; }
.share-status.off { border-color: var(--line-strong); color: var(--muted); }
.share-status.warn { border-color: rgba(255, 180, 84, .5); background: rgba(255, 180, 84, .08); color: #ffd9a6; }
.step-list { counter-reset: s; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.step-list li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; }
.step-list li::before { content: counter(s); font-family: var(--font-mono); color: var(--gold); border: 1px solid rgba(232, 184, 75, .4); border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.svg-frame { background: #f6f4ef; border-radius: 12px; padding: 8px; display: inline-block; max-width: 100%; }
.svg-frame svg { width: 100%; height: auto; max-height: 300px; display: block; }
.svg-frame.sm svg { max-height: 160px; }
.list-ranked { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.list-ranked li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; }
.list-ranked li .n { font-family: var(--font-mono); color: var(--gold); min-width: 22px; }
.msg-card { border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.msg-card.approved { border-color: rgba(35, 213, 171, .4); }
.msg-card.rejected { opacity: .5; }

/* ---------- home/hero ---------- */
.hero { text-align: center; padding: 40px 0 24px; }
.hero h1 { font-size: clamp(40px, 6vw, 72px); text-transform: uppercase; line-height: .95; margin-top: 12px; }
.hero h1 span { background: linear-gradient(160deg, var(--gold-2) 10%, var(--gold) 45%, #a97f22 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); margin-top: 14px; font-size: 18px; }
.session-card { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.session-card .nm { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.session-card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* ---------- modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(3, 4, 10, .72); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: linear-gradient(180deg, var(--panel-3), var(--panel)); border: 1px solid var(--line-strong); border-radius: 18px; padding: 24px; width: min(640px, 100%); max-height: 90vh; overflow: auto; box-shadow: var(--shadow); }
.modal.wide { width: min(960px, 100%); }
.modal h2 { margin-bottom: 8px; }
.modal .body { color: var(--muted); margin: 8px 0 18px; line-height: 1.5; }
.modal .body ul { margin: 8px 0 0 18px; }
.modal .body b { color: var(--text); }
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 120; max-width: min(420px, calc(100vw - 40px)); }
.toast { background: var(--panel-3); border: 1px solid var(--line-strong); border-left: 4px solid var(--gold); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 14px; }
.toast.error { border-left-color: var(--red); } .toast.ok { border-left-color: var(--green); } .toast.warn { border-left-color: var(--amber); }

/* ---------- podium ---------- */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin: 30px 0 10px; min-height: 280px; }
.podium .spot { text-align: center; width: 200px; }
.podium .block { border-radius: 14px 14px 0 0; background: linear-gradient(180deg, var(--panel-3), var(--panel)); border: 1px solid var(--line); border-bottom: none; border-top: 5px solid var(--tc); padding-top: 16px; }
.podium .p1 .block { height: 220px; } .podium .p2 .block { height: 170px; } .podium .p3 .block { height: 130px; }
.podium .medal { font-size: 40px; }
.podium .tname { font-family: var(--font-display); font-size: 20px; font-weight: 700; padding: 0 8px; }
.podium .tpts { font-family: var(--font-mono); font-size: 26px; color: var(--tc); margin-top: 4px; }
.bar-track { background: rgba(246, 244, 239, .06); border-radius: 999px; height: 14px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--tc); border-radius: 999px; transition: width .8s ease; }

/* ---------- motion & responsive ---------- */
@media (prefers-reduced-motion: no-preference) {
  .content > * { animation: riseIn .4s cubic-bezier(.2, .7, .2, 1) both; }
}
@keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) {
  .console { grid-template-columns: 1fr; }
  .console-rail { position: static; }
  .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .builder-grid { grid-template-columns: 1fr; }
  .session-card { grid-template-columns: 1fr; }
  .btn { white-space: normal; text-align: center; }
  .stage { padding: 16px; }
  .hero .btn.big { width: 100%; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 10px; gap: 4px; border-right: none; border-bottom: 1px solid var(--line); }
  .brand { width: 100%; padding: 6px 10px 8px; }
  .nav-btn { width: auto; padding: 8px 10px; font-size: 13.5px; }
  .nav-sep, .nav-foot { display: none; }
  .content { padding: 16px; }
  .console { padding: 12px 16px 30px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span2 { grid-column: span 1; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
  .rs-item { grid-template-columns: 24px 1fr; }
  .rs-item .num { display: none; }
  .rs-item .actions { grid-column: 1 / -1; }
  .podium { flex-direction: column; align-items: center; min-height: 0; }
  .podium .spot { width: 100%; max-width: 300px; }
  .podium .block { height: auto !important; padding-bottom: 14px; }
  .stage .options { grid-template-columns: 1fr; }
  .topbar { padding: 10px 14px; }
  .timer-ctl { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 420px) {
  .btn { padding: 10px 14px; }
  .hero h1 { font-size: 38px; }
  .person .nm { max-width: 150px; }
}

/* ---------- Simple/Advanced mode, share safety banner, rehearsal ---------- */
.mode-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; flex: none; }
.mode-toggle button { background: transparent; border: 0; padding: 6px 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: var(--font-body); }
.mode-toggle button.on { background: var(--gold); color: var(--gold-ink); }
.mode-toggle button:not(.on):hover { color: var(--text); background: rgba(246, 244, 239, .06); }
.mode-toggle button[disabled] { opacity: .4; cursor: not-allowed; }

.share-banner { display: flex; align-items: center; gap: 12px; margin: 14px 26px 0; padding: 11px 16px; border-radius: 12px; border: 1px solid; font-size: 13.5px; }
.share-banner > div { flex: 1; }
.share-banner .ic { flex: none; width: 1.3em; height: 1.3em; }
.share-banner.green { border-color: rgba(35, 213, 171, .55); background: rgba(35, 213, 171, .11); color: #b6f5e4; }
.share-banner.amber { border-color: rgba(255, 180, 84, .6); background: rgba(255, 180, 84, .11); color: #ffd9a6; }
.share-banner.red { border-color: rgba(255, 77, 109, .6); background: rgba(255, 77, 109, .12); color: #ffc0cb; }
.rehearsal-bar { display: flex; align-items: center; gap: 12px; margin: 14px 26px 0; padding: 10px 16px; border-radius: 12px;
  border: 1px dashed rgba(94, 139, 255, .7); background: rgba(94, 139, 255, .12); color: #cfdcff; font-size: 13.5px; }
.rehearsal-bar > div { flex: 1; }

.badge.breakout { color: var(--blue); border-color: rgba(94, 139, 255, .6); background: rgba(94, 139, 255, .12); }
.badge.breakout.soft { opacity: .7; }
.badge.ok { color: var(--green); border-color: rgba(35, 213, 171, .5); }
.btn.warn { background: var(--amber); color: #241500; border-color: transparent; }
.btn.ghost.warn { background: transparent; color: var(--amber); border-color: rgba(255, 180, 84, .5); }
.btn.ghost.ok { background: transparent; color: var(--green); border-color: rgba(35, 213, 171, .5); }

/* ---------- readiness check ---------- */
.ready-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
.ready-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; }
.ready-row .ttl { font-weight: 700; }
.ready-row.ok { color: var(--green); border-color: rgba(35, 213, 171, .28); }
.ready-row.ok .ttl, .ready-row.warn .ttl, .ready-row.blocker .ttl { color: var(--text); }
.ready-row.warn { border-color: rgba(255, 180, 84, .4); color: var(--amber); }
.ready-row.blocker { border-color: rgba(255, 77, 109, .55); background: rgba(255, 77, 109, .07); color: var(--red); }
.msg-card.recommended { border-color: rgba(232, 184, 75, .6); background: rgba(232, 184, 75, .07); }
.tbl tr.muted-row td { color: var(--amber); }

/* ---------- shared achievement finale ---------- */
.shared-wrap { max-width: 900px; margin: 10px auto 0; }
.shared-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.shared-tiles .tile { border: 1px solid var(--line-strong); border-radius: 14px; padding: 16px; text-align: center; background: rgba(246, 244, 239, .03); }
.shared-tiles .tile .n { display: block; font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--gold-2); line-height: 1; }
.shared-tiles .tile .k { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
code { font-family: var(--font-mono); font-size: .92em; background: rgba(246, 244, 239, .06); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; word-break: break-word; }

/* ---------- UI simplification pass: menus, one primary action, calmer surfaces ---------- */
/* Overflow menu (native <details>, no open/close script). */
details.menu { position: relative; display: inline-flex; }
details.menu > summary { list-style: none; cursor: pointer; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu > summary::marker { content: ""; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 236px; padding: 6px;
  background: var(--panel-3); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); }
details.menu.left .menu-pop { right: auto; left: 0; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text); font-size: 14px; text-align: left; cursor: pointer; }
.menu-item:hover:not(:disabled) { background: rgba(246, 244, 239, .07); }
.menu-item:disabled { opacity: .38; cursor: not-allowed; }
.menu-item.danger { color: var(--red); }
.menu-item .ic { flex: none; color: var(--muted); }
.menu-item.danger .ic { color: var(--red); }
.menu-item .hint { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
.menu-sep { height: 1px; margin: 5px 8px; background: var(--line); }

/* One gold button per state: everything that is not the next action reads as secondary. */
.primary-row { gap: 10px; }
.primary-row .btn.ghost, .primary-row .btn.subtle { font-weight: 600; }
.btn.green { background: linear-gradient(160deg, #3de3bd, var(--green)); color: #05261d; }

/* Console: fewer nested boxes. The run sheet on the dashboard is a plain list, not cards. */
.stage.lead { padding: 26px 28px; }
.stage.lead h2 { font-size: 30px; margin: 6px 0 2px; }
.runsheet.plain { gap: 0; margin-top: 18px; border-top: 1px solid var(--line); }
.runsheet.plain .rs-item { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  grid-template-columns: 40px 1fr auto; padding: 12px 6px; }
.runsheet.plain .rs-item.isnext { background: rgba(232, 184, 75, .06); }
.runsheet.plain .rs-item.complete { opacity: .5; }
.activity-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.activity-head h2 { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.ghead-icon { display: inline-flex; width: 26px; height: 26px; color: var(--gold); }
.zoom-note { margin-top: 12px; color: var(--muted); font-size: 13px; }
.zoom-note .ic { color: var(--blue); }
.backbar { display: flex; align-items: center; gap: 10px; margin: 14px 24px -4px; color: var(--muted); }
.rail-panel.tightpad { padding: 11px 14px; }
.timer-ctl.compact { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.timer-ctl.compact .btn { min-height: 34px; padding: 6px 10px; font-size: 13px; }

/* Builder: one column, library behind a button. */
.builder-single { margin-top: 16px; }
.title-input { font-family: var(--font-display); font-size: 28px; font-weight: 700; background: transparent;
  border-color: transparent; padding: 4px 8px; margin-left: -8px; max-width: 520px; }
.title-input:hover { border-color: var(--line); }

/* Activity picker */
.picker-bar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.picker-bar .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.filter { cursor: pointer; background: transparent; }
.chip.filter.on { color: var(--gold-ink); background: var(--gold); border-color: transparent; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; max-height: 52vh; overflow: auto; padding-right: 4px; }
.pick-card { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(246, 244, 239, .02); color: var(--text); cursor: pointer; }
.pick-card:hover { border-color: var(--gold); background: rgba(232, 184, 75, .06); }
.pick-card .icon { flex: none; width: 26px; height: 26px; color: var(--gold); display: inline-flex; }
.pick-card .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pick-card .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }

/* Progressive disclosure inside forms */
.adv-block { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.adv-block > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
.adv-block > summary::-webkit-details-marker { display: none; }
.adv-block > summary::after { content: "▾"; margin-left: auto; }
.adv-block[open] > summary::after { content: "▴"; }
.adv-block > summary:hover { color: var(--text); }
.adv-block .form-grid { margin-top: 10px; }
.adv-fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.adv-fieldset legend { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
.hold-group { display: inline-flex; gap: 4px; align-items: center; }
.btn.hold-on { background: var(--blue); color: #05070f; }
.btn.hold-on:hover { filter: brightness(1.08); }
.timeup-bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid rgba(255, 180, 84, .55); background: rgba(255, 180, 84, .1); color: #ffd9a6; font-size: 13.5px; }
.timeup-bar > div:first-of-type { flex: 1; }
.timeup-bar .ic { flex: none; }
.turn-panel .turn-suggest { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(246, 244, 239, .03); }
.turn-panel .turn-suggest .k { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.turn-panel .turn-suggest b { display: block; font-size: 15px; }
.panel > .row.between { flex-wrap: wrap; gap: 8px; }
.turn-order { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; padding: 9px 14px; border-radius: 12px;
  border: 1px solid var(--tc, var(--gold)); background: rgba(246, 244, 239, .04); }
.turn-order b { color: var(--tc, var(--gold)); font-size: 17px; }
.turn-order span { color: var(--muted); font-size: 13px; }

/* ---------- spacing rhythm and section separation ---------- */
/* One vertical rhythm for the console stage instead of per-element margins, so every block
   is separated by the same amount however a game composes them. */
.stage { --gap: 16px; }
.stage > * + * { margin-top: var(--gap); }
.stage > .row + .row, .stage > .ctl-row { margin-top: calc(var(--gap) * 1.25); }
.stage .prompt { margin: 0; }
.stage .options { margin: 0; }
/* The clock and the private answer belong on one line; the answer shrinks rather than
   dropping the clock onto its own row and leaving a hole. */
.stage > .row { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.stage > .row > .stack { flex: 1 1 260px; min-width: 0; }
.stage .private { min-width: 0; }
.stage .private .ans { overflow-wrap: anywhere; }
/* Award blocks read as their own section rather than floating text. */
.stage .award-grid { margin-top: 8px; }
.stage .eyebrow + .award-grid { margin-top: 6px; }

/* Rail panels: one rhythm inside them too. */
.rail-panel > * + * { margin-top: 10px; }
.rail-panel h4 + * { margin-top: 8px; }
.console-rail { gap: 14px; }

/* Text blocks never crowd the edge of a panel or run into the next line of text. */
.panel > * + * { margin-top: 12px; }
.panel > h3 + p, .panel > h3 + .sub { margin-top: 6px; }
.step-list > li + li { margin-top: 8px; }
.callout { line-height: 1.5; }


/* ==== src/styles/presentation.css ==== */
/* src/styles/presentation.css : participant-facing window (shared through Zoom) */
.pres { --s: 1; position: relative; height: 100vh; display: flex; flex-direction: column; background: radial-gradient(1000px 600px at 85% -5%, rgba(232, 184, 75, .10), transparent 60%), radial-gradient(900px 700px at -10% 105%, rgba(94, 139, 255, .09), transparent 60%), var(--ink); color: var(--text); overflow: hidden; }
.pres.large { --s: 1.22; }
.pres-top { display: flex; align-items: center; justify-content: space-between; padding: calc(16px * var(--s)) calc(28px * var(--s)); border-bottom: 1px solid var(--line); gap: 16px; }
.pres-top .brand { font-family: var(--font-display); font-weight: 700; font-size: calc(20px * var(--s)); letter-spacing: .02em; }
.pres-top .brand span { color: var(--gold); }
.pres-top .live { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: calc(11px * var(--s)); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
.pres-top .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 1.8s ease infinite; }
@keyframes blink { 50% { opacity: .35; } }
.pres-top .live.paused::before { background: var(--amber); box-shadow: none; animation: none; }
.pres-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: calc(20px * var(--s)); padding: calc(20px * var(--s)) calc(28px * var(--s)); min-height: 0; }

/* ==== src/core/00-namespace.js ==== */
/* src/core/00-namespace.js
   TEAM CONNECT LIVE: global namespace, event bus and small utilities.
   Every module attaches to window.TCL so the final file needs no module loader. */
(function () {
  "use strict";
  const TCL = window.TCL = window.TCL || {};
  TCL.VERSION = "1.0.0";
  window.__tclErrors = window.__tclErrors || [];
  window.addEventListener("error", e => { window.__tclErrors.push(String(e.message || e)); });
  window.addEventListener("unhandledrejection", e => { window.__tclErrors.push("unhandled: " + String(e.reason)); });
  TCL.SCHEMA_VERSION = 1;
  TCL.STORE_KEY = "teamConnectLive_v1";
  TCL.LEGACY_KEY = "teamGames50min_v7";

  /* ---------- event bus ---------- */
  const listeners = {};
  TCL.on = function (evt, fn) {
    (listeners[evt] = listeners[evt] || []).push(fn);
    return () => TCL.off(evt, fn);
  };
  TCL.off = function (evt, fn) {
    if (!listeners[evt]) return;
    listeners[evt] = listeners[evt].filter(f => f !== fn);
  };
  TCL.emit = function (evt, payload) {
    (listeners[evt] || []).slice().forEach(fn => {
      try { fn(payload); } catch (e) { console.error("[TCL] listener error on", evt, e); }
    });
  };

  /* ---------- utilities ---------- */
  const U = TCL.util = {};
  let seq = 0;
  U.uid = function (prefix) {
    seq += 1;
    return (prefix || "id") + "_" + Date.now().toString(36) + "_" + (seq).toString(36) + "_" + Math.random().toString(36).slice(2, 7);
  };
  U.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  };
  U.clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
  /* Settings can arrive from an imported preset, a restored backup or hand-edited storage,
     none of which pass through the settings form's coercion. A NaN from one of those does
     not throw: every comparison against it is false, so a limit silently stops applying and
     a calculation silently becomes zero. Read every numeric setting through this. */
  U.num = function (value, fallback, min, max) {
    let n = typeof value === "number" ? value : parseFloat(value);
    if (!isFinite(n)) n = isFinite(fallback) ? fallback : 0;
    if (min != null) n = Math.max(min, n);
    if (max != null) n = Math.min(max, n);
    return n;
  };
  U.clone = obj => JSON.parse(JSON.stringify(obj));
  U.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.sum = arr => arr.reduce((s, n) => s + (Number(n) || 0), 0);
  U.pad2 = n => String(n).padStart(2, "0");
  /* mm:ss or h:mm:ss, never negative */
  U.fmtMs = function (ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    return h ? `${h}:${U.pad2(m)}:${U.pad2(s)}` : `${U.pad2(m)}:${U.pad2(s)}`;
  };
  U.fmtMin = function (minutes) {
    const m = Math.round(minutes);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h} h ${r} min` : `${h} h`;
  };
  U.plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;
  U.debounce = function (fn, ms) {
    let t = null;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), ms);
    };
  };
  U.byId = (arr, id) => arr.find(x => x.id === id) || null;
  U.words = s => String(s || "").trim().split(/\s+/).filter(Boolean);
  U.titleCase = s => String(s || "").replace(/\b\w/g, c => c.toUpperCase());
  U.today = () => new Date().toISOString().slice(0, 10);
  U.fmtDate = function (iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + " " +
      d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  };
  /* Stable sort helper */
  U.sortBy = (arr, fn, desc) => arr.map((x, i) => ({ x, i, k: fn(x) }))
    .sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : a.i - b.i) * (desc ? -1 : 1))
    .map(o => o.x);
  /* CSV: parse and serialise (RFC 4180 subset with quotes) */
  U.parseCSV = function (text) {
    const rows = []; let row = [], field = "", inQ = false;
    const src = String(text || "").replace(/\r\n?/g, "\n");
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      if (inQ) {
        if (c === '"') { if (src[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }

  U.toCSV = function (rows) {
    const q = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

  };
  U.download = function (filename, text, mime) {
    try {
      const blob = new Blob([text], { type: mime || "text/plain" });

      a.href = url; a.download = filename; document.body.appendChild(a); a.click();

    } catch (e) { return false; }
  };

    try {
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand("copy");
      ta.remove();
      return !!ok;
    } catch (e) { return false; }
  };
  /* Disambiguate duplicate names: "Sam", "Sam (2)", "Sam (3)" */
  U.dedupeNames = function (people) {
    const seen = {};
    people.forEach(p => {
      const base = p.name.replace(/\s\(\d+\)$/, "");
      seen[base.toLowerCase()] = (seen[base.toLowerCase()] || 0) + 1;
      p.displayName = seen[base.toLowerCase()] > 1 ? `${base} (${seen[base.toLowerCase()]})` : base;
    });
    return people;
  };
})();


/* ==== src/core/10-store.js ==== */
/* src/core/10-store.js
   Versioned localStorage persistence with graceful failure. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Store = TCL.Store = {};
  let memoryFallback = null;      // used when localStorage is unavailable
  Store.available = true;
  Store.lastSavedAt = null;
  Store.lastError = null;

  let probed = null;
  function storage() {
    if (probed !== null) return probed ? window.localStorage : null;
    try {
      const t = "__tcl_probe__";
      window.localStorage.setItem(t, "1");
      window.localStorage.removeItem(t);
      probed = true;
      return window.localStorage;
    } catch (e) {
      probed = false;
      Store.available = false;
      return null;
    }
  }

  Store.defaults = function () {
    return {
      v: TCL.SCHEMA_VERSION,
      settings: {
        sound: true, volume: 0.6, silent: false,
        scoringEnabled: true, showScoresLive: true, hideScoresUntilFinale: false, scoreModel: "balanced",
        largeText: false, presentationScale: 1,
        confirmRoutine: true,
        consoleMode: "simple", soundTested: false, lastBackupAt: null,
        gameDefaults: {},
      },
      content: { custom: [], disabled: [], usage: {}, packs: [], overrides: {} },
      presets: [],
      sessions: [],
      currentSessionId: null,
      seenIntro: false,
    };
  };

  /* Deep-merge defaults into loaded data so new fields never come back undefined. */
  function withDefaults(data) {
    const d = Store.defaults();
    const out = Object.assign({}, d, data || {});
    out.settings = Object.assign({}, d.settings, (data && data.settings) || {});
    if (!out.settings.gameDefaults || typeof out.settings.gameDefaults !== "object") out.settings.gameDefaults = {};
    /* confirmDestructive became confirmRoutine when destructive confirmations stopped being
       skippable at all. Carry the old preference over; it meant the same "stop asking me". */
    if (Object.prototype.hasOwnProperty.call(out.settings, "confirmDestructive")) {
      if (data && data.settings && !Object.prototype.hasOwnProperty.call(data.settings, "confirmRoutine")) out.settings.confirmRoutine = out.settings.confirmDestructive !== false;
      delete out.settings.confirmDestructive;
    }
    out.content = Object.assign({}, d.content, (data && data.content) || {});
    ["custom", "disabled", "packs"].forEach(k => { if (!Array.isArray(out.content[k])) out.content[k] = []; });
    if (!out.content.usage || typeof out.content.usage !== "object") out.content.usage = {};
    if (!out.content.overrides || typeof out.content.overrides !== "object") out.content.overrides = {};
    if (!Array.isArray(out.presets)) out.presets = [];
    if (!Array.isArray(out.sessions)) out.sessions = [];
    return out;
  }

  /* Migrations run in order from data.v to the current schema. */
  const migrations = {
    /* 0 -> 1 : nothing yet. Placeholder shows the pattern for future versions. */
  };
  function migrate(data) {
    let v = Number(data.v || 0);
    while (v < TCL.SCHEMA_VERSION) {
      const fn = migrations[v];
      if (fn) data = fn(data);
      v += 1;
      data.v = v;
    }
    return data;
  }

  Store.load = function () {
    const ls = storage();
    let raw = null;
    try { raw = ls ? ls.getItem(TCL.STORE_KEY) : memoryFallback; } catch (e) { raw = null; }
    if (!raw) return { data: withDefaults(null), status: "fresh" };
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") throw new Error("not an object");
      if (Number(parsed.v || 0) > TCL.SCHEMA_VERSION) {
        return { data: withDefaults(null), status: "newer", raw };
      }
      return { data: withDefaults(migrate(parsed)), status: "ok" };
    } catch (e) {
      /* Corrupted: keep a copy so nothing is lost, start clean. */
      try { if (ls) ls.setItem(TCL.STORE_KEY + "_corrupt_" + Date.now(), raw); } catch (e2) { /* ignore */ }
      return { data: withDefaults(null), status: "corrupt", error: String(e) };
    }
  };

  Store.save = function (data) {
    const ls = storage();
    const json = JSON.stringify(data);
    try {
      if (ls) ls.setItem(TCL.STORE_KEY, json); else memoryFallback = json;
      Store.lastSavedAt = Date.now();
      Store.lastError = null;
      TCL.emit("store:saved");
      return true;
    } catch (e) {
      Store.lastError = /quota/i.test(String(e)) ? "Storage is full. Export your session or delete old sessions." : String(e);
      TCL.emit("store:error", Store.lastError);
      return false;
    }
  };

  Store.clear = function () {
    const ls = storage();
    try { if (ls) ls.removeItem(TCL.STORE_KEY); } catch (e) { /* ignore */ }
    memoryFallback = null;
  };

  /* Legacy PRIME TIME save (teamGames50min_v7) */
  Store.readLegacy = function () {
    const ls = storage();
    if (!ls) return null;
    try {
      const raw = ls.getItem(TCL.LEGACY_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.teams)) return null;
      return {
        roster: Array.isArray(s.roster) ? s.roster : [],
        absent: Array.isArray(s.absent) ? s.absent : [],
        teams: s.teams.map(t => ({
          name: String(t.name || ""),
          players: Array.isArray(t.players) ? t.players : [],
          scores: t.scores || {},
        })),
        played: s.played || {},
      };
    } catch (e) { return null; }
  };

  Store.estimateSize = function () {
    try { return JSON.stringify(TCL.state || {}).length; } catch (e) { return 0; }
  };
})();


/* ==== src/core/20-timers.js ==== */
/* src/core/20-timers.js
   Timestamp-based timers. Remaining time is derived from wall-clock timestamps,
   so background-tab throttling and laptop sleep cannot drift the count.
   Timer records live in session.timers so a refresh restores them exactly. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Timers = TCL.Timers = {};
  const NAMES = Timers.NAMES = ["session", "activity", "round", "break", "breakout"];

  Timers.blank = function (direction) {
    return { status: "idle", direction: direction || "down", durationMs: 0, remainingMs: 0, elapsedMs: 0, startedAt: null, label: "", warnAtMs: 10000 };
  };
  Timers.blankSet = function () {
    return { session: Timers.blank("up"), activity: Timers.blank("up"), round: Timers.blank("down"), break: Timers.blank("down"), breakout: Timers.blank("down") };
  };

  function bag() {
    const s = TCL.session && TCL.session();
    if (!s) return null;
    if (!s.timers) s.timers = Timers.blankSet();
    NAMES.forEach(n => { if (!s.timers[n]) s.timers[n] = Timers.blank(n === "session" || n === "activity" ? "up" : "down"); });
    return s.timers;
  }
  Timers.get = function (name) { const b = bag(); return b ? b[name] : null; };

  /* Derived values, always from timestamps. */
  Timers.remaining = function (name) {
    const t = Timers.get(name);
    if (!t) return 0;
    if (t.direction === "up") return Math.max(0, t.durationMs - Timers.elapsed(name));
    if (t.status === "running") return Math.max(0, t.remainingMs - (Date.now() - t.startedAt));
    return Math.max(0, t.remainingMs);
  };
  Timers.elapsed = function (name) {
    const t = Timers.get(name);
    if (!t) return 0;
    if (t.direction === "up") {
      return t.status === "running" ? t.elapsedMs + (Date.now() - t.startedAt) : t.elapsedMs;
    }
    return Math.max(0, t.durationMs - Timers.remaining(name));
  };
  Timers.fraction = function (name) {
    const t = Timers.get(name);
    if (!t || !t.durationMs) return 0;
    return U.clamp(Timers.remaining(name) / t.durationMs, 0, 1);
  };

  /* Start (or restart) a countdown. opts: { durationMs, label, warnAtMs } */
  Timers.start = function (name, opts) {
    const t = Timers.get(name); if (!t) return;
    opts = opts || {};
    t.direction = opts.direction || (name === "session" || name === "activity" ? "up" : "down");
    let ms = opts.durationMs != null ? opts.durationMs : t.durationMs;
    /* Rehearsal runs on compressed clocks so a practice round takes seconds, not minutes.
       The session and activity clocks count up and stay honest. */
    if (t.direction === "down" && TCL.Rehearsal && TCL.Rehearsal.active()) ms = TCL.Rehearsal.scale(ms);
    t.durationMs = Math.max(0, ms);
    t.remainingMs = t.durationMs;
    t.elapsedMs = 0;
    t.startedAt = Date.now();
    t.status = "running";
    t.label = opts.label || t.label || "";
    if (opts.warnAtMs != null) t.warnAtMs = opts.warnAtMs;
    doneFired[name] = false;
    TCL.emit("timer:change", name);
  };
  Timers.pause = function (name) {
    const t = Timers.get(name); if (!t || t.status !== "running") return;
    if (t.direction === "up") t.elapsedMs += Date.now() - t.startedAt;
    else t.remainingMs = Math.max(0, t.remainingMs - (Date.now() - t.startedAt));
    t.startedAt = null;
    t.status = "paused";
    TCL.emit("timer:change", name);
  };
  Timers.resume = function (name) {
    const t = Timers.get(name); if (!t) return;
    if (t.status !== "paused" && t.status !== "idle") return;
    if (t.direction === "down" && t.remainingMs <= 0 && t.status === "paused") return;
    t.startedAt = Date.now();
    t.status = "running";
    TCL.emit("timer:change", name);
  };
  Timers.toggle = function (name) {
    const t = Timers.get(name); if (!t) return;
    if (t.status === "running") Timers.pause(name); else Timers.resume(name);
  };
  Timers.stop = function (name) {
    const t = Timers.get(name); if (!t) return;
    Timers.pause(name);
    t.status = "idle";
    t.startedAt = null;
    TCL.emit("timer:change", name);
  };
  Timers.reset = function (name) {
    const t = Timers.get(name); if (!t) return;
    t.status = "idle"; t.startedAt = null; t.remainingMs = t.durationMs; t.elapsedMs = 0;
    doneFired[name] = false;
    TCL.emit("timer:change", name);
  };
  /* Add or remove time. Countdown: adjusts remaining. Count-up: adjusts the target. Never below zero. */
  Timers.adjust = function (name, deltaMs) {
    const t = Timers.get(name); if (!t) return;
    if (t.direction === "up") { t.durationMs = Math.max(0, t.durationMs + deltaMs); }
    else {
      const wasRunning = t.status === "running", wasDone = t.status === "done";
      if (wasRunning) Timers.pause(name);
      t.remainingMs = Math.max(0, t.remainingMs + deltaMs);
      if (t.remainingMs > 0 && t.status === "done") t.status = "paused";
      if (deltaMs > 0) doneFired[name] = false;
      if ((wasRunning || wasDone) && t.remainingMs > 0) Timers.resume(name);   /* extending a finished timer keeps it going */
      else if (wasRunning && t.remainingMs === 0) { t.status = "done"; }
    }
    TCL.emit("timer:change", name);
  };
  Timers.pauseAll = function () { NAMES.forEach(n => { const t = Timers.get(n); if (t && t.status === "running") Timers.pause(n); }); };
  Timers.stopAllExcept = function (keep) { NAMES.forEach(n => { if (!keep.includes(n)) Timers.stop(n); }); };

  /* Snapshot for the presentation window: it derives the display locally. */
  Timers.describe = function (name) {
    const t = Timers.get(name);
    if (!t) return null;
    return {
      name, status: t.status, direction: t.direction, durationMs: t.durationMs, label: t.label, warnAtMs: t.warnAtMs,
      remainingMs: Timers.remaining(name), elapsedMs: Timers.elapsed(name), sentAt: Date.now(),
    };
  };
  Timers.fmt = function (name) {
    const t = Timers.get(name); if (!t) return "00:00";
    return t.direction === "up" ? U.fmtMs(Timers.elapsed(name)) : U.fmtMs(Timers.remaining(name));
  };

  /* Tick loop: emits "tick" for display updates and "timer:done" once per completion. */
  const doneFired = {};
  let tickHandle = null;
  Timers.tick = function () {
    const b = bag(); if (!b) return;
    NAMES.forEach(n => {
      const t = b[n];
      if (t.direction === "down" && t.status === "running" && Timers.remaining(n) <= 0) {
        t.remainingMs = 0; t.startedAt = null; t.status = "done";
        if (!doneFired[n]) { doneFired[n] = true; TCL.emit("timer:done", n); }
      }
    });
    TCL.emit("tick");
  };
  Timers.startLoop = function () {
    if (tickHandle) return;
    tickHandle = setInterval(Timers.tick, 250);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) Timers.tick(); });
  };
  Timers.stopLoop = function () { clearInterval(tickHandle); tickHandle = null; };
})();


/* ==== src/core/30-history.js ==== */
/* src/core/30-history.js
   Undo / redo with labelled snapshots of the session, plus a visible action log.
   Snapshots exclude the undo stacks and the log themselves. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const History = TCL.History = {};
  const MAX_STACK = 40, PERSISTED = 12, MAX_LOG = 200;

  function snapshot(session) {
    const copy = {};
    Object.keys(session).forEach(k => { if (k !== "undo" && k !== "log") copy[k] = session[k]; });
    return JSON.stringify(copy);
  }
  function ensure(session) {
    if (!session.undo) session.undo = { stack: [], redo: [] };
    if (!Array.isArray(session.log)) session.log = [];
  }

  /* Call BEFORE mutating state. label appears in the action history and on the Undo button. */
  History.record = function (label, opts) {
    const s = TCL.session(); if (!s) return;
    ensure(s);
    opts = opts || {};
    s.undo.stack.push({ label, snap: snapshot(s), ts: Date.now(), safeRedo: opts.safeRedo !== false });
    if (s.undo.stack.length > MAX_STACK) s.undo.stack.shift();
    s.undo.redo = [];
    History.log(label);
  };
  History.log = function (label, kind) {
    const s = TCL.session(); if (!s) return;
    ensure(s);
    s.log.push({ ts: Date.now(), label, kind: kind || "action" });
    if (s.log.length > MAX_LOG) s.log.splice(0, s.log.length - MAX_LOG);
  };
  History.canUndo = function () { const s = TCL.session(); return !!(s && s.undo && s.undo.stack.length); };
  History.canRedo = function () { const s = TCL.session(); return !!(s && s.undo && s.undo.redo.length && s.undo.redo[s.undo.redo.length - 1].safeRedo); };
  History.peekUndo = function () { const s = TCL.session(); return s && s.undo && s.undo.stack.length ? s.undo.stack[s.undo.stack.length - 1].label : ""; };
  History.peekRedo = function () { const s = TCL.session(); return s && s.undo && s.undo.redo.length ? s.undo.redo[s.undo.redo.length - 1].label : ""; };

  function restore(session, snap) {
    const data = JSON.parse(snap);
    Object.keys(session).forEach(k => { if (k !== "undo" && k !== "log") delete session[k]; });
    Object.assign(session, data);
    if (TCL.Timers) TCL.Timers.tick();
  }
  History.undo = function () {
    const s = TCL.session(); if (!s || !History.canUndo()) return false;
    const entry = s.undo.stack.pop();
    s.undo.redo.push({ label: entry.label, snap: snapshot(s), ts: Date.now(), safeRedo: entry.safeRedo });
    restore(s, entry.snap);
    History.log("Undo: " + entry.label, "undo");
    TCL.emit("history:changed");
    return true;
  };
  History.redo = function () {
    const s = TCL.session(); if (!s || !History.canRedo()) return false;
    const entry = s.undo.redo.pop();
    s.undo.stack.push({ label: entry.label, snap: snapshot(s), ts: Date.now(), safeRedo: entry.safeRedo });
    restore(s, entry.snap);
    History.log("Redo: " + entry.label, "redo");
    TCL.emit("history:changed");
    return true;
  };
  History.clear = function () { const s = TCL.session(); if (s) s.undo = { stack: [], redo: [] }; };

  /* Trim the persisted stack so the save stays small; the in-memory stack keeps MAX_STACK. */
  History.forPersist = function (session) {
    const u = session.undo || { stack: [], redo: [] };
    return { stack: u.stack.slice(-PERSISTED), redo: u.redo.slice(-PERSISTED) };
  };
})();


/* ==== src/core/31-scoring.js ==== */
/* src/core/31-scoring.js
   Score events are append-only records; totals are derived. Undo flips a flag. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Scoring = TCL.Scoring = {};
  const recent = {};   // double-click guard keyed by activity+target+reason

  Scoring.enabledFor = function (activity) {
    const s = TCL.session();
    if (!s || s.scoringEnabled === false) return false;
    if (!activity) return true;
    return activity.settings && activity.settings.scoringEnabled !== false;
  };

  /* award({activityId, teamId?, participantId?, points, reason}) -> event or null when guarded */
  Scoring.award = function (o) {
    const s = TCL.session(); if (!s) return null;
    if (!Array.isArray(s.scoreEvents)) s.scoreEvents = [];
    const key = [o.activityId, o.teamId || "", o.participantId || "", o.reason || "", o.round == null ? "" : o.round].join("|");
    const now = Date.now();
    if (recent[key] && now - recent[key] < 600 && !o.force) return null;   // rapid duplicate click
    recent[key] = now;
    const ev = { id: U.uid("sc"), ts: now, activityId: o.activityId, teamId: o.teamId || null, participantId: o.participantId || null,
      points: Number(o.points) || 0, reason: o.reason || "", round: o.round == null ? null : o.round, undone: false };
    s.scoreEvents.push(ev);
    TCL.emit("score:changed", ev);
    return ev;
  };
  /* Has this target already been scored for this activity round with this reason? */
  Scoring.alreadyScored = function (activityId, round, targetId, reason) {
    const s = TCL.session(); if (!s) return false;
    return (s.scoreEvents || []).some(e => !e.undone && e.activityId === activityId && e.round === round &&
      (e.teamId === targetId || e.participantId === targetId) && (reason == null || e.reason === reason));
  };
  Scoring.undoEvent = function (id) {
    const s = TCL.session(); if (!s) return;
    const ev = U.byId(s.scoreEvents || [], id);
    if (ev) { ev.undone = true; TCL.emit("score:changed", ev); }
  };
  Scoring.restoreEvent = function (id) {
    const s = TCL.session(); if (!s) return;
    const ev = U.byId(s.scoreEvents || [], id);
    if (ev) { ev.undone = false; TCL.emit("score:changed", ev); }
  };
  Scoring.eventsFor = function (activityId) {
    const s = TCL.session(); if (!s) return [];
    return (s.scoreEvents || []).filter(e => e.activityId === activityId);
  };
  Scoring.discardActivity = function (activityId) {
    const s = TCL.session(); if (!s) return 0;
    let n = 0;
    (s.scoreEvents || []).forEach(e => { if (e.activityId === activityId && !e.undone) { e.undone = true; n++; } });
    TCL.emit("score:changed");
    return n;
  };
  Scoring.removeActivity = function (activityId) {
    const s = TCL.session(); if (!s) return;
    s.scoreEvents = (s.scoreEvents || []).filter(e => e.activityId !== activityId);
  };
  Scoring.teamTotal = function (teamId, activityId) {
    const s = TCL.session(); if (!s) return 0;
    return U.sum((s.scoreEvents || []).filter(e => !e.undone && e.teamId === teamId && (activityId == null || e.activityId === activityId)).map(e => e.points));
  };
  Scoring.participantTotal = function (pid, activityId) {
    const s = TCL.session(); if (!s) return 0;
    return U.sum((s.scoreEvents || []).filter(e => !e.undone && e.participantId === pid && (activityId == null || e.activityId === activityId)).map(e => e.points));
  };
  /* ---------- scoring models ----------
     Raw points are the append-only truth. A model decides what each activity is worth in
     the championship, because a 12-question quiz and a 5-minute charades round are not
     comparable on raw points and one of them would otherwise decide the whole session. */
  Scoring.MODELS = [
    { id: "balanced", short: "Balanced", label: "Balanced: every scored activity is worth up to 100", help: "Each activity's points are scaled so the best team in it earns 100. A long quiz counts the same as a short game." },
    { id: "placement", short: "Placement", label: "Placement: 30 / 20 / 10 per activity", help: "Only the order within each activity matters. Ties share the higher award." },
    { id: "raw", short: "Raw points", label: "Raw: the points the games award", help: "Whatever each game gives. Simple, but a big activity can decide the session." },
  ];
  Scoring.PLACEMENT = [30, 20, 10];
  Scoring.model = function (session) { const s = session || TCL.session(); return (s && s.scoreModel) || "raw"; };
  Scoring.modelLabel = function (session) { const m = Scoring.MODELS.find(x => x.id === Scoring.model(session)); return m ? m.label : "Raw"; };
  /* Short form for chips and badges; the long one is for settings. */
  Scoring.modelShort = function (session) { const m = Scoring.MODELS.find(x => x.id === Scoring.model(session)); return m ? m.short : "Raw points"; };

  /* Raw points per target for one activity. */
  Scoring.rawFor = function (activityId) {
    const s = TCL.session(); if (!s) return {};
    const out = {};
    (s.scoreEvents || []).forEach(e => { if (e.undone || e.activityId !== activityId) return; const id = e.teamId || e.participantId; out[id] = (out[id] || 0) + e.points; });
    return out;
  };
  /* What one activity contributes to the championship under the current model.
     Manual adjustments always pass through raw: they are facilitator corrections. */
  Scoring.contributionFor = function (activityId, session) {
    const raw = Scoring.rawFor(activityId);
    const model = Scoring.model(session);
    if (model === "raw" || activityId === "manual") return raw;
    const ids = Object.keys(raw);
    if (!ids.length) return {};
    if (model === "balanced") {
      const top = Math.max.apply(null, ids.map(id => raw[id]));
      if (top <= 0) return {};
      /* The best team in an activity earns 100. Negative marking can drive a raw total well
         below zero, so the floor is clamped too: one bad round must not be able to subtract
         several activities' worth of championship points. */
      const out = {};
      ids.forEach(id => { out[id] = U.clamp(Math.round((raw[id] / top) * 100), -100, 100); });
      return out;
    }
    /* placement: rank within the activity, ties share the higher award */
    const ordered = U.sortBy(ids.filter(id => raw[id] > 0), id => raw[id], true);
    const out = {};
    let place = 0, prev = null;
    ordered.forEach((id, i) => { if (raw[id] !== prev) { place = i; prev = raw[id]; } out[id] = Scoring.PLACEMENT[place] || 0; });
    return out;
  };
  /* Championship total for one target across every activity. */
  Scoring.modelTotal = function (targetId, session) {
    const s = session || TCL.session(); if (!s) return 0;
    const ids = s.runSheet.filter(a => !a.scoresDiscarded).map(a => a.id).concat(["manual"]);
    return U.sum(ids.map(id => Scoring.contributionFor(id, s)[targetId] || 0));
  };

  /* Standings: [{id, name, color, total, raw, rank, tied}] for teams or individuals.
     `total` is what the model says; `raw` is what the games actually awarded. */
  Scoring.standings = function () {
    const s = TCL.session(); if (!s) return [];
    const model = Scoring.model(s);
    let rows;
    if (s.teamMode === "individual") {
      rows = s.participants.filter(p => p.present).map(p => ({ id: p.id, name: p.displayName || p.name, color: "var(--gold)", raw: Scoring.participantTotal(p.id), kind: "participant" }));
    } else {
      rows = s.teams.map(t => ({ id: t.id, name: t.name, color: t.color, raw: Scoring.teamTotal(t.id), kind: "team" }));
    }
    rows.forEach(r => { r.total = model === "raw" ? r.raw : Scoring.modelTotal(r.id, s); });
    rows = U.sortBy(rows, r => r.total, true);
    let rank = 0, prev = null;
    rows.forEach((r, i) => { if (r.total !== prev) { rank = i + 1; prev = r.total; } r.rank = rank; });
    rows.forEach(r => { r.tied = rows.filter(x => x.total === r.total).length > 1; });
    return rows;
  };
  Scoring.perActivity = function () {
    const s = TCL.session(); if (!s) return {};
    const out = {};
    (s.scoreEvents || []).forEach(e => {
      if (e.undone) return;
      const tid = e.teamId || e.participantId;
      out[e.activityId] = out[e.activityId] || {};
      out[e.activityId][tid] = (out[e.activityId][tid] || 0) + e.points;
    });
    return out;
  };
  /* Per activity, under the current model: { activityId: { targetId: points } } */
  Scoring.perActivityModel = function () {
    const s = TCL.session(); if (!s) return {};
    const out = {};
    s.runSheet.forEach(a => { out[a.id] = Scoring.contributionFor(a.id, s); });
    out.manual = Scoring.contributionFor("manual", s);
    return out;
  };
  Scoring.manualAdjust = function (targetId, points, reason) {
    const s = TCL.session(); if (!s) return null;
    const isTeam = s.teams.some(t => t.id === targetId);
    return Scoring.award({ activityId: "manual", teamId: isTeam ? targetId : null, participantId: isTeam ? null : targetId, points, reason: reason || "Manual adjustment", force: true });
  };
})();


/* ==== src/core/32-content.js ==== */
/* src/core/32-content.js
   Content registry: built-in banks + custom items + overrides + disabled + usage.
   Items: { id, game, category, difficulty(1-3), enabled, builtIn, ...fields } */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Content = TCL.Content = {};
  const builtIn = [];              // registered by src/content/*.js
  const fieldSpecs = {};           // game -> [{key,label,type,required}]
  Content.categoriesByGame = {};

  Content.registerBank = function (game, items, spec) {
    items.forEach((it, i) => {
      const id = it.id || `${game}_${String(i + 1).padStart(3, "0")}`;
      builtIn.push(Object.assign({ enabled: true, difficulty: 2, category: "General" }, it, { id, game, builtIn: true }));
    });
    if (spec) fieldSpecs[game] = spec;
  };
  Content.spec = game => fieldSpecs[game] || [{ key: "text", label: "Text", type: "textarea", required: true }];
  Content.gamesWithContent = () => Object.keys(fieldSpecs);

  function store() { return TCL.state.content; }

  /* Effective list: built-in (with overrides) + custom, applying disabled flags. */
  Content.all = function (game) {
    const c = store();
    const disabled = new Set(c.disabled);
    const out = [];
    builtIn.forEach(it => {
      if (game && it.game !== game) return;
      const merged = Object.assign({}, it, c.overrides[it.id] || {});
      merged.enabled = !disabled.has(it.id);
      out.push(merged);
    });
    c.custom.forEach(it => {
      if (game && it.game !== game) return;
      out.push(Object.assign({}, it, { enabled: !disabled.has(it.id), builtIn: false }));
    });
    return out;
  };
  Content.get = function (id) { return Content.all().find(x => x.id === id) || null; };
  Content.categories = function (game) {
    const set = new Set(Content.all(game).map(x => x.category || "General"));
    return Array.from(set).sort();
  };
  Content.usageOf = id => store().usage[id] || null;
  Content.markUsed = function (ids) {
    /* A rehearsal must not burn real questions: usage history stays untouched. */
    if (TCL.Rehearsal && TCL.Rehearsal.active()) return;
    const u = store().usage;
    (ids || []).forEach(id => { const cur = u[id] || { count: 0 }; cur.count += 1; cur.lastUsed = Date.now(); u[id] = cur; });
  };
  Content.markUnused = function (ids) { const u = store().usage; (ids || []).forEach(id => { delete u[id]; }); };
  Content.resetUsage = function (game) {
    const u = store().usage;
    if (!game) { store().usage = {}; return; }
    Content.all(game).forEach(it => { delete u[it.id]; });
  };
  Content.setEnabled = function (id, on) {
    const d = store().disabled;
    const i = d.indexOf(id);
    if (on && i >= 0) d.splice(i, 1);
    if (!on && i < 0) d.push(id);
  };
  Content.add = function (item) {
    const it = Object.assign({ enabled: true, difficulty: 2, category: "General" }, item, { id: item.id || U.uid("c"), builtIn: false, custom: true });
    store().custom.push(it);
    return it;
  };
  Content.update = function (id, patch) {
    const c = store();
    const custom = U.byId(c.custom, id);
    if (custom) { Object.assign(custom, patch); return custom; }
    const b = builtIn.find(x => x.id === id);
    if (b) { c.overrides[id] = Object.assign({}, c.overrides[id] || {}, patch); return Content.get(id); }
    return null;
  };
  Content.duplicate = function (id) {
    const src = Content.get(id); if (!src) return null;
    const copy = Object.assign({}, src);
    delete copy.id; delete copy.builtIn; delete copy.enabled;
    copy.category = src.category;
    if (copy.text) copy.text = copy.text + " (copy)";
    return Content.add(copy);
  };
  Content.remove = function (id) {
    const c = store();
    const i = c.custom.findIndex(x => x.id === id);
    if (i >= 0) { c.custom.splice(i, 1); return true; }
    return false;   // built-in items are disabled, not deleted
  };
  Content.restoreBuiltIn = function (game) {
    const c = store();
    Object.keys(c.overrides).forEach(id => { const b = builtIn.find(x => x.id === id); if (b && (!game || b.game === game)) delete c.overrides[id]; });
    c.disabled = c.disabled.filter(id => { const b = builtIn.find(x => x.id === id); return !(b && (!game || b.game === game)); });
  };

  /* Selection. q: { game, count, categories:[], difficultyMin, difficultyMax, mode:'random'|'exact', exactIds:[], unusedOnly, order:'random'|'progressive'|'given', excludeIds:[] }
     Returns { items, shortfall, available } and never throws. */
  Content.select = function (q) {
    q = q || {};
    let pool = Content.all(q.game).filter(x => x.enabled);
    if (q.excludeIds && q.excludeIds.length) { const ex = new Set(q.excludeIds); pool = pool.filter(x => !ex.has(x.id)); }
    if (q.mode === "exact" && Array.isArray(q.exactIds) && q.exactIds.length) {
      const wanted = q.exactIds.map(id => pool.find(x => x.id === id)).filter(Boolean);
      return { items: wanted, shortfall: Math.max(0, q.exactIds.length - wanted.length), available: wanted.length, pool: pool.length };
    }
    if (q.categories && q.categories.length) { const cs = new Set(q.categories); pool = pool.filter(x => cs.has(x.category || "General")); }
    const dmin = q.difficultyMin || 1, dmax = q.difficultyMax || 3;
    pool = pool.filter(x => (x.difficulty || 2) >= dmin && (x.difficulty || 2) <= dmax);
    const available = pool.length;
    let unused = pool;
    if (q.unusedOnly) unused = pool.filter(x => !store().usage[x.id]);
    const count = Math.max(0, Number(q.count) || 0);
    let chosen = U.shuffle(unused).slice(0, count);
    /* Not enough unused: top up with used ones rather than failing silently. */
    if (chosen.length < count) {
      const ids = new Set(chosen.map(x => x.id));
      chosen = chosen.concat(U.shuffle(pool.filter(x => !ids.has(x.id))).slice(0, count - chosen.length));
    }
    if (q.order === "progressive") chosen = U.sortBy(chosen, x => x.difficulty || 2);
    return { items: chosen, shortfall: Math.max(0, count - chosen.length), available, pool: pool.length, toppedUp: q.unusedOnly && unused.length < count };
  };

  /* Import / export */
  Content.exportJSON = function (game) {
    const items = Content.all(game).map(it => { const o = Object.assign({}, it); delete o.enabled; return o; });
    return JSON.stringify({ app: "TEAM CONNECT LIVE", version: TCL.VERSION, exportedAt: new Date().toISOString(), items }, null, 2);
  };
  Content.exportCSV = function (game) {
    const spec = Content.spec(game);
    const cols = ["id", "game", "category", "difficulty"].concat(spec.map(s => s.key));
    const rows = [cols].concat(Content.all(game).map(it => cols.map(c => Array.isArray(it[c]) ? it[c].join("|") : (it[c] == null ? "" : it[c]))));
    return U.toCSV(rows);
  };
  /* validate(items) -> { valid:[], errors:[{row, message}] } */
  Content.validate = function (items) {
    const valid = [], errors = [];
    const known = new Set(Object.keys(fieldSpecs));
    (items || []).forEach((raw, i) => {
      const row = i + 1;
      if (!raw || typeof raw !== "object") { errors.push({ row, message: "Not an object" }); return; }
      const game = String(raw.game || "").trim();
      if (!known.has(game)) { errors.push({ row, message: `Unknown game "${game || "(blank)"}". Known: ${Array.from(known).join(", ")}` }); return; }
      const spec = fieldSpecs[game];
      const item = { game, category: String(raw.category || "General").trim() || "General", difficulty: U.clamp(Number(raw.difficulty) || 2, 1, 3) };
      let ok = true;
      spec.forEach(f => {
        let v = raw[f.key];
        if (f.type === "list" && typeof v === "string") v = v.split("|").map(s => s.trim()).filter(Boolean);
        if (f.type === "number") v = v === "" || v == null ? null : Number(v);
        if (f.required && (v == null || v === "" || (Array.isArray(v) && !v.length))) { errors.push({ row, message: `Missing required field "${f.key}" for ${game}` }); ok = false; }
        if (v != null) item[f.key] = v;
      });
      if (raw.id && typeof raw.id === "string") item.sourceId = raw.id;
      if (ok) valid.push(item);
    });
    return { valid, errors };
  };
  Content.importJSON = function (text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return { added: 0, errors: [{ row: 0, message: "File is not valid JSON: " + e.message }] }; }
    const items = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
    if (!items) return { added: 0, errors: [{ row: 0, message: "Expected an array of items or an object with an \"items\" array" }] };
    return Content.importItems(items);
  };
  Content.importCSV = function (text, game) {
    const rows = U.parseCSV(text);
    if (rows.length < 2) return { added: 0, errors: [{ row: 0, message: "CSV needs a header row and at least one data row" }] };
    const header = rows[0].map(h => h.trim());
    const items = rows.slice(1).map(r => { const o = {}; header.forEach((h, i) => { o[h] = r[i] == null ? "" : r[i]; }); if (game && !o.game) o.game = game; return o; });
    return Content.importItems(items);
  };
  Content.importItems = function (items) {
    const { valid, errors } = Content.validate(items);
    valid.forEach(v => { delete v.sourceId; Content.add(v); });
    return { added: valid.length, errors };
  };

  /* Named packs: { id, name, game, itemIds[] } */
  Content.packs = game => store().packs.filter(p => !game || p.game === game);
  Content.savePack = function (name, game, itemIds) { const p = { id: U.uid("pack"), name, game, itemIds: itemIds.slice() }; store().packs.push(p); return p; };
  Content.deletePack = function (id) { const p = store().packs; const i = p.findIndex(x => x.id === id); if (i >= 0) p.splice(i, 1); };
  Content.builtInCount = game => builtIn.filter(x => !game || x.game === game).length;
})();


/* ==== src/core/33-teams.js ==== */
/* src/core/33-teams.js
   Participants and teams. All functions operate on the current session. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Teams = TCL.Teams = {};
  Teams.COLORS = ["#ff4d6d", "#23d5ab", "#ffb454", "#5e8bff", "#c77dff", "#4dd0e1"];
  Teams.NAMES = ["Thunder Llamas", "Chai Champions", "Ctrl+Alt+Defeat", "Mute Button Mafia", "The Spreadsheeters", "Bandwidth Bandits"];
  /* Demo names only, deliberately spread across the cultures this app is used by.
     Real rosters are typed in or imported on the day and never live in the source. */
  Teams.SAMPLE_ROSTER = ["Ana", "Bao", "Chen", "Deepa", "Ellie", "Farid", "Grace", "Hari", "Ivy", "Jomar", "Kiran", "Lian", "Mei", "Nikhil", "Omar"];

  /* The single definition of a team's shape. Anything added here is part of the plan and
     survives a duplicate; run state (like a rotation pointer) is added elsewhere at run
     time and listed in Session.TEAM_RUN_KEYS so it gets cleared. */
  Teams.newTeam = function (name, color, extra) {
    return Object.assign({ id: U.uid("t"), name: String(name == null ? Teams.NAMES[0] : name).trim().slice(0, 40), color: color || Teams.COLORS[0], memberIds: [] }, extra || {});
  };
  Teams.newParticipant = function (name, extra) {
    return Object.assign({ id: U.uid("p"), name: String(name).trim().slice(0, 60), location: "", present: true, fact: "" }, extra || {});
  };
  Teams.present = function (s) { s = s || TCL.session(); return s ? s.participants.filter(p => p.present) : []; };
  Teams.refreshNames = function (s) { s = s || TCL.session(); if (s) U.dedupeNames(s.participants); };
  Teams.displayName = function (pid, s) { s = s || TCL.session(); const p = s && U.byId(s.participants, pid); return p ? (p.displayName || p.name) : "?"; };
  Teams.teamOf = function (pid, s) { s = s || TCL.session(); return s ? s.teams.find(t => t.memberIds.includes(pid)) || null : null; };
  Teams.members = function (team, s) { s = s || TCL.session(); return team.memberIds.map(id => U.byId(s.participants, id)).filter(Boolean); };
  Teams.presentMembers = function (team, s) { return Teams.members(team, s).filter(p => p.present); };

  /* Parse pasted names: commas or new lines; "Name, Location" pairs allowed when a pair contains a colon or tab. */
  Teams.parseNames = function (text) {
    return String(text || "").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).slice(0, 200);
  };
  Teams.add = function (names, extra) {
    const s = TCL.session(); if (!s) return [];
    const added = (Array.isArray(names) ? names : [names]).map(n => Teams.newParticipant(n, extra)).filter(p => p.name);
    s.participants.push(...added);
    Teams.refreshNames(s);
    return added;
  };
  Teams.remove = function (pid) {
    const s = TCL.session(); if (!s) return;
    s.participants = s.participants.filter(p => p.id !== pid);
    s.teams.forEach(t => { t.memberIds = t.memberIds.filter(id => id !== pid); });
    Teams.refreshNames(s);
  };
  Teams.setPresent = function (pid, on) {
    const s = TCL.session(); const p = s && U.byId(s.participants, pid);
    if (p) p.present = !!on;
  };

  /* Create n teams and deal present participants round-robin; unassigned absentees stay off-team.
     Location-aware: when locations exist, deal per location group so each team mixes cities. */
  Teams.build = function (n, opts) {
    const s = TCL.session(); if (!s) return;
    opts = opts || {};
    n = U.clamp(Number(n) || 3, 1, 6);
    const keepNames = s.teams.map(t => t.name);
    s.teams = Array.from({ length: n }, (_, i) => Teams.newTeam(keepNames[i] || Teams.NAMES[i], Teams.COLORS[i]));
    const pool = Teams.present(s);
    const groups = {};
    pool.forEach(p => { const k = opts.mixLocations === false ? "" : (p.location || "").trim().toLowerCase(); (groups[k] = groups[k] || []).push(p); });
    let cursor = 0;
    Object.keys(groups).sort().forEach(k => {
      U.shuffle(groups[k]).forEach(p => { s.teams[cursor % n].memberIds.push(p.id); cursor++; });
    });
    /* Rebalance sizes in case group dealing left a gap larger than 1 */
    Teams.rebalance();
    s.teamsLocked = false;
  };
  Teams.rebalance = function () {
    const s = TCL.session(); if (!s || !s.teams.length) return;
    const present = new Set(Teams.present(s).map(p => p.id));
    /* Unassigned present people join the smallest team */
    const assigned = new Set(s.teams.flatMap(t => t.memberIds));
    Teams.present(s).forEach(p => { if (!assigned.has(p.id)) smallest(s).memberIds.push(p.id); });
    let guard = 0;
    while (guard++ < 100) {
      const sizes = s.teams.map(t => t.memberIds.filter(id => present.has(id)).length);
      const max = Math.max(...sizes), min = Math.min(...sizes);
      if (max - min <= 1) break;
      const from = s.teams[sizes.indexOf(max)], to = s.teams[sizes.indexOf(min)];
      const movable = from.memberIds.filter(id => present.has(id));
      const pid = movable[movable.length - 1];
      from.memberIds = from.memberIds.filter(id => id !== pid);
      to.memberIds.push(pid);
    }
  };
  function smallest(s) { return U.sortBy(s.teams, t => Teams.presentMembers(t, s).length)[0]; }
  Teams.move = function (pid, teamId) {
    const s = TCL.session(); if (!s) return;
    s.teams.forEach(t => { t.memberIds = t.memberIds.filter(id => id !== pid); });
    const t = U.byId(s.teams, teamId);
    if (t) t.memberIds.push(pid);
  };
  Teams.rename = function (teamId, name) { const s = TCL.session(); const t = s && U.byId(s.teams, teamId); if (t) t.name = String(name).trim().slice(0, 40) || t.name; };
  Teams.assignLate = function (pid) { const s = TCL.session(); if (!s || !s.teams.length) return; if (!Teams.teamOf(pid, s)) smallest(s).memberIds.push(pid); };

  /* Fair rotation pointer per team: next present member in order, remembered in team.rotPtr[key] */
  Teams.nextMember = function (team, key, advance) {
    const s = TCL.session();
    const all = Teams.presentMembers(team, s);
    const members = all.filter(p => !Teams.deferred(s).includes(p.id)).length ? all.filter(p => !Teams.deferred(s).includes(p.id)) : all;
    if (!members.length) return null;
    team.rot = team.rot || {};
    const ptr = team.rot[key] || 0;
    const p = members[ptr % members.length];
    if (advance) { team.rot[key] = (ptr + 1) % members.length; if (TCL.Participation) TCL.Participation.record(p.id, key, s); }
    return p;
  };
  /* Someone who has dropped off Zoom or asked to sit one out. They stay on the roster and
     stay eligible later; they are only taken out of the rotation for now. */
  Teams.deferred = function (s) { s = s || TCL.session(); return (s && s.deferred) || []; };
  Teams.defer = function (pid, on, s) {
    s = s || TCL.session(); if (!s) return;
    s.deferred = (s.deferred || []).filter(id => id !== pid);
    if (on !== false) s.deferred.push(pid);
    TCL.Session.touch();
  };
  Teams.clearDeferred = function (s) { s = s || TCL.session(); if (s) { s.deferred = []; TCL.Session.touch(); } };
  Teams.eligible = function (s) {
    s = s || TCL.session();
    const out = Teams.present(s).filter(p => !Teams.deferred(s).includes(p.id));
    return out.length ? out : Teams.present(s);   // never rotate to nobody
  };
  /* Put one person at the front of the queue for the next turn of this rotation key. */
  Teams.setNext = function (key, pid, s) {
    s = s || TCL.session(); if (!s) return;
    s.rotNext = s.rotNext || {};
    s.rotNext[key] = pid;
    TCL.Session.touch();
  };
  Teams.peekParticipant = function (key, s) {
    s = s || TCL.session(); const list = Teams.eligible(s);
    if (!list.length) return null;
    const forced = s.rotNext && s.rotNext[key];
    if (forced) { const p = U.byId(list, forced); if (p) return p; }
    return list[(s.rot && s.rot[key] || 0) % list.length];
  };
  /* Rotation across all eligible participants: session-level pointer */
  Teams.nextParticipant = function (key, advance) {
    const s = TCL.session(); const list = Teams.eligible(s);
    if (!list.length) return null;
    s.rot = s.rot || {};
    s.rotNext = s.rotNext || {};
    let p = null;
    if (s.rotNext[key]) { p = U.byId(list, s.rotNext[key]); if (advance) delete s.rotNext[key]; }
    const ptr = s.rot[key] || 0;
    if (!p) p = list[ptr % list.length];
    if (advance) { s.rot[key] = (ptr + 1) % list.length; if (TCL.Participation) TCL.Participation.record(p.id, key, s); }
    return p;
  };

  /* Problems for the session/team setup: [{level, message}] */
  Teams.problems = function () {
    const s = TCL.session(); if (!s) return [];
    const out = [];
    const n = Teams.present(s).length;
    if (n === 0) out.push({ level: "error", message: "No participants are marked present." });
    else if (n === 1) out.push({ level: "warn", message: "Only one participant is present. Most games need at least two." });
    if (s.teamMode === "teams") {
      if (!s.teams.length) out.push({ level: "warn", message: "No teams yet. Create teams or switch to individual mode." });
      s.teams.forEach(t => { if (!Teams.presentMembers(t, s).length) out.push({ level: "warn", message: `Team "${t.name}" has nobody present.` }); });
      if (s.teams.length > n && n > 0) out.push({ level: "warn", message: "More teams than present participants." });
    }
    const dupes = {};
    s.participants.forEach(p => { const k = p.name.trim().toLowerCase(); dupes[k] = (dupes[k] || 0) + 1; });
    Object.keys(dupes).filter(k => dupes[k] > 1).forEach(k => out.push({ level: "info", message: `Duplicate name "${k}" is shown with a number so nobody gets mixed up.` }));
    return out;
  };
})();


/* ==== src/core/34-duration.js ==== */
/* src/core/34-duration.js
   Session duration model. Every estimate includes realistic overhead:
   transition between activities, explanation time, reveal and discussion. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Duration = TCL.Duration = {};
  Duration.TRANSITION_MIN = 1;     // between activities: explain rules, settle the room
  Duration.WELCOME_MIN = 0;          // added by presets as a custom activity instead

  /* Minutes for one activity (game, break or custom). */
  Duration.activity = function (act, session) {
    if (!act) return 0;
    if (act.kind === "break" || act.kind === "custom") return Math.max(0, Number(act.settings && act.settings.minutes) || 0);
    const game = TCL.Games.get(act.gameId);
    if (!game) return 0;
    const ctx = Duration.ctx(session);
    try {
      const est = game.estimateMinutes(TCL.Games.sanitise(game, act.settings), ctx);
      return isFinite(est) ? Math.max(0.5, est) : 5;
    } catch (e) { console.warn("estimate failed", act.gameId, e); return 5; }
  };
  Duration.ctx = function (session) {
    session = session || TCL.session();
    const present = session ? session.participants.filter(p => p.present).length : 15;
    const teams = session ? Math.max(1, session.teams.length) : 3;
    return { participants: present || 15, teams: session && session.teamMode === "individual" ? Math.max(1, present) : teams, teamMode: session ? session.teamMode : "teams" };
  };
  /* Whole run sheet: { activities:[{id, minutes}], total, transitions, target, spare, over } */
  Duration.runSheet = function (session) {
    session = session || TCL.session();
    if (!session) return { activities: [], total: 0, transitions: 0, target: 0, spare: 0, over: 0 };
    const acts = session.runSheet.map(a => ({ id: a.id, minutes: Duration.activity(a, session), flexible: Duration.isFlexible(a) }));
    const games = acts.length;
    const transitions = games > 1 ? (games - 1) * Duration.TRANSITION_MIN : 0;
    const total = U.sum(acts.map(a => a.minutes)) + transitions;
    const target = Number(session.targetMinutes) || 0;
    return { activities: acts, total, transitions, target, spare: Math.max(0, target - total), over: Math.max(0, total - target) };
  };
  Duration.isFlexible = function (act) {
    if (act.kind !== "game") return false;
    const g = TCL.Games.get(act.gameId);
    return !!(g && g.flexKey);
  };
  /* Auto-fit: scale the flexible count setting (questions / rounds) of flexible games to hit the target. */
  Duration.autoFit = function (session) {
    session = session || TCL.session();
    const flex = session.runSheet.filter(Duration.isFlexible);
    if (!flex.length) return { changed: false, reason: "No flexible activities in the run sheet." };
    for (let iter = 0; iter < 40; iter++) {
      const d = Duration.runSheet(session);
      const diff = d.target - d.total;
      if (Math.abs(diff) < 1) break;
      /* Adjust the activity whose per-item cost is closest to the gap, one unit at a time. */
      let best = null;
      flex.forEach(a => {
        const g = TCL.Games.get(a.gameId);
        const key = g.flexKey, spec = (g.settingsSchema || []).find(x => x.key === key) || { min: 1, max: 30 };
        const cur = U.num(a.settings[key], U.num(g.defaultSettings[key], 1), spec.min || 1, spec.max || 60);
        const next = diff > 0 ? cur + 1 : cur - 1;
        if (next < (spec.min || 1) || next > (spec.max || 60)) return;
        const trial = Object.assign({}, a, { settings: Object.assign({}, a.settings, { [key]: next }) });
        const delta = Duration.activity(trial, session) - Duration.activity(a, session);
        if (diff > 0 && delta > 0 && delta <= diff + 0.5 && (!best || delta > best.delta)) best = { a, key, next, delta };
        if (diff < 0 && delta < 0 && (!best || delta < best.delta)) best = { a, key, next, delta };
      });
      if (!best) break;
      best.a.settings[best.key] = best.next;
    }
    return { changed: true };
  };
})();
