    skip: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l9-7zM16 5h3v14h-3z"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>',
    export: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
    import: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4a3 3 0 0 0 3 4h1M16 6h4a3 3 0 0 1-3 4h-1M12 13v4M8 21h8M9 17h6"/></svg>',
  };
  UI.icon = (name, cls) => `<span class="ic ${cls || ""}" aria-hidden="true" style="display:inline-flex;width:1.1em;height:1.1em;vertical-align:-.15em">${I[name] || ""}</span>`;

  /* ---------- toast ---------- */
  UI.toast = function (text, kind, ms) {
    let wrap = document.querySelector(".toasts");
    if (!wrap) { wrap = document.createElement("div"); wrap.className = "toasts"; wrap.setAttribute("role", "status"); wrap.setAttribute("aria-live", "polite"); document.body.appendChild(wrap); }
    const t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.textContent = text;
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 320); }, ms || 3200);
  };
  TCL.on("ui:toast", o => UI.toast(o.text, o.kind));

  /* ---------- modal (promise-based; replaces window.confirm/prompt) ---------- */
  let modalEl = null, lastFocus = null;
  UI.closeModal = function () { if (modalEl) { modalEl.remove(); modalEl = null; } if (lastFocus && lastFocus.focus) lastFocus.focus(); };
  /* opts: { title, body(html), buttons:[{label, value, kind, primary}], wide, form(html), onOpen(el) } -> Promise(value|null) */
  UI.modal = function (opts) {
    UI.closeModal();
    lastFocus = document.activeElement;
    return new Promise(resolve => {
      modalEl = document.createElement("div");
      modalEl.className = "modal-back";
      modalEl.innerHTML = `<div class="modal ${opts.wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">${esc(opts.title || "")}</h2>
        ${opts.body ? `<div class="body">${opts.body}</div>` : ""}
        ${opts.form || ""}
        <div class="btn-row right" style="margin-top:16px">${(opts.buttons || [{ label: "OK", value: true, primary: true }]).map((b, i) =>
          `<button type="button" class="btn ${b.primary ? "" : (b.kind || "ghost")}" data-mval="${i}">${esc(b.label)}</button>`).join("")}</div>
      </div>`;
      document.body.appendChild(modalEl);
      const buttons = opts.buttons || [{ label: "OK", value: true, primary: true }];
      const finish = v => { UI.closeModal(); resolve(v); };
      modalEl.addEventListener("click", e => {
        const b = e.target.closest("[data-mval]");
        if (b) { const def = buttons[Number(b.dataset.mval)]; finish(typeof def.value === "function" ? def.value(modalEl) : def.value); }
        else if (e.target === modalEl && opts.dismissable !== false) finish(null);
      });
      modalEl.addEventListener("keydown", e => {
        if (e.key === "Escape" && opts.dismissable !== false) finish(null);
        if (e.key === "Tab") {
          const f = Array.from(modalEl.querySelectorAll("button,input,select,textarea,[tabindex]")).filter(x => !x.disabled);
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
      if (opts.onOpen) opts.onOpen(modalEl);
      const focusTarget = modalEl.querySelector("input,select,textarea") || modalEl.querySelector(".btn:not(.ghost)") || modalEl.querySelector(".btn");
      if (focusTarget) focusTarget.focus();
    });
  };
  /* Destructive confirmations are never skippable. An audit of every `danger` call site found
     nine of ten destroy something no undo brings back (a session, a preset, a custom question,
     an activity's score events, a hand-built run sheet) and the tenth ends the session in front
     of the room. A per-call opt-out would have to be remembered every time a new one is added,
     and forgetting it would fail unsafely, so there is no opt-out.
     `routine: true` marks an advisory speed bump instead ("finish early?", "start anyway?").
     Those are what the Settings toggle silences, and they destroy nothing. */
  UI.confirm = function (title, body, opts) {
    opts = opts || {};
    const asking = TCL.state && TCL.state.settings ? TCL.state.settings.confirmRoutine !== false : true;
    if (opts.routine && !opts.danger && !asking) return Promise.resolve(true);
    return UI.modal({ title, body, buttons: [{ label: opts.cancelLabel || "Cancel", value: false }, { label: opts.okLabel || "Confirm", value: true, primary: !opts.danger, kind: opts.danger ? "danger" : "" }] }).then(v => !!v);
  };
  UI.prompt = function (title, body, defaultValue, opts) {
    opts = opts || {};
    return UI.modal({ title, body, form: `<div class="field"><label for="modal-input">${esc(opts.label || "")}</label>${opts.multiline ? `<textarea class="input" id="modal-input">${esc(defaultValue || "")}</textarea>` : `<input class="input" id="modal-input" value="${esc(defaultValue || "")}" maxlength="${opts.maxlength || 200}">`}</div>`,
      buttons: [{ label: "Cancel", value: null }, { label: opts.okLabel || "Save", value: el => el.querySelector("#modal-input").value, primary: true }],
      onOpen: el => { const inp = el.querySelector("#modal-input"); if (!opts.multiline) inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); el.querySelector("[data-mval='1']").click(); } }); } });
  };

  /* ---------- settings form renderer ----------
     schema: [{key, label, type: range|number|select|toggle|text|textarea|checks|content, min, max, step, unit, options:[{value,label}], help, showIf: fn(values)}] */
  UI.formField = function (f, value, values) {
    const id = "f_" + f.key;
    const help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
    if (f.showIf && !f.showIf(values)) return "";
    if (f.type === "range") {
      return `<div class="field" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label><div class="range-wrap"><input type="range" id="${id}" name="${f.key}" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${esc(value)}"><span class="val" data-val-for="${f.key}">${esc(value)}${f.unit ? " " + f.unit : ""}</span></div>${help}</div>`;
    }
    if (f.type === "number") {
      return `<div class="field" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label><input class="input num" type="number" id="${id}" name="${f.key}" min="${f.min != null ? f.min : ""}" max="${f.max != null ? f.max : ""}" step="${f.step || 1}" value="${esc(value)}">${help}</div>`;
    }
    if (f.type === "select") {
      return `<div class="field" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label><select class="input" id="${id}" name="${f.key}">${f.options.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(value) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>${help}</div>`;
    }
    if (f.type === "toggle") {
      return `<div class="field" data-key="${f.key}"><span class="lbl">${esc(f.label)}</span><label class="switch"><input type="checkbox" id="${id}" name="${f.key}" ${value ? "checked" : ""}><span class="track"></span><span class="txt">${value ? "On" : "Off"}</span></label>${help}</div>`;
    }
    if (f.type === "textarea") {
      return `<div class="field span2" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label><textarea class="input" id="${id}" name="${f.key}" rows="${f.rows || 3}">${esc(value || "")}</textarea>${help}</div>`;
    }
    if (f.type === "checks") {
      const set = new Set(value || []);
      const opts = typeof f.options === "function" ? f.options() : f.options;
      return `<div class="field span2" data-key="${f.key}"><span class="lbl">${esc(f.label)}</span><div class="checks">${opts.map(o => `<label class="check-chip ${set.has(o.value) ? "on" : ""}"><input type="checkbox" name="${f.key}" value="${esc(o.value)}" ${set.has(o.value) ? "checked" : ""}>${esc(o.label)}</label>`).join("") || '<span class="dim">No options available</span>'}</div>${help || '<div class="help">Leave all unticked to allow every category.</div>'}</div>`;
    }
    return `<div class="field" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label><input class="input" type="text" id="${id}" name="${f.key}" value="${esc(value || "")}" maxlength="${f.maxlength || 200}">${help}</div>`;
  };
  UI.form = function (schema, values) {
    return `<div class="form-grid">${schema.map(f => UI.formField(f, values[f.key], values)).join("")}</div>`;
  };
  /* The settings most facilitators actually change. Everything else is progressive
     disclosure: still there, still applied, just folded away by default. */
  UI.BASIC_KEYS = ["count", "rounds", "turns", "items", "seconds", "minutes", "breakoutMinutes", "collectMinutes",
    "presentSeconds", "discussionSeconds", "storySeconds", "categories", "difficultyMin", "difficultyMax",
    "mode", "format", "room", "scoringEnabled"];
  UI.isBasic = f => f.basic === true || (f.advanced !== true && UI.BASIC_KEYS.includes(f.key));
  /* Basic fields, then a collapsed <details> holding the rest. */
  UI.formTiered = function (schema, values, opts) {
    opts = opts || {};
    const basic = schema.filter(UI.isBasic), adv = schema.filter(f => !UI.isBasic(f));
    if (!adv.length) return `<div class="form-grid">${basic.map(f => UI.formField(f, values[f.key], values)).join("")}</div>`;
    return `<div class="form-grid">${basic.map(f => UI.formField(f, values[f.key], values)).join("")}</div>
      <details class="adv-block" ${opts.open ? "open" : ""}><summary>${UI.icon("settings")} Advanced settings <span class="dim small">(${adv.length})</span></summary>
        <div class="form-grid">${adv.map(f => UI.formField(f, values[f.key], values)).join("")}</div></details>`;
  };
  /* Read values back from a container using the schema. */
  UI.readForm = function (container, schema, base) {
    const out = Object.assign({}, base || {});
    schema.forEach(f => {
      if (f.showIf && !f.showIf(out)) return;
      if (f.type === "checks") { out[f.key] = Array.from(container.querySelectorAll(`input[name="${f.key}"]:checked`)).map(i => i.value); return; }
      const el = container.querySelector(`[name="${f.key}"]`);
      if (!el) return;
      if (f.type === "toggle") out[f.key] = el.checked;
      else if (f.type === "range" || f.type === "number") { let n = Number(el.value); if (isNaN(n)) n = f.min || 0; if (f.min != null) n = Math.max(f.min, n); if (f.max != null) n = Math.min(f.max, n); out[f.key] = n; }
      else out[f.key] = el.value;
    });
    return out;
  };
  /* Live-update range labels and toggle text inside any container */
  UI.bindFormLive = function (container, onChange) {
    container.addEventListener("input", e => {
      const t = e.target;
      if (t.type === "range") { const v = container.querySelector(`[data-val-for="${t.name}"]`); if (v) { const unit = v.textContent.replace(/^[\d.\-]+\s?/, ""); v.textContent = t.value + (unit ? " " + unit : ""); } }
      if (t.type === "checkbox" && t.closest(".switch")) { const txt = t.closest(".switch").querySelector(".txt"); if (txt) txt.textContent = t.checked ? "On" : "Off"; }
      if (t.type === "checkbox" && t.closest(".check-chip")) t.closest(".check-chip").classList.toggle("on", t.checked);
      if (onChange) onChange(t);
    });
  };

  /* ---------- widgets ---------- */
  UI.timerChip = function (name) {
    const T = TCL.Timers, t = T.get(name); if (!t) return "";
    return `<span class="chip mono ${t.status === "running" ? "ok" : t.status === "paused" ? "warn" : ""}" data-timer="${name}"><span class="dot"></span>${esc(t.label || name)} ${T.fmt(name)}</span>`;
  };
  UI.timerBig = function (name, label) {
    const T = TCL.Timers, t = T.get(name); if (!t) return "";
    const rem = T.remaining(name), low = t.direction === "down" && t.status !== "idle" && rem <= (t.warnAtMs || 10000);
    const state = t.status === "running" ? "running" : t.status;
    return `<div class="timer-big ${state} ${low ? "low" : ""}" data-timer-big="${name}"><div><div class="timer-state ${state}">${esc(label || t.label || name)} · ${state}</div><div class="t" aria-live="off">${T.fmt(name)}</div></div></div>`;
  };
  UI.ring = function (name) {
    const T = TCL.Timers, t = T.get(name); if (!t) return "";
    const rem = T.remaining(name), low = t.status !== "idle" && rem <= (t.warnAtMs || 10000);
    const txt = U.fmtMs(rem);
    return `<div class="ring ${low ? "low" : ""} ${t.status}" data-ring="${name}" style="--frac:${T.fraction(name)};--len:${txt.length}"><span class="t">${esc(txt)}</span></div>`;
  };
  UI.scoreList = function (rows, opts) {
    rows = rows || TCL.Scoring.standings();
    if (!rows.length) return '<div class="dim small">No teams yet.</div>';
    return `<div class="scorelist">${rows.map(r => `<div class="scorerow" data-target="${r.id}" style="--tc:${r.color}"><span class="nm">${r.rank === 1 && r.total > 0 ? "👑 " : ""}${esc(r.name)}</span><span class="pts">${r.total}</span></div>`).join("")}</div>`;
  };
  /* Overflow menu. Native <details> so it needs no open/close script and stays keyboard
     accessible. items: [{label, icon, attr, danger, sep}] where attr is the data-* the
     existing delegated handlers already listen for. */
  UI.menu = function (items, opts) {
    opts = opts || {};
    const list = items.filter(Boolean);
    if (!list.length) return "";
    return `<details class="menu ${opts.align === "left" ? "left" : ""}"><summary class="btn ${opts.kind || "ghost"} ${opts.size || "sm"}" title="${esc(opts.title || "More actions")}" role="button">${opts.label ? esc(opts.label) + " " : ""}${UI.icon("more")}</summary>
      <div class="menu-pop" role="menu">${list.map(i => i.sep ? '<div class="menu-sep"></div>' : `<button type="button" class="menu-item ${i.danger ? "danger" : ""}" ${i.attr || ""} role="menuitem">${i.icon ? UI.icon(i.icon) : ""}<span>${esc(i.label)}</span>${i.hint ? `<span class="hint">${esc(i.hint)}</span>` : ""}</button>`).join("")}</div></details>`;
  };
  /* Close the menu after any choice, and on Escape or an outside click. */
  document.addEventListener("click", e => {
    const item = e.target.closest(".menu-pop .menu-item");
    const open = Array.from(document.querySelectorAll("details.menu[open]"));
    if (item) { const d = item.closest("details.menu"); if (d) d.open = false; return; }
    open.forEach(d => { if (!d.contains(e.target)) d.open = false; });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll("details.menu[open]").forEach(d => { d.open = false; }); });

  UI.callout = (kind, html) => `<div class="callout ${kind}">${UI.icon(kind === "error" || kind === "warn" ? "warn" : "info")}<div>${html}</div></div>`;
  UI.problems = list => list.map(p => UI.callout(p.level === "error" ? "error" : p.level === "warn" ? "warn" : "info", esc(p.message))).join("");
  /* Team award buttons. targets from ctx; done(targetId) marks already-awarded */
  UI.awardButtons = function (targets, action, points, opts) {
    opts = opts || {};
    return `<div class="award-grid">${targets.filter(t => !opts.exclude || !opts.exclude.includes(t.id)).map(t => {
      const done = opts.done && opts.done(t.id);
      return `<button type="button" class="btn team ${done ? "done" : ""}" style="--tc:${t.color}" data-act="${action}" data-arg="${esc(t.id)}" ${done && !opts.allowRepeat ? "disabled" : ""} title="${esc(t.name)}">${done ? UI.icon("check") + " " : ""}${esc(t.name)}${points != null ? ` <span class="kbd">+${points}</span>` : ""}</button>`;
    }).join("")}</div>`;
  };

  /* Update timer displays without a full re-render */
  TCL.on("tick", function () {
    const T = TCL.Timers;
    document.querySelectorAll("[data-timer]").forEach(el => {
      const n = el.dataset.timer; const t = T.get(n); if (!t) return;
      el.textContent = ""; el.innerHTML = `<span class="dot"></span>${esc(t.label || n)} ${T.fmt(n)}`;
      el.className = `chip mono ${t.status === "running" ? "ok" : t.status === "paused" ? "warn" : ""}`;
    });
    document.querySelectorAll("[data-timer-big]").forEach(el => {
      const n = el.dataset.timerBig; const t = T.get(n); if (!t) return;
      const rem = T.remaining(n), low = t.direction === "down" && t.status !== "idle" && rem <= (t.warnAtMs || 10000);
      el.className = `timer-big ${t.status} ${low ? "low" : ""}`;
      const tt = el.querySelector(".t"); if (tt) tt.textContent = T.fmt(n);
      const st = el.querySelector(".timer-state"); if (st) { st.className = "timer-state " + t.status; st.textContent = `${t.label || n} · ${t.status}`; }
    });
    document.querySelectorAll("[data-ring]").forEach(el => {
      const n = el.dataset.ring; const t = T.get(n); if (!t) return;
      const rem = T.remaining(n), low = t.status !== "idle" && rem <= (t.warnAtMs || 10000);
      el.style.setProperty("--frac", T.fraction(n));
      el.className = `ring ${low ? "low" : ""} ${t.status}`;
      const txt = U.fmtMs(rem);
      el.style.setProperty("--len", txt.length);
      const tt = el.querySelector(".t"); if (tt) tt.textContent = txt;
    });
    const save = document.querySelector("[data-save-status]");
    if (save) save.textContent = TCL.Store.lastError ? "Save failed" : (TCL.Store.lastSavedAt ? "Saved " + new Date(TCL.Store.lastSavedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "Not saved yet");
  });
  TCL.on("ui:pulse", id => { document.querySelectorAll(`[data-target="${id}"]`).forEach(el => { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }); });

  /* ---------- render loop ---------- */
  let rendering = false, pending = false;
  UI.render = function () {
    if (rendering) { pending = true; return; }
    rendering = true;
    try {
      const def = screens[TCL.route.screen] || screens.home;
      const old = document.getElementById("app");
      const root = old.cloneNode(false);          /* fresh node: listeners added by mount() never stack */
      old.parentNode.replaceChild(root, old);
      const html = def.render(TCL.route.params || {});
      root.innerHTML = html;
      if (def.mount) def.mount(root, TCL.route.params || {});
      document.title = "TEAM CONNECT LIVE" + (def.title ? " · " + def.title : "");

    { text: "Rank these desk drawer items by how much you would miss them", items: ["A spare charging cable", "A pen that actually works", "An emergency snack", "Headphones", "Sticky notes", "Hand cream"], answer: null, mode: "opinion", category: "Office", difficulty: 2 },

    { text: "Rank these comfort foods after a very long day, best first", items: ["A bowl of hot noodles", "Rice and dal", "A toasted cheese sandwich", "Dumplings", "Ice cream straight from the tub"], answer: null, mode: "opinion", category: "Food", difficulty: 1 },

/* ==== src/content/missions.js ==== */
/* src/content/missions.js  Team Mission puzzles: each participant/subgroup gets one clue; the team solves together */
(function () {
  "use strict";
  window.TCL.Content.registerBank("missions", [
    { text: "The Missing Laptop", brief: "Five colleagues shared one laptop on Monday: Sam, Priya, Tom, Grace and Mei. Each of them used it exactly once, one after another. Work out the full order, and say who used it last.", clues: ["Sam used it at some point before Priya.", "Mei used it last thing before going home.", "Exactly one person used it in between Sam and Grace.", "Priya used it before Grace.", "Sam used it at some point before Tom."], solution: "Sam, Priya, Grace, Tom, Mei, so Mei used it last. Mei is fixed at the end, and Sam before Priya before Grace with exactly one person between Sam and Grace forces Sam, Priya and Grace to sit in three consecutive slots. That leaves only two possible starting points, and the one where Tom comes before Sam is ruled out by the last clue.", hints: ["Start with the one person whose position is stated outright.", "If Sam comes before Priya and Priya comes before Grace, how far apart can Sam and Grace be?", "Once Sam, Priya and Grace are consecutive, try both starting slots and check where Tom lands."], category: "Logic", difficulty: 1 },

    { text: "Which Meeting Room", brief: "The workshop is booked into one of eight rooms, but the invite lost the room name. Here is the room list.\nBanyan: floor 2, seats 8, projector, window, whiteboard, video call kit.\nCoral: floor 3, seats 10, no projector, window, whiteboard, video call kit.\nDelta: floor 2, seats 6, projector, no window, whiteboard, video call kit.\nEverest: floor 4, seats 8, projector, window, whiteboard, video call kit.\nFig: floor 3, seats 12, projector, window, whiteboard, video call kit.\nHarbour: floor 2, seats 10, projector, window, no whiteboard, video call kit.\nIronbark: floor 3, seats 8, projector, window, whiteboard, no video call kit.\nJacaranda: floor 3, seats 12, no projector, window, whiteboard, video call kit.\nFind the room.", clues: ["The room has a projector.", "The room has a window.", "The room is not on floor 4.", "The room seats fewer than 12 people.", "The room has a whiteboard.", "The room has a video call kit."], solution: "Banyan. The projector rules out Coral and Jacaranda, the window rules out Delta, the floor rules out Everest, the seat count rules out Fig and Jacaranda, the whiteboard rules out Harbour, and the video call kit rules out Ironbark. Banyan is the only room left, and every clue is needed because each one is the only thing that rules out at least one room.", hints: ["Write the eight room names in a column and cross one off as each clue is read out.", "Several clues rule out only a single room, so read all six before deciding.", "Only one room has all four facilities, sits below floor 4, and seats fewer than twelve."], category: "Logic", difficulty: 1 },

    { text: "The Store Room Code", brief: "The store room keypad takes a four digit code and nobody wrote it down. Each person holds one fact about it. Work out the code.", clues: ["All four digits are different from each other.", "The code is an even number.", "The first digit is exactly twice the last digit.", "The third digit is exactly 3 more than the last digit.", "The second and third digits add up to 9."], solution: "8274. Call the last digit d. The code then reads 2d, then 6 minus d, then d plus 3, then d. The code is even so d is even, and doubling d has to stay a single digit, so d is 0, 2 or 4. Zero gives 0630 and two gives 4452, and both repeat a digit, so d is 4 and the code is 8274.", hints: ["Three of the clues describe other digits in terms of the last digit, so work backwards from that one.", "The last digit is even, and twice it still has to be a single digit.", "That leaves only three candidates for the last digit. Test each one against the repeated digit rule."], category: "Numbers", difficulty: 2 },

    { text: "Who Sits Where", brief: "Arjun, Grace, Jun and Lena each sit on a different floor: 2, 3, 4 or 5. Each of them gets to work a different way: train, bike, bus or on foot. Match every person to a floor and a way of getting in.", clues: ["Arjun sits two floors above Jun.", "The person who cycles sits on floor 3.", "Grace does not take the train.", "The person who walks in sits on floor 2, the lowest of the four.", "Grace sits on floor 4."], solution: "Lena is on floor 2 and walks, Jun is on floor 3 and cycles, Grace is on floor 4 and takes the bus, Arjun is on floor 5 and takes the train. Grace on floor 4 leaves floors 2, 3 and 5, and the only pair exactly two apart is Jun on 3 with Arjun on 5, so Lena takes floor 2. The floors then hand you the cyclist and the walker, and since Grace does not take the train she takes the bus and Arjun takes the train.", hints: ["Place the two clues that name a floor outright, then see which floors are left.", "Among the free floors, only one pair is exactly two apart.", "Once every floor is settled, two of the clues name the cyclist and the walker directly."], category: "Logic", difficulty: 2 },

    { text: "The Showcase Running Order", brief: "Five people present at the team showcase, one each at 9:00, 9:20, 9:40, 10:00 and 10:20. The presenters are Mei, Tom, Priya, Arjun and Lena. Work out who is on at each time.", clues: ["Mei presents at some point before Tom.", "Priya has the 9:40 slot.", "Mei does not present first.", "Arjun presents after Priya.", "There are exactly two presenters between Lena and Tom."], solution: "Lena at 9:00, Mei at 9:20, Priya at 9:40, Tom at 10:00 and Arjun at 10:20. Priya is fixed at 9:40 and Arjun has to follow her, so Arjun is at 10:00 or 10:20. Lena and Tom must be three slots apart, and the only arrangement that also leaves Mei a slot that is neither first nor after Tom is Lena at 9:00 with Tom at 10:00.", hints: ["Pin the slot you are handed, then work out which slots Arjun could possibly take.", "Two presenters between Lena and Tom means their slots are three apart. List every pair that far apart.", "Test both orders of Lena and Tom. One of them leaves Mei nowhere legal to stand."], category: "Schedule", difficulty: 2 },

    { text: "Quiz Night Scores", brief: "Four teams played quiz night: the Falcons, the Otters, the Pandas and the Yaks. The final scores were 12, 15, 18 and 21, one score per team. Work out who scored what.", clues: ["The Falcons scored more points than the Otters.", "The Pandas did not score 21.", "The team on 15 points was not the Falcons.", "The Falcons did not win.", "The Otters scored fewer points than the Pandas."], solution: "Falcons 18, Otters 12, Pandas 15, Yaks 21. The Falcons are not on 15 and did not win, so they are on 12 or 18, and because they beat the Otters they cannot be on the lowest score, which puts them on 18. The Pandas are not on 21, so the Pandas and the Otters hold 12 and 15, and the Otters scored fewer, giving the Otters 12, the Pandas 15 and the Yaks 21.", hints: ["Two of the clues say what the Falcons did not score. Start by crossing those off.", "The Falcons beat the Otters, so the Falcons cannot be on the lowest score either.", "Once the Falcons are placed, only two scores are left for the Pandas and the Otters."], category: "Numbers", difficulty: 2 },

    { text: "The New Floor Plan", brief: "Sam, Mei, Diego and Nadia have moved into the new office. Each has a different role (designer, analyst, engineer, writer), sits on a different floor (1, 2, 3 or 4) and brought a different lunch (salad, noodles, sandwich, curry). Work out all three facts for each person.", clues: ["The engineer sits two floors above Mei.", "Diego brought noodles.", "The person on floor 1 brought a sandwich.", "The writer sits one floor below the designer.", "Sam sits on floor 3.", "The person who brought salad sits on floor 4."], solution: "Mei is the writer on floor 1 with the sandwich, Diego is the designer on floor 2 with the noodles, Sam is the engineer on floor 3 with the curry, and Nadia is the analyst on floor 4 with the salad. Mei has to be on floor 1 or 2 for the engineer clue to work, and floor 2 fails because it forces Diego onto floor 1 or floor 4, where the lunch is already a sandwich or a salad. So Mei is on floor 1, the engineer is Sam on floor 3, the writer and designer take the neighbouring floors 1 and 2, and Nadia is left as the analyst on floor 4.", hints: ["Sam is on floor 3, so begin by testing which floors Mei could possibly be on.", "The engineer sits two floors above Mei and the writer sits directly below the designer. Those two facts compete for the same floors.", "Diego brought noodles, so he cannot be the person on floor 1 or the person on floor 4."], category: "Logic", difficulty: 3 },

    { text: "The Delivery Run", brief: "A van reaches its first office at 9:00 sharp and then visits five offices one after another, in some order. Time spent on site: Northgate 30 minutes, Riverside 20, Southbank 40, Eastwood 20, Westpark 30. Driving from any office to the next takes 15 minutes. Work out the order of the run and the time each visit begins.", clues: ["The van starts the day at Riverside.", "Northgate is not the last stop of the day.", "Exactly one stop comes between Westpark and Southbank.", "Eastwood is not the second stop.", "The last visit of the day begins at 11:50."], solution: "Riverside 9:00, Northgate 9:35, Southbank 10:20, Eastwood 11:15, Westpark 11:50. From 9:00 to 11:50 is 170 minutes, and 60 of those are the four drives, so the first four visits total 110 minutes. All five visits total 140 minutes, so the last stop is a 30 minute one, which is Northgate or Westpark. Northgate is ruled out, so Westpark is fifth, that puts Southbank third, and with Eastwood barred from second the order is fixed.", hints: ["Add up all five visit times and all four drives before you worry about the order.", "11:50 minus 9:00 is 170 minutes, and 60 of those minutes are spent driving.", "Only two offices have a 30 minute visit, and one of the two is ruled out from the last slot."], category: "Schedule", difficulty: 3 },
  ], [
    { key: "text", label: "Mission title", type: "text", required: true },
    { key: "brief", label: "Brief shown to everyone", type: "textarea", required: true },
    { key: "clues", label: "Clues (one per person or subgroup)", type: "list", required: true },
    { key: "solution", label: "Solution (facilitator only)", type: "textarea", required: true },
    { key: "hints", label: "Hints in order", type: "list", required: false },
  ]);
})();

/* src/content/misc.js  Small banks: Who Said That backup prompts, Common Ground briefs, Time Capsule prompts, Appreciation prompts. */
(function () {
  "use strict";
  const C = window.TCL.Content;
  const S = (text, category, difficulty) => ({ text, category: category || "General", difficulty: difficulty || 1 });
  /* Used when participants have not pre-submitted facts: a quick live prompt so the round still works. */
  C.registerBank("whosaid", [
    S("Backup: the spotlight person tells one surprising fact about themselves live. Teams then guess one detail: where it happened.", "Backup"),
    S("Backup: the spotlight person names a food they could eat every day. Teams guess which cuisine it comes from.", "Backup"),
    S("Backup: the spotlight person describes their first ever job in three words. Teams guess the job.", "Backup"),
    S("Backup: the spotlight person names a place they would move to tomorrow. Teams guess the continent before it is revealed.", "Backup"),
    S("Backup: the spotlight person shares one thing they collected as a child. Teams guess whether they still have it.", "Backup"),
    S("Backup: the spotlight person names a skill they learned in the last year. Teams guess whether it was online or in person.", "Backup"),
  ], [{ key: "text", label: "Backup prompt", type: "textarea", required: true }]);

  C.registerBank("commonground", [
    S("Find three things everyone in your team has in common that are NOT about work. The more unusual the better.", "Standard"),
    S("Find three things everyone in your team has in common, plus one thing that is unique to each person.", "Standard"),
    S("Find a food everyone in your team loves, a place everyone wants to visit, and a skill everyone wishes they had.", "Themed"),
    S("Find something everyone in your team did before the age of ten, and something everyone did in the last month.", "Themed"),
    S("Find three surprising similarities, then agree on a team motto that fits all of you.", "Creative"),
  ], [{ key: "text", label: "Task brief", type: "textarea", required: true }]);

  C.registerBank("capsule", [
    S("Write a message to the team to be opened in one year. Include one prediction, one hope, and one thing you want to remember about now.", "Serious"),
    S("Write three predictions about the team a year from now. Be bold. One of them should be completely ridiculous.", "Humorous"),
    S("Describe a day in this team five years from now as if it were a film trailer.", "Imaginative"),
    S("List three things the team should stop doing, start doing and keep doing, to be read back in six months.", "Serious"),
    S("Write a headline about this team from a newspaper one year in the future.", "Humorous"),
    S("Draft a short letter from your future selves thanking the present team for something you have not done yet.", "Imaginative"),
  ], [{ key: "text", label: "Prompt", type: "textarea", required: true }]);

  C.registerBank("appreciation", [
    S("Write one sentence of appreciation for a teammate: something specific they did that made your work easier or your day better.", "Person"),
    S("Write one thing this team does well that you would miss if it stopped.", "Team"),
    S("Thank someone for a moment when they had your back. Name the moment, not just the person.", "Person"),
    S("Write one word that describes this team and one sentence on why.", "Team"),
  ], [{ key: "text", label: "Prompt", type: "textarea", required: true }]);

  /* Caption This prompts fall back to a text setup when no image is available. */
  C.registerBank("captions", [
    S("The moment the Wi-Fi drops during the most important demo of the quarter.", "Office", 1),
    S("A cat walks across the keyboard right as the CEO asks a question.", "Office", 1),
    S("Someone discovers they were on camera the whole time.", "Office", 1),
    S("The printer prints one page, then decides it has done enough for today.", "Office", 1),
    S("Two colleagues realise they booked the same meeting room.", "Office", 1),
    S("The last biscuit in the office tin has been spotted.", "Office", 1),
  ], [{ key: "text", label: "Caption setup", type: "textarea", required: true }]);
})();


/* ==== src/content/wronganswers.js ==== */
/* src/content/wronganswers.js  Wrong Answers Only: teams compete for the funniest wrong answer, then learn the real one */
(function () {
  "use strict";
  window.TCL.Content.registerBank("wronganswers", [
    /* ---------- Origins ---------- */
    { text: "Why do we say 'bless you' after a sneeze?", answer: "Most likely from the belief that a sneeze could expel the soul or let in evil; Pope Gregory I is often credited with popularising it during a 6th-century plague.", fun: "There is no single proven origin, which is why every family has its own story.", category: "Origins", difficulty: 2 },

    { text: "Why do we shake hands?", answer: "The popular story is that an open right hand showed you carried no weapon. The gesture appears in Greek art from the 5th century BC, usually to seal an agreement.", fun: "Quakers helped spread it as an equal alternative to bowing and hat tipping.", category: "Origins", difficulty: 1 },

    { text: "Why do we blow out candles on a birthday cake?", answer: "Usually traced to German Kinderfeste in the 1700s, where a candle burned all day for a child's birthday. The wish and the group blowing came later as folk custom.", fun: "The 'Happy Birthday' song only became the standard soundtrack in the 20th century.", category: "Origins", difficulty: 2 },

    { text: "Why is a wedding ring worn on the fourth finger?", answer: "From a Roman belief in the vena amoris, a vein supposedly running from that finger straight to the heart. The anatomy is wrong, but the custom outlived the theory.", fun: "Plenty of countries wear it on the right hand instead.", category: "Origins", difficulty: 2 },

    { text: "Why do we say 'hello' when we answer the phone?", answer: "Thomas Edison pushed 'hello' as the standard greeting. Alexander Graham Bell preferred 'ahoy'. Early telephone handbooks printed hello, and it won.", fun: "'Ahoy' survives only as a joke, which feels like a loss.", category: "Origins", difficulty: 2 },

    { text: "Why do people knock on wood for luck?", answer: "Probably from older European folk beliefs about spirits or protective power in trees, but the phrase is only clearly documented from the 1800s, so the trail goes cold.", fun: "Some countries knock on wood, others touch iron, for the same reason.", category: "Origins", difficulty: 3 },

    /* ---------- Language ---------- */
    { text: "What is the plural of octopus?", answer: "Octopuses is standard English; octopodes follows the Greek root; octopi is a mistaken Latin form that stuck.", fun: "All three are in the dictionary, so the argument never ends.", category: "Language", difficulty: 1 },

    { text: "Why is 'colonel' spelled with an l but said with an r?", answer: "English borrowed the French coronel, then scholars 'corrected' the spelling back to the Italian colonnello. The old pronunciation refused to change with it.", fun: "So you are saying the French version and writing the Italian one.", category: "Language", difficulty: 3 },

    { text: "Where does the word 'OK' come from?", answer: "Best evidence points to an 1839 Boston newspaper joke abbreviating 'oll korrect', a deliberate misspelling. A campaign slogan a year later spread it nationally.", fun: "It may be the most widely understood word on Earth.", category: "Language", difficulty: 2 },

    { text: "Why do eleven and twelve break the pattern of the teens?", answer: "They come from Old English endleofan and twelf, roughly 'one left' and 'two left' after counting ten. From thirteen on, English switched to the regular teen pattern.", fun: "German, Dutch and the Nordic languages do the same thing.", category: "Language", difficulty: 3 },

    { text: "Why can 'literally' now mean figuratively?", answer: "It has been used as an intensifier since at least the 1700s, including by Dickens and Twain. Dictionaries record how people use words, they do not grant permission.", fun: "'Really' and 'truly' quietly did exactly the same thing centuries ago.", category: "Language", difficulty: 2 },

    /* ---------- Science ---------- */
    { text: "Why is the sky blue?", answer: "Air molecules scatter short blue wavelengths far more than long red ones, so blue light arrives at your eye from all over the sky.", fun: "Sunsets go red because the light travels through much more air to reach you.", category: "Science", difficulty: 1 },

    { text: "Why do we get goosebumps?", answer: "Tiny muscles at the base of each hair contract and pull it upright. In furrier ancestors that trapped warmth or made them look bigger. In us it does almost nothing.", fun: "It is one of the clearest leftovers of evolution you can watch in real time.", category: "Science", difficulty: 1 },

    { text: "Why does cutting an onion make you cry?", answer: "Cutting ruptures cells and mixes enzymes with sulfur compounds, producing syn-propanethial-S-oxide. It reaches your eye, irritates it, and tears flush it out.", fun: "Chilling the onion slows the reaction, which is why the fridge trick works.", category: "Science", difficulty: 2 },

    { text: "Why can't you tickle yourself?", answer: "The cerebellum predicts the sensation your own hand will produce and dampens the response. Tickling depends on surprise, and you cannot surprise yourself.", fun: "Researchers built a delayed robotic tickling arm, and it worked.", category: "Science", difficulty: 2 },

    { text: "Why is the ocean salty?", answer: "Rain slowly weathers rock on land and rivers carry the dissolved minerals to the sea. Water evaporates and the salts stay behind. Undersea vents add more.", fun: "Rivers are technically salty too, just far too weakly for you to notice.", category: "Science", difficulty: 2 },

    /* ---------- Tech ---------- */
    { text: "What does 'Wi-Fi' stand for?", answer: "Nothing. A branding agency coined it in 1999 because it sounded better than 'IEEE 802.11b Direct Sequence'. 'Wireless Fidelity' was a tagline bolted on afterwards.", fun: "The industry group later dropped the tagline because it meant nothing.", category: "Tech", difficulty: 2 },

    { text: "Why is the keyboard laid out QWERTY?", answer: "Christopher Sholes arranged it in the 1870s to separate common letter pairs so mechanical typebars jammed less, with input from telegraph operators.", fun: "The story that it was designed to slow typists down is a myth.", category: "Tech", difficulty: 1 },

    { text: "Why does an email address use the @ symbol?", answer: "Ray Tomlinson chose it in 1971 because it was already on the keyboard, never appeared in people's names, and in accounting it already meant 'at the rate of'.", fun: "Other languages call it snail, monkey tail, or elephant trunk.", category: "Tech", difficulty: 2 },

    { text: "Why is a software fault called a 'bug'?", answer: "Engineers used 'bug' for unexplained faults from the 1870s onward. The 1947 moth taped into Harvard's Mark II logbook is famous precisely because the joke already existed.", fun: "The logbook entry reads 'first actual case of bug being found'.", category: "Tech", difficulty: 2 },

    { text: "Why do phone keypads count down while calculators count up?", answer: "Bell Labs tested layouts in the 1950s and found 1-2-3 on the top row faster and less error prone for rotary dial users. Calculators kept the older adding machine order.", fun: "Two devices in the same pocket, two opposite layouts, both deliberate.", category: "Tech", difficulty: 3 },

    /* ---------- Food ---------- */
    { text: "Why does coriander taste like soap to some people?", answer: "Variants near the OR6A2 olfactory receptor gene make some people unusually sensitive to the aldehydes in coriander, and those same compounds appear in soap.", fun: "It is genuinely genetic, so the argument at lunch is unwinnable.", category: "Food", difficulty: 2 },

    { text: "Why is a sandwich called a sandwich?", answer: "Named for John Montagu, 4th Earl of Sandwich, who in the 1760s reportedly asked for meat between bread so he could keep working. The story comes from a traveller's account.", fun: "He was working, not gambling, according to his own family.", category: "Food", difficulty: 1 },

    { text: "Why does bread go stale faster in the fridge?", answer: "Staling is starch retrogradation, and it runs fastest just above freezing. A fridge sits right in that range, so bread firms up quicker than it would on the bench.", fun: "The freezer skips past the bad zone, which is why frozen bread keeps well.", category: "Food", difficulty: 3 },

    { text: "Why does pineapple make your mouth tingle?", answer: "Bromelain, a protein digesting enzyme, briefly breaks down proteins on your tongue and lips. It is mild and harmless, and heat destroys it.", fun: "This is why tinned pineapple never tingles.", category: "Food", difficulty: 2 },

    { text: "Why is chocolate wrapped in foil?", answer: "Foil blocks light, air and other smells, and it folds to shape without glue. Cocoa butter absorbs nearby odours easily, so a sealed wrap protects the flavour.", fun: "Chocolate stored next to onions really does taste like onions.", category: "Food", difficulty: 2 },

    /* ---------- Australia ---------- */
    { text: "Why do Australians call flip-flops thongs?", answer: "'Thong' is an old English word for a narrow strip of leather. Australians applied it to the toe strap of the rubber sandal. The underwear sense arrived much later.", fun: "This causes a memorable misunderstanding in almost every global team call.", category: "Australia", difficulty: 1 },

    { text: "Why does Australia have a Big Banana and a Big Merino?", answer: "Roadside 'Big Things' began with the Big Banana at Coffs Harbour in 1964, built to stop highway traffic at a fruit stall. It worked, and copies spread everywhere.", fun: "There are now more than 150 of them scattered around the country.", category: "Australia", difficulty: 2 },

    { text: "Why do Australians shorten every word, like arvo and servo?", answer: "Linguists call these hypocoristics. Australian English uses the -o and -ie endings unusually productively, and researchers have catalogued several thousand of them.", fun: "Even 'Australian' becomes 'Straya', which is peak commitment.", category: "Australia", difficulty: 2 },

    { text: "Why do magpies swoop people in spring?", answer: "A small minority of males defend the nest for roughly six weeks while chicks are vulnerable. They target individuals they judge a threat and can remember faces for years.", fun: "Most magpies never swoop anyone at all.", category: "Australia", difficulty: 2 },

    /* ---------- India ---------- */
    { text: "Why is Gurugram called Gurugram?", answer: "Renamed from Gurgaon in 2016. The name follows the long standing tradition that the area was land granted to Dronacharya, the teacher, or guru, of the Mahabharata.", fun: "'Gram' means village, which is a fair distance from today's skyline.", category: "India", difficulty: 2 },

    { text: "Why do Mumbai dabbawalas almost never lose a lunch box?", answer: "A short code of colours and symbols on each lid encodes origin station, destination building and floor. A relay of carriers reads it, no smartphones required.", fun: "Business schools have studied the error rate for decades.", category: "India", difficulty: 2 },

    { text: "Why does Indian English use the word 'prepone'?", answer: "English had postpone but no clean opposite, so Indian English built one by symmetry. It is useful enough that the Oxford English Dictionary added it in 2010.", fun: "Most people who hear it once start using it immediately.", category: "India", difficulty: 1 },

    { text: "Why does India have only one time zone?", answer: "Indian Standard Time is fixed at UTC plus 5:30, set on a longitude near Mirzapur so the whole country coordinates on one clock, even though sunrise varies by about two hours.", fun: "The half hour offset is why India's clock never matches yours neatly.", category: "India", difficulty: 3 },

    /* ---------- Philippines ---------- */
    { text: "Why do jeepneys look like that?", answer: "Surplus military jeeps left after 1945 were stretched, roofed and fitted with benches to carry passengers. Owners added chrome, paint and ornaments, and it became a craft.", fun: "No two are decorated the same way, by design.", category: "Philippines", difficulty: 2 },

    { text: "Why do Filipinos point with their lips?", answer: "Lip pointing is a common gesture across the Philippines and parts of Southeast Asia. It is faster than lifting a hand and considered gentler than pointing a finger.", fun: "It also works beautifully when both your hands are full.", category: "Philippines", difficulty: 2 },

    { text: "Why is there a whole word for gifts brought home from a trip?", answer: "Pasalubong comes from the root meaning to welcome someone back. Travel was slow and rare, so returning with something for those who waited became an expected courtesy.", fun: "Coming home empty handed is still quietly noticed.", category: "Philippines", difficulty: 2 },

    /* ---------- China ---------- */
    { text: "Why is the number 4 unlucky in Chinese?", answer: "The word for four, si, sounds close to the word for death. Many buildings skip the 4th, 14th and 24th floors. Eight is lucky because it sounds like the word for prosperity.", fun: "Phone numbers and licence plates full of eights sell for real money.", category: "China", difficulty: 1 },

    { text: "Why do people say 'add oil' to encourage someone?", answer: "Jiayou literally means add fuel, borrowed from motor racing imagery, and became a general cheer meaning keep going. The literal English form entered the OED in 2018.", fun: "It is shouted at marathons, exams and deadlines alike.", category: "China", difficulty: 2 },

    { text: "Why are Chinese gift envelopes red?", answer: "Red signals luck and celebration in Chinese custom. The envelope also keeps the amount private, so the gift stays about the good wish rather than the number inside.", fun: "Digital red packets now move billions of transfers each New Year.", category: "China", difficulty: 1 },

    { text: "Why are Chinese dishes served in the middle to share?", answer: "Communal dishes with individual rice bowls keep food hot on the table, spread variety across everyone, and let portions adjust to appetite. Lazy Susans spread this in the 1900s.", fun: "Ordering for the table is a skill, and someone at your table has it.", category: "China", difficulty: 2 },

    /* ---------- Office ---------- */
    { text: "Why are meetings always 30 or 60 minutes long?", answer: "Calendar software defaults to round blocks, and Parkinson's law does the rest: work expands to fill the time allowed. Almost no meeting genuinely needs exactly an hour.", fun: "Teams that switched to 25 and 50 minute defaults report losing nothing.", category: "Office", difficulty: 1 },

    { text: "Why is arguing over trivia called 'bikeshedding'?", answer: "From C. Northcote Parkinson's 1957 example: a committee waves through a nuclear plant in minutes, then debates the staff bicycle shed for hours because everyone understands sheds.", fun: "The harder the topic, the quieter the room.", category: "Office", difficulty: 2 },

    { text: "Why do stand-up meetings involve standing?", answer: "Standing is meant to keep the meeting short by making it mildly uncomfortable. The format comes from military briefings and was adopted by software teams in the 1990s.", fun: "Video call stand-ups quietly removed the one mechanism that made it work.", category: "Office", difficulty: 2 },

/* src/content/factfiction.js  Fact or Fiction: teams vote true or false, then hear the real story */
(function () {
  "use strict";
  window.TCL.Content.registerBank("factfiction", [
    { text: "Wombats produce cube-shaped droppings.", truth: true, explain: "True. The intestine's varying elasticity shapes them; the cubes stack and do not roll off rocks.", category: "Weird Nature", difficulty: 1 },
    { text: "The Great Wall of China is visible to the naked eye from the Moon.", truth: false, explain: "False. It is far too narrow; astronauts have confirmed it cannot be seen even from low orbit without aid.", category: "Myths", difficulty: 1 },
    { text: "Australia is wider than the Moon.", truth: true, explain: "True. Australia is about 4,000 km east to west. The Moon is about 3,475 km across.", category: "Australia", difficulty: 3 },
    { text: "The Taj Mahal was built as a palace for an emperor to live in.", truth: false, explain: "False. Shah Jahan built it as a tomb for his wife Mumtaz Mahal. Nobody ever lived in it.", category: "India", difficulty: 1 },
    { text: "An octopus has three hearts and blue blood.", truth: true, explain: "True. Two hearts pump blood to the gills and one to the body. Copper-based haemocyanin makes the blood blue.", category: "Weird Nature", difficulty: 1 },
    { text: "The word sushi means raw fish in Japanese.", truth: false, explain: "False. Sushi refers to the vinegared rice. Plenty of sushi has no raw fish in it at all.", category: "Food", difficulty: 2 },
    { text: "The Philippines is made up of more than 7,000 islands.", truth: true, explain: "True. The official count is above 7,600, and only a fraction of them are inhabited.", category: "Philippines", difficulty: 1 },
    { text: "Humans only use ten percent of their brains.", truth: false, explain: "False. Brain scans show activity right across the brain. The ten percent line is pure invention.", category: "Myths", difficulty: 1 },
    { text: "Bluetooth is named after a 10th-century Scandinavian king.", truth: true, explain: "True. Harald Bluetooth united Danish tribes. The logo is his initials written in runes.", category: "Office", difficulty: 2 },
    { text: "Diamonds are formed from compressed coal.", truth: false, explain: "False. Most diamonds formed deep in the mantle long before land plants existed, so coal was never involved.", category: "Science", difficulty: 2 },
    { text: "Cleopatra lived closer in time to the first Moon landing than to the building of the Great Pyramid.", truth: true, explain: "True. The Great Pyramid was already about 2,500 years old in her lifetime. The Moon landing was about 2,000 years later.", category: "History", difficulty: 3 },
    { text: "Everyone in China speaks Chinese exactly the same way.", truth: false, explain: "False. There are many spoken varieties, including Mandarin, Cantonese and Hokkien, and they are not mutually intelligible.", category: "China", difficulty: 1 },
    { text: "The world's first webcam was set up so people could watch a coffee pot.", truth: true, explain: "True. Cambridge researchers pointed a camera at the Trojan Room coffee pot so nobody walked to an empty jug.", category: "Tech", difficulty: 2 },
    { text: "Sydney is the capital city of Australia.", truth: false, explain: "False. Canberra is the capital. It was chosen as a compromise because Sydney and Melbourne both wanted it.", category: "Australia", difficulty: 1 },
    { text: "India has the largest postal network in the world by number of post offices.", truth: true, explain: "True. India runs more than 150,000 post offices, more than any other country.", category: "India", difficulty: 2 },
    { text: "Bats are blind.", truth: false, explain: "False. Every bat species can see. They use echolocation in the dark as an extra sense, not a replacement.", category: "Weird Nature", difficulty: 1 },
    { text: "The English word shampoo comes from a Hindi word meaning to press or massage.", truth: true, explain: "True. It comes from champo, and entered English through India in the 1700s.", category: "Language", difficulty: 3 },
    { text: "Fortune cookies are an ancient Chinese tradition.", truth: false, explain: "False. They were popularised in California in the early 1900s and are barely known in China.", category: "Food", difficulty: 1 },
    { text: "Sea otters sometimes hold hands while resting so they do not drift apart.", truth: true, explain: "True. They also wrap themselves in kelp for the same reason. Yes, it is as adorable as it sounds.", category: "Weird Nature", difficulty: 2 },
    { text: "Napoleon Bonaparte was unusually short for his time.", truth: false, explain: "False. He was around average height for a Frenchman of that era. British cartoons and old measurement units built the myth.", category: "Myths", difficulty: 2 },
    { text: "Paper, printing, gunpowder and the compass are known as China's Four Great Inventions.", truth: true, explain: "True. That grouping is the standard name for them, and all four spread across the world from China.", category: "China", difficulty: 1 },
    { text: "The Apple Macintosh was the first computer with a mouse and on-screen windows.", truth: false, explain: "False. Xerox demonstrated the idea years earlier, and Apple's own Lisa shipped before the Macintosh.", category: "Tech", difficulty: 2 },
    { text: "The shortest war in recorded history lasted under an hour.", truth: true, explain: "True. The Anglo-Zanzibar War of 1896 was over in about 38 minutes.", category: "History", difficulty: 2 },
    { text: "Kangaroos can hop backwards as easily as they hop forwards.", truth: false, explain: "False. Their big feet and thick tail make going backwards almost impossible, which is why they face forward on the coat of arms.", category: "Australia", difficulty: 2 },
    { text: "Filipino jeepneys started life as surplus American military jeeps.", truth: true, explain: "True. After the Second World War the leftover jeeps were stretched, roofed and painted into shared buses.", category: "Philippines", difficulty: 2 },
    { text: "Glass slowly flows over centuries, which is why old window panes are thicker at the bottom.", truth: false, explain: "False. Glass at room temperature is a solid. Old panes vary because of how they were made, not because they flowed.", category: "Science", difficulty: 3 },
    { text: "Bananas are slightly radioactive.", truth: true, explain: "True. They contain potassium-40. The dose is tiny, and physicists jokingly measure exposure in banana equivalents.", category: "Science", difficulty: 2 },
    { text: "Hindi is the national language of India.", truth: false, explain: "False. India has no national language. Hindi and English are official languages of the union, and 22 languages sit in the Eighth Schedule.", category: "India", difficulty: 2 },
    { text: "The cc in an email stands for carbon copy.", truth: true, explain: "True. It comes from carbon paper, which made a duplicate as you typed. The paper is gone; the button stayed.", category: "Office", difficulty: 1 },
    { text: "Lightning never strikes the same place twice.", truth: false, explain: "False. Tall structures get hit repeatedly. The Empire State Building is struck dozens of times a year.", category: "Myths", difficulty: 1 },
    { text: "Sharks have been around longer than trees.", truth: true, explain: "True. Sharks date back over 400 million years, roughly 50 million years before the first trees.", category: "Weird Nature", difficulty: 3 },
    { text: "Octopi is the only correct plural of octopus.", truth: false, explain: "False. Octopuses is the standard plural. The word is Greek, not Latin, so the Latin-style ending was never needed.", category: "Language", difficulty: 2 },
    { text: "Oxford University was already teaching students before the Aztec Empire existed.", truth: true, explain: "True. Teaching at Oxford is recorded from about 1096. Tenochtitlan was founded in 1325.", category: "History", difficulty: 3 },
    { text: "A camel's hump is a water tank.", truth: false, explain: "False. The hump stores fat. Camels survive dry spells through very efficient kidneys and blood cells, not a built-in canteen.", category: "Weird Nature", difficulty: 1 },
    { text: "A pineapple plant takes about two years to produce a single fruit.", truth: true, explain: "True. It is roughly 18 to 24 months from planting to one pineapple. Worth remembering next time you complain about the price.", category: "Food", difficulty: 2 },
    { text: "A penny dropped from a skyscraper can kill someone on the footpath below.", truth: false, explain: "False. A coin is too light and tumbles too much. It reaches a low terminal velocity and would sting at worst.", category: "Myths", difficulty: 2 },
    { text: "Australia once sent soldiers with machine guns to deal with emus, and the emus won.", truth: true, explain: "True. The 1932 Emu War in Western Australia was called off after the birds scattered and the cull failed.", category: "Australia", difficulty: 3 },
    { text: "Sound travels faster through air than through water.", truth: false, explain: "False. Sound moves about four times faster in water, and faster still through solids like steel.", category: "Science", difficulty: 2 },
    { text: "The Chinese zodiac runs on a 12-year animal cycle that starts with the rat.", truth: true, explain: "True. The old story says the rat rode across the river on the ox and jumped off first at the finish.", category: "China", difficulty: 1 },
    { text: "The Great Fire of London killed tens of thousands of people.", truth: false, explain: "False. It destroyed most of the city, but the officially recorded death toll was fewer than ten.", category: "History", difficulty: 2 },
    { text: "Helium was discovered in the Sun before anyone found it on Earth.", truth: true, explain: "True. It was spotted in the Sun's spectrum in 1868 and named after Helios. It turned up on Earth years later.", category: "Science", difficulty: 3 },
    { text: "Incognito mode hides your browsing from your internet provider and your employer.", truth: false, explain: "False. It only clears local history and cookies. The network you are on still sees the traffic.", category: "Tech", difficulty: 1 },
    { text: "India has had a post office that floats on a lake.", truth: true, explain: "True. A floating post office opened on Dal Lake in Srinagar in 2011, complete with its own postmark.", category: "India", difficulty: 3 },
    { text: "Vikings wore horned helmets into battle.", truth: false, explain: "False. No battle helmet with horns has ever been dug up. The look was invented for 19th century opera costumes.", category: "Myths", difficulty: 2 },
    { text: "The word robot comes from a 1920 Czech play.", truth: true, explain: "True. Karel Capek's play R.U.R. gave us the word, from robota, meaning forced labour.", category: "Language", difficulty: 2 },
    { text: "Halo-halo means cold sweet in Filipino.", truth: false, explain: "False. It means mix-mix. The whole point is to stir everything together before the first spoonful.", category: "Philippines", difficulty: 1 },
    { text: "There are more ways to shuffle a deck of 52 cards than there are atoms making up the Earth.", truth: true, explain: "True. The number of orderings is about 8 followed by 67 zeros, far more than Earth's atom count.", category: "Science", difficulty: 3 },
    { text: "The first computer bug was only a figure of speech, not a real insect.", truth: false, explain: "False. In 1947 a moth was found jamming a relay at Harvard. The team taped it into the logbook.", category: "Tech", difficulty: 2 },
    { text: "Honey found in ancient tombs was still edible thousands of years later.", truth: true, explain: "True. Honey is too acidic and too low in water for spoilage organisms, so it effectively never goes off.", category: "Food", difficulty: 2 },
    { text: "China spans about five time zones geographically but officially runs on just one.", truth: true, explain: "True. The whole country uses Beijing time, so sunrise in the far west can land very late on the clock.", category: "China", difficulty: 2 },
    { text: "The Aztecs enjoyed chocolate as sweet solid bars.", truth: false, explain: "False. It was a bitter, spiced drink. Sweetened solid chocolate came centuries later in Europe.", category: "Food", difficulty: 2 },
    { text: "The first person generally credited as a computer programmer was a woman writing in the 1840s.", truth: true, explain: "True. Ada Lovelace wrote an algorithm for Charles Babbage's Analytical Engine, a machine never actually built.", category: "Tech", difficulty: 1 },
    { text: "There is a lake in Western Australia that stays bubblegum pink all year.", truth: true, explain: "True. Lake Hillier on Middle Island keeps its pink colour, thought to come from salt-loving algae and bacteria.", category: "Australia", difficulty: 2 },

    id: "balderdash", name: "Fake Definitions", tagline: "Invent a meaning. Fool the room. Learn the real one.", category: "Creative",

    settingsSchema: [f.count("count", "Number of words", 1, 12), f.seconds("writeSeconds", "Writing time", 30, 240, 15), f.seconds("voteSeconds", "Voting time", 15, 120, 15), f.categories("balderdash"), f.diffMin(), f.diffMax(), f.order(), f.number("pointsCorrect", "Points for picking the real definition", 0, 50), f.number("pointsPerFool", "Points per team fooled by your fake", 0, 50), f.count("minDefs", "Minimum definitions on the board (filled with built-in decoys)", 2, 8), f.toggle("useDecoys", "Use built-in decoys when teams submit too few"), f.unused()].concat(K.common()),

    actions: Object.assign({}, deck, {
      startWriting(ctx) { ctx.state.phase = "write"; ctx.timer.start(ctx.settings.writeSeconds * 1000, "Writing", 15000); },

    summary(s) { return `${s.count} statements × ${s.seconds}s + the real story`; },
    estimateMinutes(s) { return K.est(s.count, s.seconds + 25, 10); },
    validate(s, ctx) { const sel = ctx.content({ count: s.count, categories: s.categories, difficultyMin: s.difficultyMin, difficultyMax: s.difficultyMax }); return sel.pool < s.count ? [{ level: "warn", message: `Only ${sel.pool} statements match; ${s.count} requested.` }] : []; },
    init(ctx) { const st = K.deckInit(ctx, "factfiction", ctx.settings.count); st.votes = {}; st.streak = {}; if (ctx.settings.autoStart && st.items.length) ctx.timer.start(ctx.settings.seconds * 1000, "Vote", 5000); return st; },
    actions: Object.assign({}, deck, {

        <div class="eyebrow" style="margin-top:12px">Each team's call (ask them to commit before the clock dies)</div>
        <div class="grid cols-3" style="margin-top:8px">${ctx.targets.map(t => { const v = st.votes[t.id]; const right = st.revealed && v != null && v === truth; const wrong = st.revealed && v != null && v !== truth; return `<div class="card" style="padding:12px;border-top:3px solid ${t.color}"><div class="row between"><b>${esc(t.name)}</b>${st.streak[t.id] >= 2 ? `<span class="chip gold">🔥 ${st.streak[t.id]}</span>` : ""}</div><div class="btn-row" style="margin-top:8px"><button class="btn sm ${v === true ? "green" : "ghost"}" data-act="vote" data-arg='${JSON.stringify({ id: t.id, v: true })}' ${st.revealed ? "disabled" : ""}>True</button><button class="btn sm ${v === false ? "danger" : "ghost"}" data-act="vote" data-arg='${JSON.stringify({ id: t.id, v: false })}' ${st.revealed ? "disabled" : ""}>False</button>${right ? '<span class="chip ok"><span class="dot"></span>correct</span>' : wrong ? '<span class="chip bad"><span class="dot"></span>wrong</span>' : ""}</div></div>`; }).join("")}</div>
        ${K.nav(ctx)}</div>`;
    },
    presentation(ctx) {
      const st = ctx.state, it = K.current(st);
      if (st.finished || !it) return [{ type: "eyebrow", text: "Fact or Fiction" }, { type: "title", text: "That is all the facts. And fictions." }];
      const b = [{ type: "eyebrow", text: `Fact or Fiction · ${st.index + 1} of ${st.items.length} · ${it.category}` }, { type: "prompt", text: it.text }];
      if (st.revealed) b.push({ type: "answer", text: isTrue(it) ? "TRUE" : "FALSE" }, { type: "text", text: String(it.explain).replace(/^(True|False)\.\s*/, "") });
      else { const voted = ctx.targets.filter(t => t.id in st.votes).map(t => t.name); b.push({ type: "text", text: "True or false? Teams, commit before the clock dies." + (voted.length ? ` Locked in: ${voted.join(", ")}.` : "") }); }
      b.push(K.pTimer());
      return b;
    },
  });
})();
