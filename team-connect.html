/* src/ui/01-shell.js  App shell: sidebar nav, topbar, share-safety banner, global event delegation. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util, esc = U.esc, UI = TCL.UI;

  const NAV = [
    { id: "home", label: "Home", icon: "home", always: true },
    { id: "builder", label: "Session Builder", icon: "builder" },
    { id: "participants", label: "Participants", icon: "people" },
    { id: "library", label: "Game Library", icon: "library" },
    { id: "content", label: "Content", icon: "content", always: true, advanced: true },
    { id: "settings", label: "Settings", icon: "settings", always: true },
  ];

  /* ---------- Simple / Advanced mode ---------- */
  UI.simple = function () { return (TCL.state && TCL.state.settings.consoleMode || "simple") !== "advanced"; };
  UI.setMode = function (mode) {
    TCL.state.settings.consoleMode = mode === "advanced" ? "advanced" : "simple";
    TCL.persist();
    UI.toast(UI.simple() ? "Simple mode: only the controls you need while the team is watching" : "Advanced mode: every setting and diagnostic", "ok");
    UI.render();
  };
  UI.modeToggle = function () {
    const simple = UI.simple();
    return `<div class="mode-toggle" role="group" aria-label="Console mode">
      <button type="button" class="${simple ? "on" : ""}" data-mode="simple" aria-pressed="${simple}">Simple</button>
      <button type="button" class="${simple ? "" : "on"}" data-mode="advanced" aria-pressed="${!simple}">Advanced</button></div>`;
  };

  UI.presenterChip = function () {
    const st = TCL.Presenter.status;
    const map = { closed: ["off", "Presentation not open"], connecting: ["warn", "Presentation opening"], connected: ["ok", "Presentation connected"], disconnected: ["bad", "Presentation disconnected"], blocked: ["bad", "Pop-up blocked"] };
    const m = map[st] || map.closed;
    return `<span class="chip ${m[0]}" data-presenter-chip><span class="dot"></span>${m[1]}</span>`;
  };

  /* Persistent traffic-light banner. Green = the presentation window is live, so it is safe
     to share THAT window. Red = this is the private facilitator view. Amber = in between. */
  UI.shareBanner = function () {
    const st = TCL.Presenter.status;
    const s = TCL.session();
    const rehearsal = s && s.rehearsal;
    if (st === "connected") {
      return `<div class="share-banner green" role="status">${UI.icon("check")}<div><b>Safe to share:</b> share the window titled "TEAM CONNECT LIVE · Presentation" in Zoom. This console stays private.${rehearsal ? " Rehearsal is running, so nothing here counts." : ""}</div>
        <button class="btn xs ghost" data-open-presentation>Focus it</button></div>`;
    }
    if (st === "disconnected" || st === "connecting") {
      return `<div class="share-banner amber" role="status">${UI.icon("warn")}<div><b>Presentation ${st === "connecting" ? "opening" : "disconnected"}:</b> participants are not seeing anything right now. Do not share this screen.</div>
        <button class="btn xs ghost" data-open-presentation>${st === "connecting" ? "Focus it" : "Reconnect"}</button></div>`;
    }
    if (st === "blocked") {
      return `<div class="share-banner red" role="status">${UI.icon("warn")}<div><b>Pop-up blocked:</b> the presentation window could not open. Allow pop-ups for this page, then retry. Never share this console.</div>
        <button class="btn xs ghost" data-open-presentation>Retry</button></div>`;
    }
    return `<div class="share-banner red" role="status">${UI.icon("warn")}<div><b>Facilitator view: do not share.</b> Answers and private notes are on this screen. Open the presentation window and share that one instead.</div>
      <button class="btn xs" data-open-presentation>Open presentation window</button></div>`;
  };

  /* One click covers the participant screen; one click uncovers it. The choice of message
     is a menu on the same control, so the common case stays a single press. */
  UI.holdingControl = function (s) {
    const h = s.holding;
    if (h) return `<button type="button" class="btn sm hold-on" data-hold-off>${UI.icon("eye")} Showing: ${esc(h.kind === "custom" ? "your message" : h.title)} · uncover</button>`;
    return `<div class="hold-group">
      <button type="button" class="btn sm ghost" data-hold="setup" title="Cover the participant screen">${UI.icon("screen")} Cover screen</button>
      ${UI.menu(TCL.Session.HOLDING.map(x => ({ label: x.title, icon: "screen", attr: `data-hold="${x.id}"` })).concat([{ sep: true }, { label: "Custom message…", icon: "edit", attr: "data-hold-custom" }]), { title: "What to show while covered" })}</div>`;
  };

  UI.rehearsalBar = function () {
    const s = TCL.session();
    if (!s || !s.rehearsal) return "";
    return `<div class="rehearsal-bar">${UI.icon("play")}<div><b>REHEARSAL</b> · sample people, ${TCL.Rehearsal.SPEED}× faster timers, no real scores and no questions used up.</div>
      <div class="btn-row"><button class="btn xs ghost" data-rehearse-jump>Jump to a game</button><button class="btn xs" data-rehearse-end>End rehearsal</button></div></div>`;
  };

  /* Planning tools disappear once the session goes live: during play the sidebar answers
     "what is happening", "what is next" and "how do I get out of trouble", nothing else. */
  const LIVE_NAV = [
    { id: "console", label: "Now playing", icon: "console" },
    { id: "runsheet", label: "Run sheet", icon: "builder" },
    { id: "results", label: "Scores", icon: "trophy" },
  ];

  UI.shell = function (bodyHtml, opts) {
    opts = opts || {};
    const s = TCL.session();
    const active = TCL.route.screen;
    const simple = UI.simple();
    const live = !!(s && s.status === "live");
    let nav;
    if (live) {
      const view = (TCL.route.params || {}).view;
      nav = LIVE_NAV.map(n => {
        const on = n.id === "runsheet" ? (active === "console" && view === "runsheet") : (active === n.id && !(n.id === "console" && view === "runsheet"));
        const target = n.id === "runsheet" ? 'data-nav-runsheet' : `data-nav="${n.id}"`;
        return `<button type="button" class="nav-btn ${on ? "active" : ""}" ${target} aria-current="${on ? "page" : "false"}">${UI.icons[n.icon]}<span>${n.label}</span></button>`;
      }).join("") + `<div class="nav-sep"></div><button type="button" class="nav-btn" data-emergency>${UI.icons.warn}<span>If something breaks</span></button>`;
    } else {
      nav = NAV.filter(n => !(simple && n.advanced && active !== n.id)).map(n => {
        const disabled = !n.always && !s;
        return `<button type="button" class="nav-btn ${active === n.id ? "active" : ""}" data-nav="${n.id}" ${disabled ? "disabled" : ""} aria-current="${active === n.id ? "page" : "false"}">${UI.icons[n.icon]}<span>${n.label}</span></button>`;
      }).join("") + (s ? `<div class="nav-sep"></div><button type="button" class="nav-btn ${active === "console" ? "active" : ""}" data-nav="console">${UI.icons.console}<span>Facilitator Console</span></button>
        <button type="button" class="nav-btn ${active === "results" ? "active" : ""}" data-nav="results">${UI.icons.trophy}<span>Results</span></button>` : "");
    }
    return `<div class="shell ${live ? "playing" : "planning"}">
      <nav class="sidebar" aria-label="Main">
        <div class="brand"><div class="name">TEAM CONNECT <span>LIVE</span></div><div class="tag">${live ? esc(s.name) : "One team. Any location. Real connections."}</div></div>
        ${nav}
        <div class="nav-foot">${s && !live ? `<b style="color:var(--muted)">${esc(s.name)}</b><br>` : ""}v${TCL.VERSION} · works offline<br><span data-save-status>${TCL.Store.available ? "Autosave on" : "Storage unavailable: changes will be lost on close"}</span></div>
      </nav>
      <div class="main">
        <header class="topbar">
          <div class="title">${esc(opts.title || "")}</div>
          <div class="spacer"></div>
          ${s ? UI.holdingControl(s) : ""}
          ${UI.modeToggle()}
          ${live ? UI.timerChip("session") : ""}
          ${s ? `<button type="button" class="btn sm ghost" data-open-presentation>${UI.icon("screen")} ${TCL.Presenter.isOpen() ? "Focus presentation" : "Open presentation"}</button>` : ""}
        </header>
        ${s ? UI.rehearsalBar() + UI.shareBanner() : ""}
        ${bodyHtml}
      </div>
    </div>`;
  };

  /* One place to get out of trouble during a live session. */
  UI.emergencyDialog = function () {
    const s = TCL.session();
    return UI.modal({ title: "If something breaks", wide: true,
      body: `<p>Nothing here loses scores. Everything is reversible except ending the session, which asks again.</p>`,
      form: `<div class="stack">
        <div class="msg-card"><div><b>Participants cannot see the screen</b><div class="muted small">Reopen the presentation window and share that one in Zoom.</div></div><button type="button" class="btn sm" data-open-presentation>Open presentation</button></div>
        <div class="msg-card"><div><b>Wrong points awarded</b><div class="muted small">Undo the last action, or edit scores by hand.</div></div><button type="button" class="btn sm ghost" data-emg="scores">Edit scores</button></div>
        <div class="msg-card"><div><b>This activity has gone wrong</b><div class="muted small">Leave it (scores kept or discarded, you choose), or restart it from the beginning.</div></div><button type="button" class="btn sm ghost" data-emg="exit">Leave activity</button></div>
        <div class="msg-card"><div><b>We are behind schedule</b><div class="muted small">See the projected finish and the least disruptive way to fix it.</div></div><button type="button" class="btn sm ghost" data-emg="late">Running late</button></div>
        <div class="msg-card"><div><b>Someone joined or dropped out</b><div class="muted small">Mark them present or away and rebalance the teams.</div></div><button type="button" class="btn sm ghost" data-emg="people">Participants</button></div>
        <div class="msg-card"><div><b>I need to change the plan</b><div class="muted small">Opens the Session Builder. The running activity is not affected.</div></div><button type="button" class="btn sm ghost" data-emg="builder">Session Builder</button></div>
        <div class="msg-card"><div><b>We have to stop now</b><div class="muted small">Closes every remaining activity and opens the results.</div></div><button type="button" class="btn sm danger" data-emg="end">End session</button></div>
      </div>`,
      buttons: [{ label: "Close", value: null }],
      onOpen: el => el.addEventListener("click", async ev => {
        const b = ev.target.closest("[data-emg]"); if (!b) return;
        const what = b.dataset.emg;
        UI.closeModal();
        if (what === "scores") return UI.editScores();
        if (what === "exit") return TCL.Runner.current() ? UI.exitDialog() : UI.toast("No activity is running", "warn");
        if (what === "late") return UI.pacingDialog();
        if (what === "people") return TCL.go("participants");
        if (what === "builder") return TCL.go("builder");
        if (what === "end") { if (await UI.confirm("End the entire session?", "All remaining activities are closed. Scores are kept and the results screen opens.", { okLabel: "End session", danger: true })) { TCL.Runner.endSession(); TCL.go("results"); } }
      }) });
  };

  /* Global delegation for nav and common actions */
  document.addEventListener("click", async e => {
    const mode = e.target.closest("[data-mode]");
    if (mode) { UI.setMode(mode.dataset.mode); return; }
    const runsheet = e.target.closest("[data-nav-runsheet]");
    if (runsheet) { TCL.go("console", { view: "runsheet" }); return; }
    const emg = e.target.closest("[data-emergency]");
    if (emg) { UI.emergencyDialog(); return; }
    const nav = e.target.closest("[data-nav]");
    if (nav && !nav.disabled) { TCL.go(nav.dataset.nav); return; }
    const op = e.target.closest("[data-open-presentation]");
    if (op) { UI.openPresentation(); return; }
    const rj = e.target.closest("[data-rehearse-jump]");
    if (rj) { UI.rehearsalJump(); return; }
    const re = e.target.closest("[data-rehearse-end]");
    if (re) { UI.endRehearsal(); return; }
    const hold = e.target.closest("[data-hold]");
    if (hold) { TCL.Session.hold(hold.dataset.hold); UI.render(); return; }
    if (e.target.closest("[data-hold-off]")) { TCL.Session.hold(null); UI.render(); return; }
    if (e.target.closest("[data-hold-custom]")) {
      const v = await UI.prompt("Custom holding message", "Shown large on the participant screen. Keep it to a few words.", "", { label: "Message", okLabel: "Show it" });
      if (v && v.trim()) { TCL.Session.hold("custom", v.trim()); UI.render(); }
      return;
    }
    const go = e.target.closest("[data-go]");
    if (go) { TCL.go(go.dataset.go, go.dataset.goParam ? { id: go.dataset.goParam } : {}); return; }
  });

  UI.openPresentation = function () {
    const ok = TCL.Presenter.open();
    if (!ok) {
      UI.modal({ title: "The browser blocked the pop-up", body: `<p>Your browser stopped the presentation window from opening.</p><ol class="step-list" style="margin-top:10px"><li>Look for a "pop-up blocked" icon in the address bar and allow pop-ups for this page.</li><li>Then press Retry below.</li><li>Alternative: open this same file in a second tab and add <b>#presentation</b> to the address. It will connect automatically.</li><li>If pop-ups stay blocked, serve the folder over a local address instead: <code>python3 -m http.server 8080</code> then open <code>http://localhost:8080/team-connect.html</code>.</li></ol>`,
        buttons: [{ label: "Close", value: null }, { label: "Retry", value: "retry", primary: true }] }).then(v => { if (v === "retry") UI.openPresentation(); });
    }
  };

  /* ---------- rehearsal entry points ---------- */
  UI.startRehearsal = async function () {
    const ok = await UI.confirm("Start a rehearsal?", "<p>A practice session opens with six sample people, two teams and every game on the run sheet.</p><ul class=\"step-list\" style=\"margin-top:10px\"><li>Timers run " + TCL.Rehearsal.SPEED + "× faster.</li><li>No real scores are touched and no questions are marked as used.</li><li>Ending the rehearsal deletes it and returns you to your session.</li></ul>", { okLabel: "Start rehearsing", routine: true });
    if (!ok) return;
    TCL.Rehearsal.start();
    UI.toast("Rehearsal started. Open the presentation window to test the share.", "ok");
    TCL.go("console");
  };
  UI.endRehearsal = async function () {
    if (!(await UI.confirm("End the rehearsal?", "The practice session and everything in it is deleted. Your real sessions are untouched.", { okLabel: "End rehearsal" }))) return;
    const back = TCL.Rehearsal.end();
    UI.toast("Rehearsal ended and cleaned up", "ok");
    TCL.go(back ? "console" : "home");
  };
  UI.rehearsalJump = async function () {
    const games = TCL.Games.list();
    const v = await UI.modal({ title: "Jump straight to a game", wide: true, body: "<p>Starts that game immediately with sample people and short timers. Whatever is running now is reset.</p>",
      form: `<div class="grid cols-3">${games.map(g => `<button type="button" class="card clickable" data-jump="${g.id}" style="text-align:left"><div class="row between"><span class="icon">${g.icon}</span></div><h3 style="margin-top:6px">${esc(g.name)}</h3><p>${esc(g.tagline || g.description)}</p></button>`).join("")}</div>`,
      buttons: [{ label: "Cancel", value: null }],
      onOpen: el => el.addEventListener("click", ev => { const b = ev.target.closest("[data-jump]"); if (b) { UI.closeModal(); const r = TCL.Rehearsal.jumpTo(b.dataset.jump); if (!r.ok) UI.toast(r.reason || "Could not start that game", "warn"); TCL.go("console"); } }) });
    return v;
  };
})();

(function () {

  const TCL = window.TCL, U = TCL.util, esc = U.esc, UI = TCL.UI;

    title: "Home",

      const legacy = TCL.Store.readLegacy();
      const statusMsg = TCL.bootStatus;
      let banner = "";
      if (statusMsg === "corrupt") banner = UI.callout("warn", "<b>Saved data could not be read</b>, so the app started clean. A copy of the unreadable data was kept in browser storage.");
      if (statusMsg === "newer") banner = UI.callout("warn", "<b>Saved data comes from a newer version</b> of this app and was left untouched. Update the file to read it.");

      const others = sessions.filter(s => s.status !== "live");
      return UI.shell(`<div class="content">

        <div class="hero" style="padding-top:${unfinished.length ? 10 : 40}px">
          <span class="eyebrow">Facilitator control centre</span>
          <h1>Team Connect <span>Live</span></h1>
          <p>One team. Any location. Real connections.</p>
          <div class="btn-row center" style="margin-top:24px">
            <button class="btn big" data-new>${UI.icon("plus")} New session</button>
            <button class="btn ghost big" data-rehearse>${UI.icon("play")} Rehearse</button>
            <button class="btn ghost big" data-nav="content">Manage content</button>
          </div>
          <p class="dim small" style="margin-top:10px">Rehearsal runs a throwaway practice session: sample people, fast timers, no real scores and no questions used up.</p>
        </div>
        ${rehearsal ? `<div class="panel tight" style="border-color:rgba(93,139,255,.5);margin-top:14px"><div class="row between"><div><b>A rehearsal is still open</b><div class="muted small">Practice sessions are deleted when you end them. Nothing in one affects a real session.</div></div>
          <div class="btn-row"><button class="btn sm" data-resume-rehearsal>Back to the rehearsal</button><button class="btn sm ghost" data-end-rehearsal>End and delete it</button></div></div></div>` : ""}
        ${recovery}
        ${legacy ? `<div class="panel tight" style="margin-top:16px"><div class="row between"><div><b>PRIME TIME save found</b> <span class="muted small">(${legacy.roster.length} players, ${legacy.teams.length} teams)</span><div class="muted small">Import the roster, team names and score totals into a new session.</div></div><button class="btn sm ghost" data-import-legacy>Import from PRIME TIME</button></div></div>` : ""}
        <div class="page-head" style="margin-top:28px"><div><h2>Saved sessions</h2><p>Drafts and completed sessions. Duplicate one to reuse its run sheet.</p></div></div>
        ${others.length ? `<div class="stack">${others.map(s => `<div class="panel tight session-card">
          <div><div class="nm">${esc(s.name)} <span class="badge ${s.status}">${s.status}</span></div><div class="meta">${U.fmtDate(s.updatedAt)} · ${s.participants.length} participants · ${s.runSheet.length} activities · target ${s.targetMinutes} min</div></div>
          <div class="btn-row"><button class="btn sm" data-dash="${s.id}">Open</button>${s.status === "complete" ? `<button class="btn sm ghost" data-scores="${s.id}">Results</button>` : ""}<button class="btn sm ghost" data-dup="${s.id}">Duplicate</button><button class="btn sm danger" data-del="${s.id}">Delete</button></div>
        </div>`).join("")}</div>` : `<div class="empty"><h3>No saved sessions yet</h3>Create a new session to build your first run sheet.</div>`}
      </div>`, { title: "Home" });
    },
    mount(root) {
      root.addEventListener("click", async e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.hasAttribute("data-new")) { TCL.go("wizard"); return; }
        if (b.hasAttribute("data-rehearse")) { UI.startRehearsal(); return; }
        if (b.hasAttribute("data-resume-rehearsal")) { const r = TCL.Session.list().find(x => x.rehearsal); if (r) { TCL.Session.setCurrent(r.id); TCL.go("console"); } return; }
        if (b.hasAttribute("data-end-rehearsal")) { UI.endRehearsal(); return; }
        if (b.dataset.resume) { TCL.Session.setCurrent(b.dataset.resume); TCL.go("console"); return; }
        if (b.dataset.dash) { TCL.Session.setCurrent(b.dataset.dash); TCL.go("builder"); return; }
        if (b.dataset.scores) { TCL.Session.setCurrent(b.dataset.scores); TCL.go("results"); return; }
        if (b.dataset.dup) { TCL.Session.duplicate(b.dataset.dup); UI.toast("Session duplicated", "ok"); TCL.go("builder"); return; }
        if (b.dataset.del) {
          const s = U.byId(TCL.state.sessions, b.dataset.del);
          const ok = await UI.confirm("Delete this session?", `<b>${esc(s.name)}</b> will be removed permanently, including its ${s.participants.length} participants, ${s.runSheet.length} activities and all scores. Content and presets are not affected.`, { danger: true, okLabel: "Delete session" });
          if (ok) { TCL.Session.remove(b.dataset.del); UI.toast("Session deleted"); UI.render(); }
          return;
        }
        if (b.hasAttribute("data-import-legacy")) { UI.importLegacy(); return; }
      });
    },
  });

  UI.importLegacy = async function () {
    const L = TCL.Store.readLegacy(); if (!L) return;
    const v = await UI.modal({ title: "Import from PRIME TIME", body: `<p>Choose what to bring into a new session.</p>`,
      form: `<div class="stack"><label class="switch"><input type="checkbox" id="imp-roster" checked><span class="track"></span><span class="txt">Participants (${L.roster.length}) and attendance</span></label>
        <label class="switch"><input type="checkbox" id="imp-teams" checked><span class="track"></span><span class="txt">Team names and membership</span></label>
        <label class="switch"><input type="checkbox" id="imp-scores"><span class="track"></span><span class="txt">Score totals per team (as manual adjustments)</span></label></div>`,
      buttons: [{ label: "Cancel", value: null }, { label: "Import", primary: true, value: el => ({ roster: el.querySelector("#imp-roster").checked, teams: el.querySelector("#imp-teams").checked, scores: el.querySelector("#imp-scores").checked }) }] });
    if (!v) return;
    const s = TCL.Session.create({ name: "Imported from PRIME TIME" });
    if (v.roster) { TCL.Teams.add(L.roster); s.participants.forEach(p => { if (L.absent.includes(p.name)) p.present = false; }); }
    if (v.teams) {
      s.teams = L.teams.map((t, i) => TCL.Teams.newTeam(t.name || TCL.Teams.NAMES[i], TCL.Teams.COLORS[i]));
      L.teams.forEach((t, i) => { t.players.forEach(n => { const p = s.participants.find(x => x.name === n); if (p) s.teams[i].memberIds.push(p.id); }); });
    }
    if (v.scores && v.teams) {
      L.teams.forEach((t, i) => { const total = U.sum(Object.values(t.scores || {})); if (total) TCL.Scoring.award({ activityId: "manual", teamId: s.teams[i].id, points: total, reason: "Imported from PRIME TIME", force: true }); });
    }
    TCL.Session.touch();
    UI.toast("Imported into a new session", "ok");
    TCL.go("participants");
  };

  /* ---------- New Session wizard ---------- */
  UI.registerScreen("wizard", {
    title: "New session",
    render() {
      const presets = TCL.Session.presets();
      return UI.shell(`<div class="content narrow">
        <div class="page-head"><div><span class="eyebrow gold">New session</span><h1>Set up your session</h1><p>Three quick choices. Everything can be changed later in the Session Builder.</p></div></div>
        <form id="wiz" class="stack">
          <div class="panel"><h3>1. Name and length</h3>
            <div class="form-grid">
              <div class="field"><label for="w-name">Session name</label><input class="input" id="w-name" value="Team Connect ${U.today()}" maxlength="80"></div>
              <div class="field"><label for="w-dur">Target duration</label><select class="input" id="w-dur"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="custom">Custom</option></select></div>
              <div class="field" id="w-custom-wrap" hidden><label for="w-custom">Custom minutes</label><input class="input num" type="number" id="w-custom" min="10" max="240" value="50"></div>
            </div></div>
          <div class="panel"><h3>2. Start from a preset</h3><p class="sub">Presets fill the run sheet. "Blank" starts empty.</p>
            <div class="grid cols-2" id="w-presets">${presets.map((p, i) => `<label class="card clickable ${i === 0 ? "selected" : ""}" style="cursor:pointer"><input type="radio" name="preset" value="${p.id}" class="sr-only" ${i === 0 ? "checked" : ""}><b>${esc(p.name)}</b><p>${esc(p.description || "")} ${p.runSheet.length ? `· ${p.runSheet.length} activities · ${p.targetMinutes} min` : ""}</p></label>`).join("")}</div></div>
          <div class="panel"><h3>3. Participants</h3><p class="sub">Paste names now (one per line or comma-separated) or add them later.</p>
            <textarea class="input" id="w-names" rows="5" placeholder="Priya, Tom, Mei-Ling&#10;Or one name per line"></textarea>
            <div class="btn-row" style="margin-top:10px"><button type="button" class="btn sm ghost" id="w-sample">Use the sample roster (15 names)</button></div></div>
          <div class="btn-row right"><button type="button" class="btn ghost" data-nav="home">Cancel</button><button type="submit" class="btn big">Create session ${UI.icon("next")}</button></div>
        </form></div>`, { title: "New session" });
    },
    mount(root) {
      const dur = root.querySelector("#w-dur"), cw = root.querySelector("#w-custom-wrap");
      dur.addEventListener("change", () => { cw.hidden = dur.value !== "custom"; });
      root.querySelector("#w-presets").addEventListener("change", e => { root.querySelectorAll("#w-presets .card").forEach(c => c.classList.toggle("selected", c.querySelector("input").checked)); });
      root.querySelector("#w-sample").addEventListener("click", () => { root.querySelector("#w-names").value = TCL.Teams.SAMPLE_ROSTER.join("\n"); });
      root.querySelector("#wiz").addEventListener("submit", e => {
        e.preventDefault();
        const name = root.querySelector("#w-name").value.trim() || "Team Connect " + U.today();
        const target = dur.value === "custom" ? U.clamp(Number(root.querySelector("#w-custom").value) || 50, 10, 240) : Number(dur.value);
        const presetId = (root.querySelector("input[name=preset]:checked") || {}).value;
        const names = TCL.Teams.parseNames(root.querySelector("#w-names").value);
        const preset = TCL.Session.preset(presetId);
        const s = TCL.Session.create({ name, targetMinutes: target, participants: names, preset });
        if (preset && preset.targetMinutes && preset.targetMinutes !== target) s.targetMinutes = target;
        if (names.length >= 2) TCL.Teams.build(Math.min(3, Math.max(2, Math.round(names.length / 5))));
        TCL.Session.touch();
        UI.toast("Session created", "ok");
        TCL.go(names.length ? "builder" : "participants");
      });
    },
  });
})();


/* ==== src/ui/20-participants.js ==== */
/* src/ui/20-participants.js  Participants and teams. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util, esc = U.esc, UI = TCL.UI, Teams = TCL.Teams;

  function personChip(p, opts) {
    opts = opts || {};
    return `<div class="person ${p.present ? "" : "absent"}" draggable="${opts.drag ? "true" : "false"}" data-pid="${p.id}" title="${esc(p.name)}${p.location ? " · " + esc(p.location) : ""}">
      <span class="nm">${esc(p.displayName || p.name)}</span>${p.location ? `<span class="loc">${esc(p.location)}</span>` : ""}
      ${opts.controls ? `<button type="button" class="icon-btn" data-toggle-present="${p.id}" title="${p.present ? "Mark absent" : "Mark present"}" aria-label="${p.present ? "Mark absent" : "Mark present"}">${UI.icons[p.present ? "check" : "x"]}</button>
      <button type="button" class="icon-btn" data-edit-p="${p.id}" title="Edit" aria-label="Edit ${esc(p.name)}">${UI.icons.edit}</button>
      <button type="button" class="icon-btn danger" data-del-p="${p.id}" title="Remove" aria-label="Remove ${esc(p.name)}">${UI.icons.trash}</button>` : ""}
    </div>`;
  }

  UI.registerScreen("participants", {
    title: "Participants",
    render() {
      const s = TCL.session(); if (!s) return UI.shell('<div class="content"><div class="empty"><h3>No session open</h3><button class="btn" data-nav="home">Go to Home</button></div></div>');
      Teams.refreshNames(s);
      const present = Teams.present(s);
      const problems = Teams.problems();
      const locs = Array.from(new Set(s.participants.map(p => (p.location || "").trim()).filter(Boolean)));
      return UI.shell(`<div class="content">
        <div class="page-head"><div><span class="eyebrow gold">Step 1</span><h1>Participants and teams</h1><p>${present.length} present of ${s.participants.length}. ${locs.length > 1 ? "Teams are mixed across " + locs.join(" and ") + "." : ""}</p></div>
          <div class="btn-row"><button class="btn ghost" data-csv-export>${UI.icon("export")} Export CSV</button><button class="btn ghost" data-csv-import>${UI.icon("import")} Import CSV</button><button class="btn" data-nav="builder">Continue to Session Builder ${UI.icon("next")}</button></div></div>
        ${UI.problems(problems)}
        <div class="grid cols-2" style="margin-top:14px">
          <div class="panel"><h3>Add participants</h3><p class="sub">One per line, or separated by commas. Add "· City" after a name to set a location, e.g. <span class="mono">Priya · Sydney</span>.</p>
            <textarea class="input" id="p-names" rows="4" placeholder="Priya · Sydney&#10;Tom · Gurugram&#10;Mei-Ling"></textarea>
            <div class="btn-row" style="margin-top:10px"><button class="btn" data-add-names>${UI.icon("plus")} Add</button><button class="btn ghost sm" data-add-sample>Sample roster</button><span class="dim small">Late arrival? Add them here any time; they join the smallest team.</span></div></div>
          <div class="panel"><h3>Team setup</h3>
            <div class="row" style="gap:16px">
              <div class="field"><label for="t-mode">Mode</label><select class="input sm" id="t-mode"><option value="teams" ${s.teamMode === "teams" ? "selected" : ""}>Teams</option><option value="individual" ${s.teamMode === "individual" ? "selected" : ""}>Individual (no teams)</option></select></div>
              <div class="field"><label for="t-count">Number of teams</label><input class="input sm num" type="number" id="t-count" min="1" max="6" value="${s.teams.length || 3}" ${s.teamMode !== "teams" || s.teamsLocked ? "disabled" : ""}></div>
            </div>
            <div class="btn-row" style="margin-top:12px">
              <button class="btn ghost" data-make-teams ${s.teamMode !== "teams" || s.teamsLocked ? "disabled" : ""}>${UI.icon("shuffle")} ${s.teams.length ? "Reshuffle teams" : "Create teams"}</button>
              <button class="btn ghost" data-rebalance ${s.teamMode !== "teams" || !s.teams.length || s.teamsLocked ? "disabled" : ""}>Rebalance sizes</button>
              <button class="btn ${s.teamsLocked ? "ghost" : ""}" data-lock ${s.teamMode !== "teams" || !s.teams.length ? "disabled" : ""}>${UI.icon(s.teamsLocked ? "unlock" : "lock")} ${s.teamsLocked ? "Unlock teams" : "Confirm and lock teams"}</button>
            </div>
            <p class="dim small" style="margin-top:10px">Locked teams stay fixed when attendance changes; unlock to rebalance. Drag names between teams to adjust manually.</p></div>
        </div>
        <div class="panel" style="margin-top:16px"><div class="row between"><h3 style="margin:0">Everyone (${s.participants.length})</h3><span class="dim small">Tick = present. Click the tick to mark someone absent.</span></div>
          <div class="row" style="margin-top:12px;gap:8px">${s.participants.length ? s.participants.map(p => personChip(p, { controls: true })).join("") : '<span class="dim">No participants yet.</span>'}</div></div>
        ${s.teamMode === "teams" && s.teams.length ? `<div class="grid cols-${Math.min(3, s.teams.length)}" style="margin-top:16px" id="team-grid">${s.teams.map(t => {
          const members = Teams.members(t, s);
          return `<div class="panel team-col" style="--tc:${t.color}" data-team="${t.id}">
            <div class="row between"><input class="input sm" style="font-family:var(--font-display);font-weight:700;font-size:17px;max-width:220px" value="${esc(t.name)}" data-team-name="${t.id}" maxlength="40" aria-label="Team name" ${s.teamsLocked ? "disabled" : ""}><span class="chip">${Teams.presentMembers(t, s).length} present</span></div>
            <div class="drop" data-drop="${t.id}">${members.map(p => personChip(p, { drag: !s.teamsLocked })).join("") || '<span class="dim small">Empty team</span>'}</div></div>`; }).join("")}</div>` : ""}
      </div>`, { title: "Participants" });
    },
    mount(root) {
      const s = TCL.session();
      root.addEventListener("click", async e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.hasAttribute("data-add-names")) {
          const raw = root.querySelector("#p-names").value;
          const entries = Teams.parseNames(raw).map(x => { const m = x.split(/\s[·\-|]\s|\t/); return { name: m[0].trim(), location: (m[1] || "").trim() }; }).filter(x => x.name);
          if (!entries.length) return;
          const added = entries.map(en => Teams.add(en.name, { location: en.location })[0]).filter(Boolean);
          if (s.teams.length) added.forEach(p => Teams.assignLate(p.id));
          TCL.Session.touch(); UI.toast(`Added ${added.length}`, "ok"); UI.render(); return;
        }
        if (b.hasAttribute("data-add-sample")) { const added = Teams.add(Teams.SAMPLE_ROSTER.filter(n => !s.participants.some(p => p.name === n)), { location: "" }); if (s.teams.length) added.forEach(p => Teams.assignLate(p.id)); TCL.Session.touch(); UI.render(); return; }
        if (b.dataset.togglePresent) {
          const p = U.byId(s.participants, b.dataset.togglePresent); Teams.setPresent(p.id, !p.present);
          if (!s.teamsLocked && s.teams.length) Teams.rebalance();
          if (p.present && s.teams.length && !Teams.teamOf(p.id)) Teams.assignLate(p.id);
          TCL.Session.touch(); UI.render(); return;
        }
        if (b.dataset.editP) {
          const p = U.byId(s.participants, b.dataset.editP);
          const v = await UI.modal({ title: "Edit participant", form: `<div class="form-grid"><div class="field"><label for="e-name">Name</label><input class="input" id="e-name" value="${esc(p.name)}" maxlength="60"></div><div class="field"><label for="e-loc">Location (optional)</label><input class="input" id="e-loc" value="${esc(p.location || "")}" maxlength="40"></div><div class="field span2"><label for="e-fact">Anonymous fact for "Who Said That?" (optional)</label><textarea class="input" id="e-fact" rows="2">${esc(p.fact || "")}</textarea></div></div>`,
            buttons: [{ label: "Cancel", value: null }, { label: "Save", primary: true, value: el => ({ name: el.querySelector("#e-name").value.trim(), location: el.querySelector("#e-loc").value.trim(), fact: el.querySelector("#e-fact").value.trim() }) }] });
          if (v && v.name) { Object.assign(p, v); Teams.refreshNames(s); TCL.Session.touch(); UI.render(); }
          return;
        }
        if (b.dataset.delP) {
          const p = U.byId(s.participants, b.dataset.delP);
          if (await UI.confirm("Remove participant?", `<b>${esc(p.name)}</b> will be removed from this session and from their team. Points already awarded to their team stay.`, { danger: true, okLabel: "Remove" })) { Teams.remove(p.id); if (!s.teamsLocked && s.teams.length) Teams.rebalance(); TCL.Session.touch(); UI.render(); }
          return;
        }
        if (b.hasAttribute("data-make-teams")) {
          const n = U.clamp(Number(root.querySelector("#t-count").value) || 3, 1, 6);
          if (s.runSheet.some(a => a.status !== "pending") && s.teams.length) { if (!(await UI.confirm("Reshuffle teams mid-session?", "Some activities have already run. Scores stay with the team names, but members will change.", { okLabel: "Reshuffle" }))) return; }
          Teams.build(n); TCL.Session.touch(); UI.render(); return;
        }
        if (b.hasAttribute("data-rebalance")) { Teams.rebalance(); TCL.Session.touch(); UI.render(); return; }
        if (b.hasAttribute("data-lock")) { s.teamsLocked = !s.teamsLocked; TCL.Session.touch(); UI.toast(s.teamsLocked ? "Teams locked" : "Teams unlocked"); UI.render(); return; }
        if (b.hasAttribute("data-csv-export")) {
          const rows = [["name", "location", "present", "team", "fact"]].concat(s.participants.map(p => { const t = Teams.teamOf(p.id); return [p.name, p.location || "", p.present ? "yes" : "no", t ? t.name : "", p.fact || ""]; }));
          if (!U.download("participants.csv", U.toCSV(rows), "text/csv")) UI.toast("Download blocked; copy from the export box instead", "warn"); return;
        }
        if (b.hasAttribute("data-csv-import")) {
          const v = await UI.modal({ title: "Import participants from CSV", body: "Columns: <b>name</b> (required), <b>location</b>, <b>present</b> (yes/no), <b>team</b>, <b>fact</b>. Paste the CSV text below.", form: `<textarea class="input" id="csv-text" rows="8" placeholder="name,location,present&#10;Priya,Sydney,yes"></textarea>`,
            buttons: [{ label: "Cancel", value: null }, { label: "Import", primary: true, value: el => el.querySelector("#csv-text").value }] });
          if (!v) return;
          const rows = U.parseCSV(v); if (rows.length < 2) { UI.toast("CSV needs a header row and data", "error"); return; }
          const h = rows[0].map(x => x.trim().toLowerCase()); const ni = h.indexOf("name");
          if (ni < 0) { UI.toast('CSV needs a "name" column', "error"); return; }
          let n = 0; const teamNames = {};
          rows.slice(1).forEach(r => { const name = (r[ni] || "").trim(); if (!name) return; const p = Teams.add(name, { location: (r[h.indexOf("location")] || "").trim(), fact: (r[h.indexOf("fact")] || "").trim() })[0]; if (h.includes("present")) p.present = !/^(no|n|false|0|absent)$/i.test((r[h.indexOf("present")] || "yes").trim()); if (h.includes("team") && r[h.indexOf("team")]) teamNames[p.id] = r[h.indexOf("team")].trim(); n++; });
          const tn = Array.from(new Set(Object.values(teamNames)));
          if (tn.length) { s.teams = tn.slice(0, 6).map((name, i) => Teams.newTeam(name, Teams.COLORS[i])); Object.keys(teamNames).forEach(pid => { const t = s.teams.find(x => x.name === teamNames[pid]); if (t) t.memberIds.push(pid); }); }
          else if (s.teams.length) s.participants.forEach(p => { if (!Teams.teamOf(p.id) && p.present) Teams.assignLate(p.id); });
          TCL.Session.touch(); UI.toast(`Imported ${n} participants`, "ok"); UI.render(); return;
        }
      });
      root.addEventListener("change", e => {
        if (e.target.id === "t-mode") { s.teamMode = e.target.value; if (s.teamMode === "teams" && !s.teams.length) Teams.build(Number(root.querySelector("#t-count").value) || 3); TCL.Session.touch(); UI.render(); }
        if (e.target.dataset.teamName) { Teams.rename(e.target.dataset.teamName, e.target.value); TCL.Session.touch(); UI.render(); }
      });
      /* drag and drop between teams */
      let dragId = null;
      root.addEventListener("dragstart", e => { const p = e.target.closest(".person[draggable=true]"); if (!p) return; dragId = p.dataset.pid; p.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (err) { /* ignore */ } });
      root.addEventListener("dragend", e => { root.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); root.querySelectorAll(".drop.over").forEach(x => x.classList.remove("over")); });
      root.addEventListener("dragover", e => { const d = e.target.closest(".drop"); if (d && dragId) { e.preventDefault(); d.classList.add("over"); } });
      root.addEventListener("dragleave", e => { const d = e.target.closest(".drop"); if (d) d.classList.remove("over"); });
      root.addEventListener("drop", e => { const d = e.target.closest(".drop"); if (!d || !dragId) return; e.preventDefault(); Teams.move(dragId, d.dataset.drop); dragId = null; TCL.Session.touch(); UI.render(); });
      /* keyboard alternative: click a person in a team then choose a team */
      root.addEventListener("dblclick", async e => {
        const p = e.target.closest("#team-grid .person"); if (!p || s.teamsLocked) return;
        const pid = p.dataset.pid;
        const v = await UI.modal({ title: "Move " + esc(Teams.displayName(pid)), form: `<select class="input" id="mv-team">${s.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>`, buttons: [{ label: "Cancel", value: null }, { label: "Move", primary: true, value: el => el.querySelector("#mv-team").value }] });
        if (v) { Teams.move(pid, v); TCL.Session.touch(); UI.render(); }
      });
    },
  });
})();

(function () {

    const status = d.over > 0.5 ? `<span class="chip bad"><span class="dot"></span>${U.fmtMin(d.over)} over</span>` : d.spare > 0.5 ? `<span class="chip ok"><span class="dot"></span>${U.fmtMin(d.spare)} spare</span>` : `<span class="chip ok"><span class="dot"></span>Fits exactly</span>`;
    return `<div class="panel" id="dur-panel"><div class="row between"><div class="row" style="gap:28px">
        <div class="stat"><span class="k">Estimated</span><span class="big-num ${d.over > 0.5 ? "" : "gold"}" style="${d.over > 0.5 ? "color:var(--red)" : ""}">${U.fmtMin(d.total)}</span></div>
        <div class="stat"><span class="k">Target</span><span class="big-num">${U.fmtMin(d.target)}</span></div>

      <div class="btn-row"><label class="field" style="flex-direction:row;align-items:center;gap:8px"><span class="lbl">Target</span><select class="input sm" data-target-select>${[30, 45, 60].map(m => `<option value="${m}" ${s.targetMinutes === m ? "selected" : ""}>${m} min</option>`).join("")}<option value="custom" ${![30, 45, 60].includes(s.targetMinutes) ? "selected" : ""}>Custom${![30, 45, 60].includes(s.targetMinutes) ? " (" + s.targetMinutes + ")" : ""}</option></select></label>

      <div class="dur-bar" style="margin-top:14px">${bars}</div>

        ${UI.durationPanel(s)}
        <div class="builder-single" id="builder-grid">
          <div><div class="row between" style="margin-bottom:10px"><h3>Run sheet</h3><div class="btn-row"><button class="btn sm" data-pick-game>${UI.icon("plus")} Add activity</button>${UI.menu([
              { label: "Add a break", icon: "clock", attr: 'data-add-kind="break"' },
              { label: "Add a custom activity", icon: "plus", attr: 'data-add-kind="custom"' },
            ], { title: "Other things to add" })}</div></div>
            <div class="runsheet" id="runsheet">${s.runSheet.length ? s.runSheet.map((a, i) => {

              return `<div class="rs-item ${a.status}" draggable="true" data-aid="${a.id}">

                  <div class="sum">${activitySummary(a, s)}</div>${probs.length ? `<div class="small" style="color:${probs.some(p => p.level === "error") ? "var(--red)" : "var(--amber)"};margin-top:4px">${UI.icon("warn")} ${esc(probs[0].message)}${probs.length > 1 ? ` (+${probs.length - 1})` : ""}</div>` : ""}</div>
                <div class="btn-row actions"><button class="btn sm ghost" data-configure="${a.id}">${UI.icon("edit")} ${editable ? "Configure" : "View"}</button>${UI.menu([
                  { label: "Move up", icon: "up", attr: `data-move="${a.id}" data-dir="-1"` + (i === 0 ? " disabled" : "") },
                  { label: "Move down", icon: "down", attr: `data-move="${a.id}" data-dir="1"` + (i === s.runSheet.length - 1 ? " disabled" : "") },
                  { sep: true },
                  { label: "Duplicate", icon: "copy", attr: `data-dup="${a.id}"` },

    },
    mount(root) {
      const s = TCL.session();
      root.addEventListener("click", async e => {
        const b0 = e.target.closest("[data-pick-game]");
        if (b0) { UI.gamePicker(); return; }
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.addKind) { TCL.Session.addActivity(b.dataset.addKind); UI.render(); return; }
        if (b.dataset.move) { const i = s.runSheet.findIndex(a => a.id === b.dataset.move); TCL.Session.moveActivity(b.dataset.move, i + Number(b.dataset.dir)); UI.render(); return; }
        if (b.dataset.dup) { TCL.Session.duplicateActivity(b.dataset.dup); UI.render(); return; }

          if (await UI.confirm("Remove from run sheet?", `<b>${esc(a.title)}</b> will be removed.${a.status === "complete" ? " It has already been played." : ""}${pts ? ` <b>${pts} score entries</b> from this activity will be deleted and totals will change.` : ""}`, { danger: true, okLabel: "Remove" })) { TCL.Session.removeActivity(a.id); UI.render(); }

      root.addEventListener("dragover", e => { const it = e.target.closest(".rs-item"); if (it && dragId && it.dataset.aid !== dragId) { e.preventDefault(); root.querySelectorAll(".rs-item.over").forEach(x => x.classList.remove("over")); it.classList.add("over"); } });

        ${cats.map(c => `<h3 style="margin:22px 0 10px">${esc(c)}</h3><div class="grid cols-3">${games.filter(g => g.category === c).map(g => {
          const n = TCL.Content.all(g.contentGame).filter(x => x.enabled).length;
          return `<div class="card"><div class="row between"><span class="icon">${g.icon}</span><span class="chip mono">~${U.fmtMin(g.estimateMinutes(TCL.Games.defaults(g), ctx))} default</span></div>
            <h3>${esc(g.name)}</h3><p>${esc(g.description)}</p>
            <div class="meta">${g.modes.map(m => `<span class="badge">${m}</span>`).join("")}${g.contentGame ? `<span class="badge">${n} items</span>` : '<span class="badge">no content needed</span>'}${TCL.Games.defaults(g).scoringEnabled === false ? '<span class="badge">not scored</span>' : ""}${TCL.Games.hasOverrides(g.id) ? '<span class="badge ok">your defaults</span>' : ""}${TCL.Readiness.breakoutKind(g) === "always" ? '<span class="badge breakout">Breakout rooms required</span>' : TCL.Readiness.breakoutKind(g) === "sometimes" ? '<span class="badge breakout soft">Breakout rooms optional</span>' : ""}${g.needsZoom ? `<span class="badge">${esc(g.needsZoom)}</span>` : ""}</div>
            <div class="btn-row" style="margin-top:14px"><button class="btn sm" data-add="${g.id}" ${s ? "" : "disabled"}>${UI.icon("plus")} Add to run sheet</button>${g.contentGame ? `<button class="btn sm ghost" data-go="content" data-go-param="${g.contentGame}">Content</button>` : ""}</div></div>`; }).join("")}</div>`).join("")}
      </div>`, { title: "Game Library" });
    },
    mount(root) {
      root.addEventListener("click", e => { const b = e.target.closest("[data-add]"); if (b) { const a = TCL.Session.addActivity("game", b.dataset.add); UI.toast(`Added ${a.title} to the run sheet`, "ok"); UI.render(); } });
    },
  });

  /* Settings is the one place that answers "what can I change?". Everything global lives
     here; everything that belongs to one session or one activity is reachable from here
     with a jump button, because a run sheet can hold the same game twice with different
     settings and those cannot become global without losing that. */
  const SETTINGS_MAP = [
    { what: "Console mode, sound, confirmations", where: "Here · How the console behaves" },
    { what: "Presentation size, scores on screen", where: "Here · The participant screen" },
    { what: "Default settings for each game", where: "Here · Activity defaults", note: "Applies to activities you add from now on" },
    { what: "This session: name, length, scoring, how activities are weighed, finale", where: "Here · This session" },
    { what: "Participants, teams, team names, attendance", where: "Participants", go: "participants" },
    { what: "Which activities run, in what order, for how long", where: "Session Builder", go: "builder" },
    { what: "Settings for one activity in the run sheet", where: "Session Builder · Configure", go: "builder", note: "Per instance, so the same game can run twice with different settings" },
    { what: "Questions, prompts, images and their categories", where: "Content", go: "content" },
    { what: "Reusable run sheets", where: "Here · Presets, and Session Builder · More" },
    { what: "Backups and stored data", where: "Here · Data" },
  ];

  UI.registerScreen("settings", {
    title: "Settings",
    render() {
      const st = TCL.state.settings;
      const s = TCL.session();
      const consoleSchema = [
        { key: "consoleMode", label: "Console mode", type: "select", basic: true, options: [{ value: "simple", label: "Simple: only the live controls" }, { value: "advanced", label: "Advanced: every setting and diagnostic" }], help: "Simple is the safe default while the team is watching. The toggle in the top bar switches at any time." },
        { key: "confirmRoutine", label: "Ask before routine interruptions", type: "toggle", basic: true, help: "Speed bumps only: finishing an activity early, starting one with a warning, opening settings mid-round. Anything that destroys something always asks, whatever this is set to." },
      ];
      const soundSchema = [
        { key: "sound", label: "Sound cues (ding on score, buzzer on time up)", type: "toggle", basic: true },
        { key: "silent", label: "Silent mode (mutes everything, overrides sound)", type: "toggle", basic: true },
        { key: "volume", label: "Volume", type: "range", min: 0.1, max: 1, step: 0.1, basic: true },
      ];
      const presSchema = [
        { key: "largeText", label: "Large-text presentation mode (Zoom-readable)", type: "toggle", basic: true },
        { key: "presentationScale", label: "Presentation text scale", type: "range", min: 0.8, max: 1.6, step: 0.1, basic: true },
        { key: "showScoresLive", label: "Show scores on the presentation, by default", type: "toggle", basic: true, help: "Seeds new sessions. The session you are running now has its own switch under This session." },
        { key: "hideScoresUntilFinale", label: "Hide scores until the finale", type: "toggle", basic: true },
        { key: "scoringEnabled", label: "Scoring on, by default", type: "toggle", basic: true, help: "Seeds new sessions. Individual activities can still be unscored." },
        { key: "scoreModel", label: "How activities are weighed, by default", type: "select", basic: true, options: TCL.Scoring.MODELS.map(m => ({ value: m.id, label: m.label })), help: "Seeds new sessions. Balanced stops one long activity deciding the whole championship." },
      ];
      const sessionSchema = s ? [
        { key: "name", label: "Session name", type: "text", basic: true },
        { key: "targetMinutes", label: "Target length", type: "select", basic: true, options: [{ value: 30, label: "30 minutes" }, { value: 45, label: "45 minutes" }, { value: 60, label: "60 minutes" }, { value: 75, label: "75 minutes" }, { value: 90, label: "90 minutes" }] },
        { key: "scoringEnabled", label: "Scoring for this session", type: "toggle", basic: true },
        { key: "showScores", label: "Show scores to participants during this session", type: "toggle", basic: true },
        { key: "scoreModel", label: "How activities are weighed", type: "select", basic: true, options: TCL.Scoring.MODELS.map(m => ({ value: m.id, label: m.label })), help: "Raw points are always kept underneath; this only changes how they are added up." },
        { key: "finaleMode", label: "How the session ends", type: "select", basic: true, options: [{ value: "podium", label: "Podium: rank the teams" }, { value: "shared", label: "Shared achievement: what we did together, no ranking" }], help: "Connection activities are unscored by default, so a podium can misrepresent the hour." },
        { key: "notes", label: "Facilitator notes for this session", type: "textarea", advanced: true },
      ] : [];
      const games = TCL.Games.list();
      const customised = games.filter(g => TCL.Games.hasOverrides(g.id));
      const size = TCL.Store.estimateSize();
      return UI.shell(`<div class="content narrow">
        <div class="page-head"><div><h1>Settings</h1><p>Everything you can configure, in one place. Things that belong to one session or one activity are linked from here rather than copied, so they stay where they apply.</p></div></div>

        <div class="panel"><h3>How the console behaves</h3><form id="console-settings">${UI.form(consoleSchema, st)}</form></div>

        <div class="panel"><h3>Sound</h3><form id="sound-settings">${UI.form(soundSchema, st)}</form>
          <div class="btn-row" style="margin-top:14px"><button class="btn sm ghost" data-test-sound>${UI.icon("sound")} Test sound</button><span class="dim small">${st.soundTested ? "Tested on this browser." : "Not tested yet."} Turn on "Share sound" in Zoom when you share the presentation window.</span></div></div>

        <div class="panel"><h3>The participant screen</h3><form id="pres-settings">${UI.form(presSchema, st)}</form>
          <div class="btn-row" style="margin-top:14px"><button class="btn sm ghost" data-open-presentation>${UI.icon("screen")} Open the presentation window</button><span class="dim small">Changes here reach it immediately.</span></div></div>

        ${s ? `<div class="panel"><h3>This session</h3><p class="sub">${esc(s.name)} · ${s.participants.filter(p => p.present).length} present · ${U.plural(s.runSheet.length, "activity", "activities")}</p>
          <form id="session-settings">${UI.formTiered(sessionSchema, { name: s.name, targetMinutes: s.targetMinutes, scoringEnabled: s.scoringEnabled !== false, showScores: s.showScores !== false, scoreModel: TCL.Scoring.model(s), finaleMode: s.finaleMode || "podium", notes: s.notes || "" })}</form>
          <div class="btn-row" style="margin-top:14px"><button class="btn sm ghost" data-nav="participants">${UI.icon("people")} Participants and team names</button><button class="btn sm ghost" data-nav="builder">${UI.icon("builder")} Run sheet and per-activity settings</button></div></div>`
        : `<div class="panel"><h3>This session</h3><p class="sub">No session is open. Session settings, participants, teams and the run sheet appear here once one is.</p><div class="btn-row"><button class="btn sm" data-nav="home">Open or create a session</button></div></div>`}

        <div class="panel"><h3>Activity defaults</h3>
          <p class="sub">Set how each game should start out, once, instead of reconfiguring it every time you add it. These apply to activities you add from now on; anything already on a run sheet keeps its own settings.</p>
          ${customised.length ? `<div class="stack" style="margin:12px 0">${customised.map(g => `<div class="msg-card"><div><b>${esc(g.name)}</b><div class="muted small">${esc(Object.keys(TCL.state.settings.gameDefaults[g.id]).map(k => k + " = " + JSON.stringify(TCL.state.settings.gameDefaults[g.id][k])).join(" · ").slice(0, 140))}</div></div>
            <div class="btn-row"><button class="btn sm ghost" data-game-defaults="${g.id}">Edit</button><button class="btn sm ghost" data-clear-defaults="${g.id}">Reset</button></div></div>`).join("")}</div>` : `<p class="dim small" style="margin:10px 0">Nothing customised yet: every game starts from its built-in defaults.</p>`}
          <div class="btn-row"><button class="btn sm" data-pick-defaults>${UI.icon("edit")} Change a game's defaults</button>${customised.length ? `<button class="btn sm ghost" data-clear-defaults="">Reset all ${customised.length}</button>` : ""}</div></div>

        <div class="panel"><h3>Content</h3><p class="sub">${TCL.Content.all().length} items across ${games.filter(g => g.contentGame).length} games: questions, prompts, words, scenarios and images. Add your own, edit or disable the built-ins, and see what has been used.</p>
          <div class="btn-row"><button class="btn sm ghost" data-nav="content">${UI.icon("content")} Open the content manager</button></div></div>

        <div class="panel"><h3>Presets</h3><p class="sub">${TCL.Session.presets().length} presets (${TCL.state.presets.length} of them yours). A preset is a saved run sheet you can load into any session.</p>
          <div class="btn-row"><button class="btn sm ghost" data-export-presets>${UI.icon("export")} Export yours (JSON)</button><button class="btn sm ghost" data-import-presets>${UI.icon("import")} Import presets</button>${s ? `<button class="btn sm ghost" data-nav="builder">Load one into this session</button>` : ""}</div></div>

        <div class="panel"><h3>How to open this file on the day</h3><p class="sub">Double-clicking works, and so does a local address. Serving it locally makes pop-ups, cross-window messaging and storage behave the same in every browser, so it is the safer choice for a live session.</p>
          <ol class="step-list"><li>Open Terminal in the folder that holds <code>team-connect.html</code>.</li><li>Run <code>python3 -m http.server 8080</code> (or <code>./serve.sh</code>).</li><li>Open <code>http://localhost:8080/team-connect.html</code>.</li><li>Leave the terminal window open for the whole session.</li></ol>
          <p class="sub" style="margin-top:8px">Currently running from <code>${esc(location.protocol)}//${esc(location.host || "file")}</code>${location.protocol === "file:" ? " — pop-up blocking varies more here than over http://localhost." : " — good."}</p></div>

        <div class="panel"><h3>Data</h3><p class="sub">Everything is stored in this browser only (${Math.round(size / 1024)} KB used). ${TCL.state.settings.lastBackupAt ? "Last backup exported " + U.fmtDate(new Date(TCL.state.settings.lastBackupAt).toISOString()) + "." : "No backup exported yet."} Export one before switching computers.</p>
          <div class="btn-row"><button class="btn sm ghost" data-backup>${UI.icon("export")} Export full backup</button><button class="btn sm ghost" data-restore>${UI.icon("import")} Restore backup</button><button class="btn sm danger" data-wipe>Delete all app data</button></div></div>

        <div class="panel"><h3>Where everything lives</h3><p class="sub">The full list of what can be configured and where.</p>
          <div class="table-wrap"><table class="tbl"><tr><th>What</th><th>Where</th><th></th></tr>
          ${SETTINGS_MAP.map(r => `<tr><td>${esc(r.what)}${r.note ? `<div class="dim small">${esc(r.note)}</div>` : ""}</td><td class="muted">${esc(r.where)}</td><td class="num">${r.go ? `<button class="btn xs ghost" data-nav="${r.go}">Go</button>` : ""}</td></tr>`).join("")}
          </table></div></div>

        <div class="panel"><h3>About</h3><p class="sub">TEAM CONNECT LIVE v${TCL.VERSION} · schema v${TCL.SCHEMA_VERSION} · runs offline from a single file. Zoom is used for video, audio, chat, reactions and breakout rooms; this app never controls Zoom.</p></div>
      </div>`, { title: "Settings" });
    },
    mount(root) {
      const st = TCL.state.settings; const s = TCL.session();
      UI.bindFormLive(root);
      const save = (formId, schema) => {
        const f = root.querySelector(formId); if (!f) return;
        f.addEventListener("change", () => { Object.assign(st, UI.readForm(f, schema, st)); TCL.persist(); TCL.Presenter.push(true); if (schema.some(x => x.key === "consoleMode")) UI.render(); });
      };
      save("#console-settings", [{ key: "consoleMode", type: "select" }, { key: "confirmRoutine", type: "toggle" }]);
      save("#sound-settings", [{ key: "sound", type: "toggle" }, { key: "silent", type: "toggle" }, { key: "volume", type: "range", min: 0.1, max: 1 }]);
      save("#pres-settings", [{ key: "largeText", type: "toggle" }, { key: "presentationScale", type: "range", min: 0.8, max: 1.6 }, { key: "showScoresLive", type: "toggle" }, { key: "hideScoresUntilFinale", type: "toggle" }, { key: "scoringEnabled", type: "toggle" }, { key: "scoreModel", type: "select" }]);
      const sf = root.querySelector("#session-settings");
      if (sf && s) sf.addEventListener("change", () => {
        const v = UI.readForm(sf, [{ key: "name", type: "text" }, { key: "targetMinutes", type: "select" }, { key: "scoringEnabled", type: "toggle" }, { key: "showScores", type: "toggle" }, { key: "scoreModel", type: "select" }, { key: "finaleMode", type: "select" }, { key: "notes", type: "textarea" }], {});
        s.name = String(v.name || "").trim() || s.name;
        s.targetMinutes = U.clamp(Number(v.targetMinutes) || s.targetMinutes, 10, 240);
        s.scoringEnabled = v.scoringEnabled; s.showScores = v.showScores; s.scoreModel = v.scoreModel; s.finaleMode = v.finaleMode; s.notes = v.notes;
        TCL.Session.touch(); TCL.Presenter.push(true); UI.render();
      });
      root.addEventListener("click", async e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.hasAttribute("data-test-sound")) { const ok = TCL.Audio.test(); TCL.state.settings.soundTested = ok; TCL.persist(); UI.toast(ok ? "Playing ding then buzzer" : "Audio is blocked by the browser. Click anywhere on the page first, then retry.", ok ? "ok" : "warn"); UI.render(); }
        if (b.hasAttribute("data-pick-defaults")) { UI.gameDefaultsPicker(); return; }
        if (b.dataset.gameDefaults) { UI.gameDefaultsEditor(b.dataset.gameDefaults); return; }
        if (b.hasAttribute("data-clear-defaults")) {
          const id = b.dataset.clearDefaults;
          const name = id ? (TCL.Games.get(id) || {}).name : "every game";
          if (await UI.confirm("Reset defaults?", `<b>${esc(name)}</b> will go back to the built-in defaults. Activities already on a run sheet are not affected.`, { okLabel: "Reset" })) { TCL.Games.clearDefaults(id || null); UI.toast("Defaults reset"); UI.render(); }
          return;
        }
        if (b.hasAttribute("data-export-presets")) U.download("team-connect-presets.json", JSON.stringify(TCL.state.presets, null, 2), "application/json");
        if (b.hasAttribute("data-import-presets")) { const v = await UI.prompt("Import presets", "Paste the JSON exported from another computer.", "", { multiline: true, okLabel: "Import" }); if (!v) return; try { const arr = JSON.parse(v); if (!Array.isArray(arr)) throw new Error("Expected an array"); let n = 0; arr.forEach(p => { if (p && p.name && Array.isArray(p.runSheet)) { TCL.state.presets.push(Object.assign({}, p, { id: U.uid("preset"), builtIn: false })); n++; } }); TCL.persist(); UI.toast(`Imported ${n} presets`, "ok"); UI.render(); } catch (err) { UI.toast("Could not import: " + err.message, "error"); } }
        if (b.hasAttribute("data-backup")) { U.download(`team-connect-backup-${U.today()}.json`, JSON.stringify(TCL.state, null, 2), "application/json"); TCL.state.settings.lastBackupAt = Date.now(); TCL.persist(); UI.toast("Backup downloaded", "ok"); UI.render(); }
        if (b.hasAttribute("data-restore")) { const v = await UI.prompt("Restore backup", "Paste a full backup JSON. <b>This replaces all current app data.</b>", "", { multiline: true, okLabel: "Restore" }); if (!v) return; try { const data = JSON.parse(v); if (!data || typeof data !== "object" || !("sessions" in data)) throw new Error("Not a TEAM CONNECT LIVE backup"); TCL.Store.save(data); location.reload(); } catch (err) { UI.toast("Could not restore: " + err.message, "error"); } }
        if (b.hasAttribute("data-wipe")) { if (await UI.confirm("Delete all app data?", "<b>All sessions, presets, custom content, activity defaults and usage history</b> will be removed from this browser. Export a backup first if you might need it.", { danger: true, okLabel: "Delete everything" })) { TCL.Store.clear(); location.reload(); } }
      });
    },
  });

  /* Choose which game's defaults to change. */
  UI.gameDefaultsPicker = function () {
    const games = TCL.Games.list();
    return UI.modal({ title: "Which game?", wide: true,
      form: `<div class="pick-grid">${games.map(g => `<button type="button" class="pick-card" data-def="${g.id}"><span class="icon">${g.icon}</span>
        <span class="body"><b>${esc(g.name)}</b><span class="muted small">${esc(g.tagline || g.description)}</span>
        <span class="meta"><span class="badge">${esc(g.category)}</span>${TCL.Games.hasOverrides(g.id) ? '<span class="badge ok">customised</span>' : ""}</span></span></button>`).join("")}</div>`,
      buttons: [{ label: "Close", value: null }],
      onOpen: el => el.addEventListener("click", ev => { const b = ev.target.closest("[data-def]"); if (b) { UI.closeModal(); UI.gameDefaultsEditor(b.dataset.def); } }) });
  };

  /* Edit one game's defaults. Same tiered form as the per-activity dialog. */
  UI.gameDefaultsEditor = async function (gameId) {
    const g = TCL.Games.get(gameId); if (!g) return;
    const s = TCL.session();
    let values = TCL.Games.defaults(g);
    const ctx = TCL.Duration.ctx(s);
    const summary = v => { try { return esc(g.summary ? g.summary(v, ctx) : "") + ` <b>≈ ${U.fmtMin(g.estimateMinutes(v, ctx))}</b>`; } catch (e) { return ""; } };
    const pending = s ? s.runSheet.filter(a => a.gameId === gameId && a.status === "pending").length : 0;
    const v = await UI.modal({ title: `Defaults for ${g.name}`, wide: true,
      body: `<p>How this game starts out every time you add it. Activities already on a run sheet keep their own settings.</p>`,
      form: `<div id="gd">${UI.formTiered(g.settingsSchema, values)}</div><div class="callout gold" style="margin-top:14px" id="gd-summary">${summary(values)}</div>
        ${pending ? `<label class="switch" style="margin-top:12px"><input type="checkbox" id="gd-apply"><span class="track"></span><span class="txt">Also apply to the ${U.plural(pending, "activity", "activities")} of this game already waiting in this session</span></label>` : ""}`,
      buttons: [{ label: "Cancel", value: null }, { label: "Back to built-in defaults", value: "reset", kind: "ghost" },
        { label: "Save defaults", primary: true, value: el => ({ settings: UI.readForm(el.querySelector("#gd"), g.settingsSchema, values), apply: !!(el.querySelector("#gd-apply") || {}).checked }) }],
      onOpen: el => {
        const form = el.querySelector("#gd");
        const refresh = () => { values = UI.readForm(form, g.settingsSchema, values); el.querySelector("#gd-summary").innerHTML = summary(values);
          if (g.settingsSchema.some(f => f.showIf)) { const open = !!form.querySelector(".adv-block[open]"); const html = UI.formTiered(g.settingsSchema, values, { open }); if (html !== form.innerHTML) form.innerHTML = html; } };
        UI.bindFormLive(el, refresh);
        form.addEventListener("change", refresh);
      } });
    if (!v) return;
    if (v === "reset") { TCL.Games.clearDefaults(gameId); UI.toast(`${g.name} is back to its built-in defaults`); UI.render(); return; }
    TCL.Games.setDefaults(gameId, v.settings);
    if (v.apply && s) { s.runSheet.forEach(a => { if (a.gameId === gameId && a.status === "pending") a.settings = U.clone(TCL.Games.defaults(gameId)); }); TCL.Session.touch(); }
    UI.toast(TCL.Games.hasOverrides(gameId) ? `Saved. New ${g.name} activities will start this way.` : `${g.name} matches its built-in defaults again.`, "ok");
    UI.render();
  };
})();
