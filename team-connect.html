/* src/core/35-audio.js  WebAudio cues, no files. Honours silent mode. */
(function () {
  "use strict";
  const TCL = window.TCL;
  const Audio = TCL.Audio = {};
  let ctx = null;
  Audio.blocked = false;
  function enabled() { const s = TCL.state && TCL.state.settings; return s && s.sound && !s.silent; }
  function beep(freq, dur, type, gain) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      const vol = (TCL.state && TCL.state.settings ? TCL.state.settings.volume : 0.6) * (gain || 0.12);
      g.gain.value = vol;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
      Audio.blocked = false;
    } catch (e) { Audio.blocked = true; }
  }
  Audio.ding = function (force) { if (!force && !enabled()) return; beep(880, 0.15); setTimeout(() => beep(1320, 0.2), 120); };
  Audio.buzzer = function (force) { if (!force && !enabled()) return; beep(180, 0.7, "sawtooth"); };
  Audio.tickWarn = function (force) { if (!force && !enabled()) return; beep(660, 0.06, "square", 0.05); };
  Audio.fanfare = function (force) { if (!force && !enabled()) return; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25), i * 140)); };
  Audio.test = function () { beep(880, 0.15); setTimeout(() => beep(1320, 0.2), 120); setTimeout(() => beep(180, 0.6, "sawtooth"), 600); return !Audio.blocked; };
})();


/* ==== src/core/36-readiness.js ==== */
/* src/core/36-readiness.js
   Pre-session readiness check. Every item returns a level:
     ok      - nothing to do
     warn    - the facilitator may override and start anyway
     blocker - starting would fail or embarrass someone; must be fixed
   Nothing here changes the session; it only reports. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const R = TCL.Readiness = {};

  R.ack = function (key, on) {
    const s = TCL.session(); if (!s) return;
    s.ready = s.ready || {};
    s.ready[key] = on !== false;
    TCL.Session.touch();
  };
  R.acked = function (key) { const s = TCL.session(); return !!(s && s.ready && s.ready[key]); };

  /* One check helper so every row has the same shape. */
  function row(id, label, level, detail, fix) { return { id, label, level, detail: detail || "", fix: fix || null }; }

  R.check = function (session) {
    const s = session || TCL.session();
    if (!s) return [];
    const out = [];
    const present = TCL.Teams.present(s);

    /* 1. Participants */
    if (!present.length) out.push(row("participants", "Participants confirmed", "blocker", "Nobody is marked present.", "participants"));
    else if (present.length < 2) out.push(row("participants", "Participants confirmed", "warn", "Only one person is present. Most activities need at least two.", "participants"));
    else if (!R.acked("participantsConfirmed")) out.push(row("participants", "Participants confirmed", "warn", `${present.length} present, ${s.participants.length - present.length} marked away. Tick this once you have checked the list against who actually joined.`, "participants"));
    else out.push(row("participants", "Participants confirmed", "ok", `${present.length} present.`));

    /* 2. Teams balanced */
    if (s.teamMode === "individual") out.push(row("teams", "Teams balanced", "ok", "Individual mode: no teams needed."));
    else if (!s.teams.length) out.push(row("teams", "Teams balanced", "blocker", "No teams exist. Build teams or switch to individual mode.", "participants"));
    else {
      const sizes = s.teams.map(t => TCL.Teams.presentMembers(t, s).length);
      const empty = s.teams.filter((t, i) => sizes[i] === 0);
      const spread = Math.max.apply(null, sizes) - Math.min.apply(null, sizes);
      if (empty.length) out.push(row("teams", "Teams balanced", "blocker", `${empty.map(t => t.name).join(", ")} ${empty.length === 1 ? "has" : "have"} nobody present.`, "participants"));
      else if (spread > 1) out.push(row("teams", "Teams balanced", "warn", `Team sizes are ${sizes.join(" / ")}. Rebalance for a fairer game.`, "participants"));
      else out.push(row("teams", "Teams balanced", "ok", `${s.teams.length} teams of ${sizes.join(" / ")}.`));
    }

    /* 3. Games configured */
    if (!s.runSheet.length) out.push(row("runsheet", "Activities configured", "blocker", "The run sheet is empty.", "builder"));
    else {
      const errs = [], warns = [];
      s.runSheet.filter(a => a.kind === "game" && a.status === "pending").forEach(a => {
        TCL.Runner.validate(a).forEach(p => { (p.level === "error" ? errs : warns).push(`${a.title}: ${p.message}`); });
      });
      if (errs.length) out.push(row("runsheet", "Activities configured", "blocker", errs.join(" · "), "builder"));
      else if (warns.length) out.push(row("runsheet", "Activities configured", "warn", warns.slice(0, 3).join(" · ") + (warns.length > 3 ? ` (+${warns.length - 3} more)` : ""), "builder"));
      else out.push(row("runsheet", "Activities configured", "ok", `${U.plural(s.runSheet.length, "activity", "activities")}, no problems found.`));
    }

    /* 4. Content available */
    const short = [];
    s.runSheet.filter(a => a.kind === "game").forEach(a => {
      const g = TCL.Games.get(a.gameId); if (!g || !g.contentGame) return;
      const st = TCL.Runner.settingsOf(a);
      const want = Number(st.count || st.rounds || st.turns || st.items || 0);
      if (!want) return;
      const sel = TCL.Content.select({ game: g.contentGame, count: want, categories: st.categories, difficultyMin: st.difficultyMin, difficultyMax: st.difficultyMax });
      if (sel.pool < want) short.push(`${a.title}: ${sel.pool} of ${want} items match the filters`);
    });
    if (short.length) out.push(row("content", "Content available", "warn", short.join(" · "), "content"));
    else out.push(row("content", "Content available", "ok", "Every activity has enough content for its settings."));

    /* 5. Fits the target */
    const d = TCL.Duration.runSheet(s);
    if (d.over > 2) out.push(row("fit", `Session fits within ${U.fmtMin(d.target)}`, "warn", `Estimated ${U.fmtMin(d.total)}: ${U.fmtMin(d.over)} over. Use Auto-fit, or plan to use Running late during the session.`, "builder"));
    else if (d.spare > 12) out.push(row("fit", `Session fits within ${U.fmtMin(d.target)}`, "warn", `Estimated ${U.fmtMin(d.total)}: ${U.fmtMin(d.spare)} spare. Add an activity or shorten the target.`, "builder"));
    else out.push(row("fit", `Session fits within ${U.fmtMin(d.target)}`, "ok", `Estimated ${U.fmtMin(d.total)}.`));

    /* 6 & 7. Presentation window and pop-ups */
    const ps = TCL.Presenter.status;
    if (ps === "connected") out.push(row("presentation", "Presentation window connected", "ok", "Share that window in Zoom, not this one."));
    else if (ps === "blocked") out.push(row("presentation", "Presentation window connected", "warn", "The browser blocked the pop-up. Allow pop-ups for this page, or open the file in a second tab and add #presentation to the address.", "presentation"));
    else out.push(row("presentation", "Presentation window connected", "warn", "Not open yet. Open it before you start sharing your screen.", "presentation"));
    out.push(ps === "blocked"
      ? row("popups", "Pop-ups allowed", "warn", "Pop-ups are blocked for this page.", "presentation")
      : row("popups", "Pop-ups allowed", "ok", ps === "connected" ? "The presentation window opened normally." : "No pop-up block detected yet."));

    /* 8. Sound */
    const st8 = TCL.state.settings;
    if (st8.silent) out.push(row("sound", "Sound tested", "ok", "Silent mode is on, so no cues will play."));
    else if (st8.soundTested) out.push(row("sound", "Sound tested", "ok", "Ding and buzzer played."));
    else out.push(row("sound", "Sound tested", "warn", "Play the test cue once so the browser unlocks audio before the meeting.", "sound"));

    /* 9. Zoom instructions acknowledged */
    const breakouts = R.breakoutActivities(s);
    out.push(R.acked("zoomAck")
      ? row("zoom", "Zoom screen-sharing steps acknowledged", "ok", breakouts.length ? `${breakouts.length} activities need breakout rooms.` : "No breakout rooms needed.")
      : row("zoom", "Zoom screen-sharing steps acknowledged", "warn", `Share the presentation window only, tick "Share sound", and keep this console on your own screen.${breakouts.length ? ` ${breakouts.length} activities need breakout rooms: ${breakouts.map(a => a.title).join(", ")}.` : ""}`, "zoom"));

    /* 10. Backup */
    const last = TCL.state.settings.lastBackupAt;
    if (!TCL.Store.available) out.push(row("backup", "Backup saved", "warn", "Browser storage is unavailable, so nothing is being saved. Export a backup if you need a record.", "backup"));
    else if (last) out.push(row("backup", "Backup saved", "ok", "Last export " + U.fmtDate(new Date(last).toISOString()) + "."));
    else out.push(row("backup", "Backup saved", "warn", "No backup exported yet. One click saves a JSON copy of everything.", "backup"));

    return out;
  };

  /* Activities that need Zoom breakout rooms with the settings they currently hold. */
  R.breakoutActivities = function (session) {
    const s = session || TCL.session(); if (!s) return [];
    return s.runSheet.filter(a => {
      if (a.kind !== "game") return false;
      const g = TCL.Games.get(a.gameId); if (!g || !g.needsBreakout) return false;
      if (g.needsBreakout === true) return true;
      try { return !!g.needsBreakout(TCL.Runner.settingsOf(a)); } catch (e) { return false; }
    });
  };
  /* Does one game definition ever use breakout rooms? "always" | "sometimes" | null */
  R.breakoutKind = function (g, settings) {
    if (!g || !g.needsBreakout) return null;
    if (g.needsBreakout === true) return "always";
    if (settings) { try { return g.needsBreakout(settings) ? "always" : null; } catch (e) { return "sometimes"; } }
    return "sometimes";
  };

  R.verdict = function (rows) {
    rows = rows || R.check();
    const blockers = rows.filter(r => r.level === "blocker");
    const warnings = rows.filter(r => r.level === "warn");
    return { rows, blockers, warnings, canStart: blockers.length === 0, clean: !blockers.length && !warnings.length };
  };

  /* Breakout room plan: one row per team with its present members, plus a broadcast message. */
  R.breakoutPlan = function (activity, session) {
    const s = session || TCL.session(); if (!s) return { rooms: [], text: "" };
    const rooms = s.teams.map((t, i) => ({ room: i + 1, name: t.name, members: TCL.Teams.presentMembers(t, s).map(p => p.displayName || p.name) })).filter(r => r.members.length);
    const title = activity ? activity.title : "Breakout";
    const mins = activity && activity.settings ? (activity.settings.breakoutMinutes || activity.settings.minutes || activity.settings.seconds / 60) : null;
    const text = [`${title.toUpperCase()}${mins ? ` · ${Math.round(mins)} minutes in your breakout room` : ""}`, "",
      ...rooms.map(r => `Room ${r.room} · ${r.name}: ${r.members.join(", ")}`),
      "", "Come back to the main room when the timer ends."].join("\n");
    return { rooms, text };
  };
})();


/* ==== src/core/37-pacing.js ==== */
/* src/core/37-pacing.js
   "Running late" model. Projects the finish time from the real session clock and the
   remaining run sheet, then offers ranked adjustments. The activity that is currently
   running is never touched. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const P = TCL.Pacing = {};

  P.BEHIND_MIN = 3;          // minutes over target before the warning appears
  P.SETTLE_FRACTION = 0.12;  // and not until this much of the session has actually run

  function remainingActivities(s) {
    return s.runSheet.filter(a => a.status === "pending" || a.status === "paused");
  }
  /* Minutes still to spend on the activity that is running right now. */
  function currentRemaining(s) {
    const a = TCL.Runner.current();
    if (!a || a.status !== "active") return 0;
    const est = TCL.Duration.activity(a, s);
    const spent = TCL.Timers.elapsed("activity") / 60000;
    return Math.max(0, est - spent);
  }
  P.status = function (session) {
    const s = session || TCL.session();
    if (!s) return { behind: false, elapsed: 0, projected: 0, target: 0, over: 0, remaining: 0 };
    const elapsed = TCL.Timers.elapsed("session") / 60000;
    const rest = remainingActivities(s);
    const restMin = U.sum(rest.map(a => TCL.Duration.activity(a, s)));
    const transitions = Math.max(0, rest.length) * TCL.Duration.TRANSITION_MIN;
    const remaining = currentRemaining(s) + restMin + transitions;
    const target = Number(s.targetMinutes) || 0;
    const projected = elapsed + remaining;
    const over = projected - target;
    /* An estimate that is a few minutes long before anything has happened is a planning
       problem, not a pacing one. Wait until the session has actually run a while, or an
       activity has finished, before calling it late. */
    const settled = elapsed > Math.min(8, target * P.SETTLE_FRACTION) || s.runSheet.some(a => a.status === "complete" || a.status === "skipped");
    return { behind: settled && over > P.BEHIND_MIN, settled, elapsed, remaining, projected, target, over: Math.max(0, over), under: Math.max(0, -over), count: rest.length };
  };

  /* Flexible pending activities we are allowed to shrink (never the running one). */
  function flexPending(s) {
    return remainingActivities(s).filter(a => a.id !== s.currentActivityId && TCL.Duration.isFlexible(a));
  }
  function flexStep(a, s, down) {
    const g = TCL.Games.get(a.gameId);
    const key = g.flexKey, spec = (g.settingsSchema || []).find(x => x.key === key) || { min: 1, max: 30 };
    const cur = U.num(a.settings[key], U.num(g.defaultSettings[key], 1), spec.min || 1, spec.max || 60);
    const next = down ? cur - 1 : cur + 1;
    if (next < (spec.min || 1) || next > (spec.max || 60)) return null;
    const trial = Object.assign({}, a, { settings: Object.assign({}, a.settings, { [key]: next }) });
    return { key, cur, next, delta: TCL.Duration.activity(a, s) - TCL.Duration.activity(trial, s) };
  }

  /* --- the individual adjustments. Each returns minutes actually saved. --- */
  const ACTIONS = {
    /* Trim flexible games evenly until the projection fits, or nothing can shrink further. */
    shorten(s, needMin) {
      let saved = 0, guard = 0;
      const need = needMin == null ? Infinity : needMin;
      while (saved < need && guard++ < 60) {
        let best = null;
        flexPending(s).forEach(a => {
          const st = flexStep(a, s, true); if (!st || st.delta <= 0) return;
          if (!best || st.delta > best.st.delta) best = { a, st };
        });
        if (!best) break;
        best.a.settings[best.st.key] = best.st.next;
        saved += best.st.delta;
      }
      return saved;
    },
    /* One item off every remaining flexible activity: predictable, spreads the pain. */
    fewer(s) {
      let saved = 0;
      flexPending(s).forEach(a => { const st = flexStep(a, s, true); if (st && st.delta > 0) { a.settings[st.key] = st.next; saved += st.delta; } });
      return saved;
    },
    skipNext(s) {
      const next = remainingActivities(s).filter(a => a.id !== s.currentActivityId)[0];
      if (!next) return 0;
      const saved = TCL.Duration.activity(next, s) + TCL.Duration.TRANSITION_MIN;
      next.status = "skipped";
      return saved;
    },
    dropBreak(s) {
      const breaks = remainingActivities(s).filter(a => a.kind === "break" && a.id !== s.currentActivityId);
      let saved = 0;
      breaks.forEach(a => { saved += TCL.Duration.activity(a, s) + TCL.Duration.TRANSITION_MIN; a.status = "skipped"; });
      return saved;
    },
    extend(s, minutes) {
      const add = Math.ceil(minutes || P.status(s).over || 5);
      s.targetMinutes = U.clamp((Number(s.targetMinutes) || 60) + add, 10, 240);
      return -add;
    },
    /* Least disruptive first: drop breaks, trim flexible games, then skip an activity. */
    autoFinish(s) {
      let saved = 0;
      const need = () => Math.max(0, P.status(s).over);
      if (need() > 0) saved += ACTIONS.dropBreak(s);
      if (need() > 0) saved += ACTIONS.shorten(s, need());
      let guard = 0;
      while (need() > 0 && guard++ < 10) {
        const before = need();
        const n = ACTIONS.skipNext(s);
        if (!n) break;
        saved += n;
        if (need() >= before) break;
      }
      return saved;
    },
  };

  /* Ranked options with an honest estimate of what each one saves. disruption 1 = mildest. */
  P.options = function (session) {
    const s = session || TCL.session(); if (!s) return [];
    const st = P.status(s);
    const flex = flexPending(s);
    const next = remainingActivities(s).filter(a => a.id !== s.currentActivityId)[0];
    const breaks = remainingActivities(s).filter(a => a.kind === "break" && a.id !== s.currentActivityId);
    const out = [];

    const breakMin = U.sum(breaks.map(a => TCL.Duration.activity(a, s) + TCL.Duration.TRANSITION_MIN));
    if (breaks.length) out.push({ id: "dropBreak", disruption: 1, label: "Remove the scheduled break", detail: `${U.plural(breaks.length, "break")} still to come.`, saves: breakMin });

    if (flex.length) {
      const trim = P.dryRun(s, "shorten", st.over);
      if (trim > 0.4) out.push({ id: "shorten", disruption: 2, label: "Shorten the remaining activities", detail: `Trims question and round counts across ${U.plural(flex.length, "activity", "activities")} until the session fits.`, saves: trim });
      const one = P.dryRun(s, "fewer");
      /* Trimming to fit and taking one item off each often land on the same number. Two options
         that save the same minutes and read almost alike are a decision to make under pressure
         with nothing to decide, so offer only the fit-targeted one when they converge. */
      const sameAsTrim = trim > 0.4 && Math.round(one) === Math.round(trim);
      if (one > 0.4 && !sameAsTrim) out.push({ id: "fewer", disruption: 2, label: "One less question in each remaining activity", detail: `Takes a single item off ${U.plural(flex.length, "activity", "activities")}.`, saves: one });
    }
    if (next) out.push({ id: "skipNext", disruption: 4, label: `Skip the next activity (${next.title})`, detail: "It stays in the run sheet as skipped and can be reset later.", saves: TCL.Duration.activity(next, s) + TCL.Duration.TRANSITION_MIN });
    if (st.over > 0) out.push({ id: "autoFinish", disruption: 5, label: "Finish on time automatically", detail: "Drops breaks, then trims activities, then skips as a last resort. Never changes the activity that is running.", saves: st.over });
    out.push({ id: "extend", disruption: 3, label: `Extend the session by ${Math.max(5, Math.ceil(st.over || 5))} minutes`, detail: "Nothing is cut. Only do this if the meeting can actually run longer.", saves: -Math.max(5, Math.ceil(st.over || 5)) });

    /* Recommend the mildest option that closes the gap on its own. */
    const closes = out.filter(o => o.saves >= st.over - 0.5 && o.id !== "extend" && o.id !== "autoFinish");
    const rec = U.sortBy(closes, o => o.disruption)[0] || out.find(o => o.id === "autoFinish") || out[0];
    out.forEach(o => { o.recommended = rec && o.id === rec.id; });
    return U.sortBy(out, o => o.disruption);
  };

  /* Estimate an action without keeping the change: snapshot, run, restore. */
  P.dryRun = function (session, id, needMin) {
    const s = session || TCL.session(); if (!s) return 0;
    const fn = ACTIONS[id]; if (!fn) return 0;
    const snapshot = JSON.stringify(s.runSheet.map(a => ({ settings: a.settings, status: a.status })));
    const target = s.targetMinutes;
    let saved = 0;
    try { saved = fn(s, needMin) || 0; } catch (e) { saved = 0; }
    const before = JSON.parse(snapshot);
    s.runSheet.forEach((a, i) => { a.settings = before[i].settings; a.status = before[i].status; });
    s.targetMinutes = target;
    return saved;
  };

  P.apply = function (id, session) {
    const s = session || TCL.session(); if (!s) return { ok: false };
    const fn = ACTIONS[id]; if (!fn) return { ok: false };
    const labels = { shorten: "Shortened remaining activities", fewer: "One less item per remaining activity", skipNext: "Skipped the next activity", dropBreak: "Removed the scheduled break", extend: "Extended the session", autoFinish: "Auto-adjusted to finish on time" };
    TCL.History.record("Running late: " + (labels[id] || id), { safeRedo: false });
    const saved = fn(s) || 0;
    TCL.History.log((labels[id] || id) + (saved > 0 ? ` (saved ${U.fmtMin(saved)})` : ""));
    TCL.Session.touch();
    TCL.emit("runner:changed");
    return { ok: true, saved };
  };
})();


/* ==== src/core/38-rehearsal.js ==== */
/* src/core/38-rehearsal.js
   Rehearsal mode: a throwaway session with sample people, compressed timers and no
   side effects on real content usage or real scores. Ends by deleting itself. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Rehearsal = TCL.Rehearsal = {};

  Rehearsal.SPEED = 5;            // timers run this many times faster
  Rehearsal.MIN_MS = 6000;        // but never shorter than this
  Rehearsal.PEOPLE = ["Sample Priya", "Sample Tom", "Sample Mei-Ling", "Sample Arjun", "Sample Grace", "Sample Ben"];

  Rehearsal.active = function (session) {
    const s = session === undefined ? TCL.session() : session;
    return !!(s && s.rehearsal);
  };
  /* Compress a duration for rehearsal. Called by the timer module. */
  Rehearsal.scale = function (ms) {
    if (!Rehearsal.active() || !ms) return ms;
    return Math.max(Rehearsal.MIN_MS, Math.round(ms / Rehearsal.SPEED));
  };

  Rehearsal.existing = function () { return TCL.state.sessions.find(s => s.rehearsal) || null; };

  /* Start a rehearsal. Every game is on the run sheet so any of them can be jumped to. */
  Rehearsal.start = function (opts) {
    opts = opts || {};
    const prev = Rehearsal.existing();
    if (prev) TCL.Session.remove(prev.id);
    TCL.state.rehearsalReturnTo = TCL.state.currentSessionId && !Rehearsal.active(U.byId(TCL.state.sessions, TCL.state.currentSessionId)) ? TCL.state.currentSessionId : (TCL.state.rehearsalReturnTo || null);
    const s = TCL.Session.create({ name: "Rehearsal (practice run)", targetMinutes: 60, participants: Rehearsal.PEOPLE });
    s.rehearsal = true;
    s.participants.forEach((p, i) => { p.location = i % 2 ? "Gurugram" : "Sydney"; p.fact = "Sample fact number " + (i + 1); });
    TCL.Teams.build(2);
    const ids = opts.games || TCL.Games.list().map(g => g.id);
    ids.forEach(id => {
      const a = TCL.Session.addActivity("game", id);
      /* Small counts so a rehearsal round finishes in a few clicks. */
      ["count", "rounds", "turns", "items"].forEach(k => { if (a.settings[k] != null) a.settings[k] = Math.min(2, a.settings[k]); });
      if (a.settings.breakoutMinutes != null) a.settings.breakoutMinutes = 3;
      if (a.settings.collectMinutes != null) a.settings.collectMinutes = 1;
    });
    s.status = "live";
    TCL.Session.touch();
    TCL.emit("session:changed");
    return s;
  };

  /* Jump straight to any game: close whatever is running, reset the target, start it. */
  Rehearsal.jumpTo = function (gameId) {
    const s = TCL.session(); if (!s || !s.rehearsal) return { ok: false, reason: "Not in a rehearsal." };
    const cur = TCL.Runner.current();
    if (cur && (cur.status === "active" || cur.status === "paused")) { TCL.Runner.resetActivity(cur.id, false); s.currentActivityId = null; }
    let a = s.runSheet.find(x => x.gameId === gameId);
    if (!a) a = TCL.Session.addActivity("game", gameId);
    if (a.status !== "pending") TCL.Runner.resetActivity(a.id, false);
    a.forceStart = true;
    const r = TCL.Runner.start(a.id);
    return r;
  };

  /* End and clean up. Returns the id of the session to go back to, if any. */
  Rehearsal.end = function () {
    const s = TCL.session();
    const back = TCL.state.rehearsalReturnTo;
    if (s && s.rehearsal) TCL.Session.remove(s.id);
    TCL.state.sessions.filter(x => x.rehearsal).forEach(x => TCL.Session.remove(x.id));
    TCL.state.rehearsalReturnTo = null;
    if (back && U.byId(TCL.state.sessions, back)) TCL.state.currentSessionId = back;
    else TCL.state.currentSessionId = null;
    TCL.persist(true);
    TCL.emit("session:changed");
    return TCL.state.currentSessionId;
  };
})();


/* ==== src/core/39-participation.js ==== */
/* src/core/39-participation.js
   Private participation tracking. Records who has taken a turn in which role so the
   facilitator can spread opportunities. Never leaves the console: it is not in the
   presentation payload, the results screen or the exported summary. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Part = TCL.Participation = {};

  /* Human labels for the rotation keys games use. */
  const ROLES = Part.ROLES = {
    spotlight: "In the spotlight", describer: "Described", drawer: "Drew", actor: "Acted",
    guesser: "Guessed", spokesperson: "Presented", reader: "Read aloud", holder: "Held a clue", turn: "Took a turn",
  };
  Part.roleLabel = key => ROLES[key] || U.titleCase(String(key || "turn").replace(/[-_]/g, " "));

  Part.record = function (pid, roleKey, session) {
    const s = session || TCL.session();
    if (!s || !pid) return;
    s.participation = s.participation || {};
    const rec = s.participation[pid] = s.participation[pid] || { turns: 0, roles: {}, lastAt: null };
    rec.turns += 1;
    const k = roleKey || "turn";
    rec.roles[k] = (rec.roles[k] || 0) + 1;
    rec.lastAt = Date.now();
  };

  /* Rows for the private panel: everyone present, most-neglected first. */
  Part.rows = function (session) {
    const s = session || TCL.session(); if (!s) return [];
    const p = s.participation || {};
    const rows = TCL.Teams.present(s).map(x => {
      const rec = p[x.id] || { turns: 0, roles: {}, lastAt: null };
      const team = TCL.Teams.teamOf(x.id, s);
      return { id: x.id, name: x.displayName || x.name, turns: rec.turns, roles: rec.roles, lastAt: rec.lastAt,
        teamName: team ? team.name : "", color: team ? team.color : "var(--gold)",
        roleText: Object.keys(rec.roles).map(k => `${Part.roleLabel(k)}${rec.roles[k] > 1 ? " ×" + rec.roles[k] : ""}`).join(", ") };
    });
    /* fewest turns first; among equals, the person waiting longest since their last turn */
    return U.sortBy(rows, r => r.turns * 1e13 + (r.lastAt || 0));
  };
  Part.notYet = function (session) { return Part.rows(session).filter(r => r.turns === 0); };

  /* How often each team has been awarded points, as a rough "who is answering" signal. */
  Part.teamActivity = function (session) {
    const s = session || TCL.session(); if (!s) return [];
    const counts = {};
    (s.scoreEvents || []).forEach(e => { if (e.undone || !e.teamId) return; counts[e.teamId] = (counts[e.teamId] || 0) + 1; });
    return U.sortBy(s.teams.map(t => ({ id: t.id, name: t.name, color: t.color, answers: counts[t.id] || 0 })), r => r.answers, true);
  };

  /* Who should go next on fairness alone: fewest turns, then longest since their last one,
     ignoring anyone currently sitting out. */
  Part.suggest = function (session) {
    const s = session || TCL.session(); if (!s) return null;
    const out = TCL.Teams.deferred(s);
    const rows = Part.rows(s).filter(r => !out.includes(r.id));
    return rows.length ? rows[0] : null;
  };
  Part.reset = function (session) { const s = session || TCL.session(); if (s) { s.participation = {}; TCL.Session.touch(); } };
})();

/* src/core/40-session.js
   Session lifecycle, run sheet editing, persistence wiring. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Session = TCL.Session = {};

  TCL.state = null;
  TCL.session = function () {
    const st = TCL.state; if (!st || !st.currentSessionId) return null;
    return U.byId(st.sessions, st.currentSessionId);
  };

  Session.blank = function (name, targetMinutes) {
    /* App-level defaults seed a new session; the session then owns its own copy so
       changing the default later never rewrites a session you already built. */
    const app = (TCL.state && TCL.state.settings) || {};
    return {
      id: U.uid("s"), name: name || ("Team Connect " + U.today()), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      status: "draft", targetMinutes: targetMinutes || 60,
      participants: [], teamMode: "teams", teams: [], teamsLocked: false,
      runSheet: [], currentActivityId: null, scoreEvents: [], timers: TCL.Timers.blankSet(),
      log: [], undo: { stack: [], redo: [] }, scoringEnabled: app.scoringEnabled !== false, showScores: app.showScoresLive !== false, rot: {}, notes: "",
      finaleMode: "podium", ready: {}, participation: {}, rehearsal: false, holding: null, deferred: [], rotNext: {},
      scoreModel: app.scoreModel || "balanced",
    };
  };
  Session.create = function (opts) {
    opts = opts || {};
    const s = Session.blank(opts.name, opts.targetMinutes);
    if (opts.participants) s.participants = opts.participants.map(n => typeof n === "string" ? TCL.Teams.newParticipant(n) : n);
    TCL.state.sessions.push(s);
    TCL.state.currentSessionId = s.id;
    if (opts.preset) Session.applyPreset(opts.preset);
    TCL.Teams.refreshNames(s);
    Session.touch();
    return s;
  };
  /* Holding screen: covers the presentation without touching the activity underneath.
     kind is one of the presets below, or "custom" with a message. */
  Session.HOLDING = [
    { id: "return", title: "Please return to the main room", sub: "We start again as soon as everyone is back." },
    { id: "setup", title: "Setting up the next activity", sub: "One moment. Stretch, refill your cup." },
    { id: "pause", title: "Technical pause", sub: "Hold tight. We will be right back." },
    { id: "results", title: "Results coming up", sub: "Totting up the scores." },
  ];
  Session.hold = function (kind, message) {
    const s = TCL.session(); if (!s) return;
    const preset = Session.HOLDING.find(h => h.id === kind);
    s.holding = kind ? { kind, title: preset ? preset.title : (message || "One moment"), sub: preset ? preset.sub : "", message: message || "" } : null;
    TCL.History.log(kind ? "Holding screen: " + (preset ? preset.title : "custom") : "Holding screen off");
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Session.holding = function () { const s = TCL.session(); return s ? s.holding : null; };

  Session.setCurrent = function (id) { TCL.state.currentSessionId = id; TCL.emit("session:changed"); };
  Session.list = function () { return U.sortBy(TCL.state.sessions, s => s.updatedAt || "", true); };
  Session.remove = function (id) {
    TCL.state.sessions = TCL.state.sessions.filter(s => s.id !== id);
    if (TCL.state.currentSessionId === id) TCL.state.currentSessionId = null;
    TCL.persist();
  };
  /* What belongs to the plan rather than to one run of it. Everything else in a session is
     run state and is reset by resetRunState, so a duplicate cannot inherit a covered
     presentation, someone who was sitting out that day, or scores from last time.
     Adding a field to blank() and forgetting it here is caught by a test. */
  Session.PLAN_KEYS = ["id", "name", "createdAt", "updatedAt", "status", "targetMinutes",
    "participants", "teamMode", "teams", "teamsLocked", "runSheet",
    "scoringEnabled", "showScores", "scoreModel", "finaleMode", "notes"];
  /* Per-activity fields that describe one run, not the plan. `notes` survives on purpose:
     "explain the rules twice" is worth keeping for next time. */
  Session.ACTIVITY_RUN_KEYS = ["status", "state", "startedAt", "endedAt", "scoresDiscarded",
    "pausedTimers", "activityTimerOwned", "forceStart"];
  /* Run state can also hide inside objects that are otherwise plan: a team is part of the
     plan, but its rotation pointer is where that team got to last time. */
  Session.TEAM_RUN_KEYS = ["rot"];
  Session.PARTICIPANT_RUN_KEYS = [];

  Session.resetRunState = function (session) {
    const fresh = Session.blank(session.name, session.targetMinutes);
    Object.keys(fresh).forEach(k => { if (Session.PLAN_KEYS.indexOf(k) < 0) session[k] = fresh[k]; });
    session.timers = TCL.Timers.blankSet();
    session.status = "draft";
    session.currentActivityId = null;
    (session.runSheet || []).forEach(a => {
      Session.ACTIVITY_RUN_KEYS.forEach(k => { delete a[k]; });
      a.status = "pending";
      a.state = null;
      a.startedAt = a.endedAt = null;
    });
    (session.teams || []).forEach(t => { Session.TEAM_RUN_KEYS.forEach(k => { delete t[k]; }); });
    (session.participants || []).forEach(p => { Session.PARTICIPANT_RUN_KEYS.forEach(k => { delete p[k]; }); });
    return session;
  };

  Session.duplicate = function (id) {
    const src = U.byId(TCL.state.sessions, id); if (!src) return null;
    const copy = U.clone(src);
    copy.id = U.uid("s"); copy.name = src.name + " (copy)";
    copy.createdAt = copy.updatedAt = new Date().toISOString();
    Session.resetRunState(copy);
    copy.runSheet.forEach(a => { a.id = U.uid("a"); });
    TCL.state.sessions.push(copy);
    TCL.state.currentSessionId = copy.id;
    TCL.persist();
    return copy;
  };
  Session.touch = function () { const s = TCL.session(); if (s) s.updatedAt = new Date().toISOString(); TCL.persist(); };
  Session.unfinished = function () { return TCL.state.sessions.filter(s => s.status === "live"); };

  /* ---------- run sheet ---------- */
  Session.newActivity = function (kind, gameId) {
    if (kind === "game") {
      const g = TCL.Games.get(gameId);
      return { id: U.uid("a"), kind: "game", gameId, title: g ? g.name : gameId, settings: U.clone(g ? TCL.Games.defaults(g) : {}), status: "pending", state: null, notes: "", startedAt: null, endedAt: null };
    }
    if (kind === "break") return { id: U.uid("a"), kind: "break", title: "Break", settings: { minutes: 5, message: "Stretch, refill your cup. Back in 5 minutes." }, status: "pending", state: null, notes: "" };
    return { id: U.uid("a"), kind: "custom", title: "Welcome and warm-up", settings: { minutes: 5, message: "Welcome! Wave on camera, then send one emoji reaction that matches your mood today.", instructions: "" }, status: "pending", state: null, notes: "" };
  };
  Session.addActivity = function (kind, gameId, index) {
    const s = TCL.session(); if (!s) return null;
    const a = Session.newActivity(kind, gameId);
    if (index == null || index >= s.runSheet.length) s.runSheet.push(a); else s.runSheet.splice(index, 0, a);
    Session.touch();
    return a;
  };
  Session.activity = function (id) { const s = TCL.session(); return s ? U.byId(s.runSheet, id) : null; };
  Session.removeActivity = function (id) {
    const s = TCL.session(); if (!s) return;
    s.runSheet = s.runSheet.filter(a => a.id !== id);
    TCL.Scoring.removeActivity(id);
    if (s.currentActivityId === id) s.currentActivityId = null;
    Session.touch();
  };
  Session.duplicateActivity = function (id) {
    const s = TCL.session(); const a = Session.activity(id); if (!s || !a) return null;
    const copy = U.clone(a); copy.id = U.uid("a"); copy.status = "pending"; copy.state = null; copy.startedAt = copy.endedAt = null;
    s.runSheet.splice(s.runSheet.indexOf(a) + 1, 0, copy);
    Session.touch();
    return copy;
  };
  Session.moveActivity = function (id, toIndex) {
    const s = TCL.session(); if (!s) return;
    const from = s.runSheet.findIndex(a => a.id === id); if (from < 0) return;
    const [a] = s.runSheet.splice(from, 1);
    s.runSheet.splice(U.clamp(toIndex, 0, s.runSheet.length), 0, a);
    Session.touch();
  };
  Session.canEditActivity = function (a) { return a && (a.status === "pending" || a.status === "skipped"); };
  Session.updateSettings = function (id, patch) {
    const a = Session.activity(id); if (!a) return;
    a.settings = Object.assign({}, a.settings, patch);
    if (a.kind !== "game" && patch.title) a.title = patch.title;
    Session.touch();
  };
  Session.nextPending = function (afterId) {
    const s = TCL.session(); if (!s) return null;
    const i = afterId ? s.runSheet.findIndex(a => a.id === afterId) : -1;
    return s.runSheet.slice(i + 1).find(a => a.status === "pending" || a.status === "paused") || s.runSheet.find(a => a.status === "pending" || a.status === "paused") || null;
  };

  /* ---------- presets ---------- */
  Session.applyPreset = function (preset) {
    const s = TCL.session(); if (!s || !preset) return;
    s.targetMinutes = preset.targetMinutes || s.targetMinutes;
    s.runSheet = (preset.runSheet || []).map(item => {
      const a = Session.newActivity(item.kind || "game", item.gameId);
      if (item.title) a.title = item.title;
      a.settings = Object.assign({}, a.settings, item.settings || {});
      return a;
    });
    Session.touch();
  };
  Session.savePreset = function (name) {
    const s = TCL.session(); if (!s) return null;
    const p = { id: U.uid("preset"), name: name || (s.name + " preset"), builtIn: false, targetMinutes: s.targetMinutes,
      runSheet: s.runSheet.map(a => ({ kind: a.kind, gameId: a.gameId, title: a.title, settings: U.clone(a.settings) })), createdAt: new Date().toISOString() };
    TCL.state.presets.push(p);
    TCL.persist();
    return p;
  };
  Session.presets = function () { return (TCL.Presets ? TCL.Presets.builtIn() : []).concat(TCL.state.presets); };
  Session.preset = id => Session.presets().find(p => p.id === id) || null;
  Session.renamePreset = function (id, name) { const p = U.byId(TCL.state.presets, id); if (p) { p.name = name; TCL.persist(); } };
  Session.deletePreset = function (id) { TCL.state.presets = TCL.state.presets.filter(p => p.id !== id); TCL.persist(); };
  Session.duplicatePreset = function (id) {
    const p = Session.preset(id); if (!p) return null;
    const c = U.clone(p); c.id = U.uid("preset"); c.builtIn = false; c.name = p.name + " (copy)";
    TCL.state.presets.push(c); TCL.persist(); return c;
  };

  /* ---------- results export ---------- */
  Session.summaryText = function () {
    const s = TCL.session(); if (!s) return "";
    const rows = TCL.Scoring.standings();
    const medals = ["🥇", "🥈", "🥉"];
    const per = TCL.Scoring.perActivity();
    const lines = [`TEAM CONNECT LIVE · ${s.name}`, `${U.fmtDate(s.updatedAt)} · ${TCL.Teams.present(s).length} participants`, ""];
    if (rows.length && s.scoringEnabled !== false) {
      lines.push("Final standings:");
      rows.forEach(r => {
        const t = U.byId(s.teams, r.id);
        const names = t ? TCL.Teams.members(t, s).map(p => p.displayName || p.name).join(", ") : "";
        lines.push(`${medals[r.rank - 1] || "•"} ${r.name}: ${r.total} pts${r.tied ? " (tied)" : ""}${names ? " · " + names : ""}`);
      });
      lines.push("");
    }
    lines.push("Run sheet:");
    s.runSheet.forEach((a, i) => {
      const bits = rows.map(r => `${r.name} ${per[a.id] && per[a.id][r.id] || 0}`).join(" · ");
      lines.push(`${i + 1}. ${a.title} [${a.status}]${a.kind === "game" && s.scoringEnabled !== false ? " · " + bits : ""}`);
    });
    const extras = TCL.Games.list().map(g => g.exportText && s.runSheet.filter(a => a.gameId === g.id && a.state).map(a => g.exportText(a)).join("\n")).filter(Boolean);
    if (extras.length) { lines.push(""); lines.push(...extras); }
    lines.push("", "\"Alone we can do so little; together we can do so much.\" (Helen Keller)");
    return lines.join("\n");
  };

  /* ---------- persistence ---------- */
  const persistNow = function () {
    if (!TCL.state) return;
    const copy = Object.assign({}, TCL.state);
    copy.sessions = TCL.state.sessions.map(s => Object.assign({}, s, { undo: TCL.History.forPersist(s) }));
    TCL.Store.save(copy);
  };
  const persistSoon = U.debounce(persistNow, 150);
  TCL.persist = function (immediate) { if (immediate) persistNow(); else persistSoon(); };
  TCL.persistNow = persistNow;
  window.addEventListener("beforeunload", () => { try { persistNow(); } catch (e) { /* ignore */ } });
})();


/* ==== src/core/50-games.js ==== */
/* src/core/50-games.js
   Game registry + Runner (activity lifecycle, ctx, actions, exits, timers). */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Games = TCL.Games = {};
  const registry = [];
  const REQUIRED = ["id", "name", "description", "defaultSettings", "settingsSchema", "estimateMinutes", "init", "console", "presentation", "actions", "isComplete"];

  Games.register = function (def) {
    const missing = REQUIRED.filter(k => def[k] == null);
    if (missing.length) { console.error("[TCL] game", def.id, "missing", missing.join(", ")); return; }
    def.modes = def.modes || ["teams", "individual"];
    def.validate = def.validate || (() => []);
    def.category = def.category || "Quiz";
    def.needsBreakout = def.needsBreakout || false;   // true, or fn(settings) for "only with these settings"
    registry.push(def);
  };
  Games.get = id => registry.find(g => g.id === id) || null;
  Games.list = () => registry.slice();
  /* A game's defaults, with the facilitator's own overrides from Settings folded in.
     Overrides apply to activities added from now on; existing ones keep their own settings. */
  Games.defaults = function (id) {
    const g = typeof id === "string" ? Games.get(id) : id;
    if (!g) return {};
    const over = (TCL.state && TCL.state.settings && TCL.state.settings.gameDefaults) || {};
    return Games.sanitise(g, Object.assign({}, g.defaultSettings, over[g.id] || {}));
  };
  Games.hasOverrides = function (id) {
    const over = (TCL.state && TCL.state.settings && TCL.state.settings.gameDefaults) || {};
    const o = over[typeof id === "string" ? id : id.id];
    return !!(o && Object.keys(o).length);
  };
  Games.setDefaults = function (id, patch) {
    const g = Games.get(id); if (!g) return;
    const over = TCL.state.settings.gameDefaults = TCL.state.settings.gameDefaults || {};
    const diff = {};
    Object.keys(patch || {}).forEach(k => { if (JSON.stringify(patch[k]) !== JSON.stringify(g.defaultSettings[k])) diff[k] = patch[k]; });
    if (Object.keys(diff).length) over[g.id] = diff; else delete over[g.id];
    TCL.persist();
  };
  Games.clearDefaults = function (id) {
    const over = TCL.state.settings.gameDefaults || {};
    if (id) delete over[id]; else TCL.state.settings.gameDefaults = {};
    TCL.persist();
  };

  /* ---------- Runner ---------- */
  const Runner = TCL.Runner = {};
  Runner.current = function () { const s = TCL.session(); return s && s.currentActivityId ? U.byId(s.runSheet, s.currentActivityId) : null; };
  /* Every numeric setting a game declares is coerced here, once, using that game's own
     default and its schema's bounds. Settings reach an activity from imported presets and
     restored backups without passing through the settings form, and a NaN does not throw:
     it silently turns `count * seconds` into NaN and poisons estimates, clocks and score
     maths downstream. Sanitising at this boundary means no game has to think about it. */
  Games.sanitise = function (gameOrId, raw) {
    const g = typeof gameOrId === "string" ? Games.get(gameOrId) : gameOrId;
    if (!g) return Object.assign({}, raw || {});
    const out = Object.assign({}, g.defaultSettings, raw || {});
    (g.settingsSchema || []).forEach(f => {
      if (f.type !== "range" && f.type !== "number") return;
      out[f.key] = U.num(out[f.key], U.num(g.defaultSettings[f.key], f.min != null ? f.min : 0), f.min, f.max);
    });
    return out;
  };
  Runner.settingsOf = function (a) { return Games.sanitise(TCL.Games.get(a.gameId), a.settings); };

  /* Build the context handed to every game function. */
  Runner.ctx = function (activity) {
    const s = TCL.session();
    activity = activity || Runner.current();
    if (!s || !activity) return null;
    const game = activity.kind === "game" ? TCL.Games.get(activity.gameId) : null;
    const settings = game ? Runner.settingsOf(activity) : activity.settings;
    const teamMode = s.teamMode === "individual" || (settings && settings.mode === "individual") ? "individual" : "teams";
    const present = TCL.Teams.present(s);
    const targets = teamMode === "individual"
      ? present.map(p => ({ id: p.id, name: p.displayName || p.name, color: "var(--gold)", kind: "participant", memberIds: [p.id] }))
      : s.teams.map(t => ({ id: t.id, name: t.name, color: t.color, kind: "team", memberIds: t.memberIds, team: t }));
    const ctx = {
      session: s, activity, game, settings, state: activity.state, teamMode, targets, participants: present, allParticipants: s.participants,
      scoringEnabled: TCL.Scoring.enabledFor(activity),
      name: pid => TCL.Teams.displayName(pid, s),
      teamOf: pid => TCL.Teams.teamOf(pid, s),
      targetOf: pid => teamMode === "individual" ? targets.find(t => t.id === pid) || null : (function () { const t = TCL.Teams.teamOf(pid, s); return t ? targets.find(x => x.id === t.id) || null : null; })(),
      score: function (targetId, points, reason, round) {
        if (!ctx.scoringEnabled) return null;
        const isTeam = s.teams.some(t => t.id === targetId);
        const ev = TCL.Scoring.award({ activityId: activity.id, teamId: isTeam ? targetId : null, participantId: isTeam ? null : targetId, points, reason, round });
        if (ev) { TCL.Audio.ding(); TCL.emit("ui:pulse", targetId); }
        return ev;
      },
      scored: (targetId, reason, round) => TCL.Scoring.alreadyScored(activity.id, round, targetId, reason),
      events: () => TCL.Scoring.eventsFor(activity.id).filter(e => !e.undone),
      timer: timerApi("round"),
      breakout: timerApi("breakout"),
      content: (q) => TCL.Content.select(Object.assign({ game: game && game.contentGame }, q)),
      log: label => TCL.History.log(label),
      rotate: (key, advance) => TCL.Teams.nextParticipant(key, advance),
      rotateTeam: (team, key, advance) => TCL.Teams.nextMember(team, key, advance),
    };
    return ctx;
  };
  function timerApi(name) {
    const T = TCL.Timers;
    return {
      name,
      start: (ms, label, warnAtMs) => T.start(name, { durationMs: ms, label, warnAtMs }),
      pause: () => T.pause(name), resume: () => T.resume(name), toggle: () => T.toggle(name),
      stop: () => T.stop(name), reset: () => T.reset(name), adjust: ms => T.adjust(name, ms),
      remaining: () => T.remaining(name), status: () => (T.get(name) || {}).status || "idle",
      running: () => (T.get(name) || {}).status === "running", done: () => (T.get(name) || {}).status === "done",
      idle: () => { const st = (T.get(name) || {}).status; return !st || st === "idle"; },
    };
  }

  /* Start or resume an activity. Returns false with a reason when it cannot run. */
  Runner.start = function (activityId) {
    const s = TCL.session(); const a = U.byId(s.runSheet, activityId);
    if (!a) return { ok: false, reason: "Activity not found." };
    const cur = Runner.current();
    if (cur && cur.id !== a.id && cur.status === "active") return { ok: false, reason: `"${cur.title}" is still active. Pause or end it first.` };
    if (a.kind === "game") {
      const g = TCL.Games.get(a.gameId);
      if (!g) return { ok: false, reason: "Unknown game." };
      const problems = Runner.validate(a).filter(p => p.level === "error");
      if (problems.length && !a.forceStart) return { ok: false, reason: problems.map(p => p.message).join(" "), problems };
    }
    TCL.History.record(`Start ${a.title}`, { safeRedo: false });
    s.status = "live";
    s.currentActivityId = a.id;
    if (!a.state) {
      a.startedAt = new Date().toISOString();
      ["round", "breakout", "break"].forEach(n => { const t = TCL.Timers.get(n); TCL.Timers.stop(n); t.label = ""; t.durationMs = 0; t.remainingMs = 0; });
      if (a.kind === "game") {
        const ctx = Runner.ctx(a);
        a.state = TCL.Games.get(a.gameId).init(ctx) || {};
        if (a.state.contentIds) TCL.Content.markUsed(a.state.contentIds);
      } else {
        a.state = { started: true };
        TCL.Timers.start(a.kind === "break" ? "break" : "round", { durationMs: Math.max(1, U.num(a.settings.minutes, 5, 1, 240)) * 60000, label: a.title });
      }
    } else {
      /* resuming: resume paused timers that belong to this activity */
      ["round", "breakout", "break"].forEach(n => { const t = TCL.Timers.get(n); if (t && t.status === "paused" && a.pausedTimers && a.pausedTimers.includes(n)) TCL.Timers.resume(n); });
      a.pausedTimers = null;
    }
    a.status = "active";
    const st = TCL.Timers.get("session");
    if (st.status === "idle") TCL.Timers.start("session", { durationMs: (s.targetMinutes || 60) * 60000, direction: "up", label: "Session" });
    else if (st.status === "paused") TCL.Timers.resume("session");
    const at = TCL.Timers.get("activity");
    if (at.status === "paused" && a.activityTimerOwned) TCL.Timers.resume("activity");
    else { TCL.Timers.start("activity", { durationMs: TCL.Duration.activity(a, s) * 60000, direction: "up", label: a.title }); a.activityTimerOwned = true; }
    TCL.Session.touch();
    TCL.emit("runner:changed");
    return { ok: true };
  };

  Runner.validate = function (a) {
    const s = TCL.session();
    const g = TCL.Games.get(a.gameId); if (!g) return [{ level: "error", message: "Unknown game" }];
    const settings = Runner.settingsOf(a);
    const ctx = { participants: TCL.Teams.present(s), teams: s.teams, teamMode: s.teamMode, session: s, settings, content: q => TCL.Content.select(Object.assign({ game: g.contentGame }, q)) };
    const out = [];
    const mode = s.teamMode === "individual" ? "individual" : (settings.mode || "teams");
    if (!g.modes.includes(mode) && !(mode === "teams" && g.modes.includes("teams"))) out.push({ level: "warn", message: `${g.name} does not support ${mode} mode; it will run with everyone as one group.` });
    if (ctx.participants.length === 0) out.push({ level: "error", message: "Nobody is marked present." });
    if (s.teamMode === "teams" && s.teams.length && s.teams.every(t => !TCL.Teams.presentMembers(t, s).length)) out.push({ level: "error", message: "Every team is empty." });
    try { out.push(...(g.validate(settings, ctx) || [])); } catch (e) { out.push({ level: "warn", message: "Validation failed: " + e.message }); }
    return out;
  };

  /* Dispatch a game action. Records undo automatically unless the game marks it noUndo. */
  Runner.act = function (name, arg) {
    const a = Runner.current(); if (!a) return;
    if (a.kind !== "game") return Runner.simpleAct(a, name, arg);
    const g = TCL.Games.get(a.gameId);
    const fn = g.actions[name];
    if (!fn) { console.warn("unknown action", name); return; }
    const label = (g.actionLabels && g.actionLabels[name]) || U.titleCase(name.replace(/([A-Z])/g, " $1"));
    const noUndo = g.noUndo && g.noUndo.includes(name);
    if (!noUndo) TCL.History.record(`${g.name}: ${label}`);
    const ctx = Runner.ctx(a);
    try { fn(ctx, arg); } catch (e) { console.error("[TCL] action failed", name, e); TCL.emit("ui:toast", { text: "That action failed: " + e.message, kind: "error" }); }
    a.state = ctx.state;
    Runner.afterChange();
  };
  Runner.simpleAct = function (a, name, arg) {
    const timerName = a.kind === "break" ? "break" : "round";
    if (name === "toggleTimer") TCL.Timers.toggle(timerName);
    if (name === "addTime") TCL.Timers.adjust(timerName, Number(arg) || 30000);
    if (name === "restartTimer") TCL.Timers.start(timerName, { durationMs: Math.max(1, U.num(a.settings.minutes, 5, 1, 240)) * 60000, label: a.title });
    Runner.afterChange();
  };
  Runner.afterChange = function () {
    const a = Runner.current();
    if (a && a.kind === "game") {
      const g = TCL.Games.get(a.gameId);
      try { if (g.isComplete(Runner.ctx(a))) a.state.completeReady = true; } catch (e) { /* ignore */ }
    }
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };

  /* Universal timer controls for the round timer of the current activity */
  Runner.timer = function (op, arg) {
    const a = Runner.current(); if (!a) return;
    const name = a.kind === "break" ? "break" : (arg && arg.timer) || "round";
    const T = TCL.Timers;
    if (op === "toggle") T.toggle(name);
    if (op === "add") T.adjust(name, 30000);
    if (op === "sub") T.adjust(name, -30000);
    if (op === "restart") { const t = T.get(name); T.start(name, { durationMs: t.durationMs, label: t.label, warnAtMs: t.warnAtMs }); }
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };

  /* Exits */
  Runner.pause = function () {
    const a = Runner.current(); if (!a) return;
    a.pausedTimers = ["round", "breakout", "break"].filter(n => (TCL.Timers.get(n) || {}).status === "running");
    TCL.Timers.pauseAll();
    a.status = "paused";
    TCL.History.log(`Paused ${a.title}`);
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Runner.complete = function () {
    const a = Runner.current(); if (!a) return;
    TCL.History.record(`Complete ${a.title}`, { safeRedo: false });
    ["round", "breakout", "break"].forEach(n => TCL.Timers.stop(n));
    TCL.Timers.pause("activity");
    a.status = "complete"; a.endedAt = new Date().toISOString();
    if (a.kind === "game") { const g = TCL.Games.get(a.gameId); if (g.onComplete) { try { g.onComplete(Runner.ctx(a)); } catch (e) { /* ignore */ } } }
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Runner.completeAndDiscard = function () {
    const a = Runner.current(); if (!a) return;
    TCL.History.record(`End ${a.title} and discard its scores`, { safeRedo: false });
    const n = TCL.Scoring.discardActivity(a.id);
    ["round", "breakout", "break"].forEach(n2 => TCL.Timers.stop(n2));
    TCL.Timers.pause("activity");
    a.status = "complete"; a.endedAt = new Date().toISOString(); a.scoresDiscarded = true;
    TCL.Session.touch();
    TCL.emit("runner:changed");
    return n;
  };
  Runner.skip = function (activityId) {
    const s = TCL.session(); const a = U.byId(s.runSheet, activityId || s.currentActivityId); if (!a) return;
    TCL.History.record(`Skip ${a.title}`);
    if (a.id === s.currentActivityId) { ["round", "breakout", "break"].forEach(n => TCL.Timers.stop(n)); TCL.Timers.pause("activity"); }
    a.status = "skipped";
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Runner.resetActivity = function (activityId, keepScores) {
    const s = TCL.session(); const a = U.byId(s.runSheet, activityId); if (!a) return;
    TCL.History.record(`Reset ${a.title}`, { safeRedo: false });
    if (!keepScores) TCL.Scoring.discardActivity(a.id);
    a.state = null; a.status = "pending"; a.startedAt = a.endedAt = null; a.scoresDiscarded = false;
    if (s.currentActivityId === a.id) { ["round", "breakout", "break"].forEach(n => TCL.Timers.stop(n)); }
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Runner.reopen = function (activityId) {
    const s = TCL.session(); const a = U.byId(s.runSheet, activityId); if (!a) return;
    TCL.History.record(`Reopen ${a.title}`);
    a.status = "paused"; a.endedAt = null;
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };
  Runner.endSession = function () {
    const s = TCL.session(); if (!s) return;
    TCL.Timers.pauseAll();
    s.runSheet.forEach(a => { if (a.status === "active" || a.status === "paused") { a.status = "complete"; a.endedAt = new Date().toISOString(); } });
    s.status = "complete"; s.currentActivityId = null;
    TCL.Session.touch();
    TCL.emit("runner:changed");
  };

  /* Round timer completion -> game hook */
  TCL.on("timer:done", function (name) {
    const a = Runner.current(); if (!a) return;
    if (name === "round" || name === "breakout" || name === "break") {
      TCL.Audio.buzzer();
      if (a.kind === "game") {
        const g = TCL.Games.get(a.gameId);
        if (g.onTimerDone) { const ctx = Runner.ctx(a); try { g.onTimerDone(ctx, name); a.state = ctx.state; } catch (e) { console.error(e); } }
      }
      TCL.Session.touch();
      TCL.emit("runner:changed");
    }
  });
})();


/* ==== src/core/60-sync.js ==== */
/* src/core/60-sync.js
   Presentation window sync. Primary channel: direct postMessage over the window handle
   (works on file:// in every browser). Secondary: BroadcastChannel. Tertiary: localStorage event.
   Only public payloads ever cross this boundary. */
(function () {
  "use strict";
  const TCL = window.TCL, U = TCL.util;
  const Presenter = TCL.Presenter = {};
  const CH = "tcl-presentation";
  let win = null, bc = null, lastPing = 0, lastPayload = null, pollHandle = null;
  Presenter.status = "closed";      // closed | connecting | connected | disconnected | blocked
  Presenter.listeners = [];

  function setStatus(s) { if (Presenter.status !== s) { Presenter.status = s; TCL.emit("presenter:status", s); } }
  function url() {
    const base = location.href.split("#")[0];
    return base + "#presentation";
  }
  Presenter.open = function () {
    try {
      if (win && !win.closed) { win.focus(); Presenter.push(true); return true; }
      win = window.open(url(), "tcl_presentation", "width=1280,height=720,menubar=no,toolbar=no,location=no,status=no");
      if (!win) { setStatus("blocked"); return false; }
      setStatus("connecting");
      lastPing = 0;
      Presenter.push(true);
      return true;
    } catch (e) { setStatus("blocked"); return false; }
  };
  Presenter.close = function () { try { if (win && !win.closed) win.close(); } catch (e) { /* ignore */ } win = null; setStatus("closed"); };
  Presenter.isOpen = () => !!(win && !win.closed);

  function send(msg) {
    const json = JSON.stringify(msg);
    if (win && !win.closed) { try { win.postMessage(msg, "*"); } catch (e) { /* ignore */ } }
    if (bc) { try { bc.postMessage(msg); } catch (e) { /* ignore */ } }
    try { localStorage.setItem(CH, json); } catch (e) { /* ignore */ }
  }
  /* Push the current public payload. force=true resends even if unchanged. */
  Presenter.push = function (force) {
    const payload = Presenter.buildPayload();
    const json = JSON.stringify(payload);
    if (!force && json === lastPayload) return;
    lastPayload = json;
    send({ type: "payload", ts: Date.now(), payload });
  };
  Presenter.buildPayload = function () {
    const s = TCL.session();
    const settings = TCL.state.settings;
    const base = { brand: "TEAM CONNECT LIVE", tagline: "One team. Any location. Real connections.", scale: settings.presentationScale || 1, largeText: !!settings.largeText,
      sessionName: s ? s.name : "", screen: "idle", blocks: [], timers: {}, standings: null, rehearsal: !!(s && s.rehearsal) };
    if (!s) return base;
    const a = TCL.Runner.current();
    const showScores = s.scoringEnabled !== false && s.showScores !== false && !settings.hideScoresUntilFinale;
    /* A holding screen covers everything else. The activity underneath keeps running. */
    if (s.holding) {
      base.screen = "holding";
      base.blocks = [{ type: "title", text: s.holding.title }];
      if (s.holding.sub) base.blocks.push({ type: "text", text: s.holding.sub });
      if (s.holding.kind === "custom" && s.holding.message) base.blocks = [{ type: "title", text: s.holding.message }];
      return base;
    }
    if (showScores) base.standings = TCL.Scoring.standings().map(r => ({ name: r.name, total: r.total, color: r.color, rank: r.rank }));
    base.teams = s.teamMode === "individual" ? [] : s.teams.map(t => ({ name: t.name, color: t.color, members: TCL.Teams.presentMembers(t, s).map(p => p.displayName || p.name) }));
    if (s.status === "complete" || TCL.route && TCL.route.screen === "results" && TCL.route.params && TCL.route.params.present) {
      base.screen = "final";
      const shared = s.finaleMode === "shared" || s.scoringEnabled === false;
      base.standings = shared ? null : TCL.Scoring.standings().map(r => ({ name: r.name, total: r.total, color: r.color, rank: r.rank, tied: r.tied }));
      if (shared) {
        const rows = TCL.Scoring.standings();
        base.shared = {
          points: U.sum(rows.map(r => r.raw)),
          activities: s.runSheet.filter(a => a.status === "complete").length,
          people: TCL.Teams.present(s).length,
          teams: rows.map(r => ({ name: r.name, color: r.color, total: r.raw })),
          showPoints: s.scoringEnabled !== false,
        };
        base.blocks = [{ type: "eyebrow", text: "Grand finale" }, { type: "title", text: "What we did together" }];
      } else {
        base.blocks = [{ type: "eyebrow", text: "Grand finale" }, { type: "title", text: "Final standings" }];
      }
      return base;
    }
    if (!a || a.status !== "active" && a.status !== "paused") {
      base.screen = "lobby";
      const next = TCL.Session.nextPending();
      base.blocks = [{ type: "eyebrow", text: s.name }, { type: "title", text: next ? "Up next: " + next.title : "Welcome" }, { type: "text", text: next ? "Get comfortable. We start shortly." : "Grab a drink and settle in." }];
      return base;
    }
    base.screen = "activity";
    base.activityTitle = a.title;
    base.paused = a.status === "paused";
    ["round", "breakout", "break"].forEach(n => { const t = TCL.Timers.get(n); if (t && t.status !== "idle") base.timers[n] = TCL.Timers.describe(n); });
    if (a.kind === "game") {
      const g = TCL.Games.get(a.gameId);
      try { base.blocks = g.presentation(TCL.Runner.ctx(a)) || []; } catch (e) { base.blocks = [{ type: "title", text: a.title }]; }
      base.icon = g.icon;
      base.blocks = dropRulesOncePlaying(base.blocks);
    } else {
      base.blocks = [{ type: "eyebrow", text: a.kind === "break" ? "Break" : "Activity" }, { type: "title", text: a.title }, { type: "text", text: a.settings.message || "" }, { type: "timer", name: a.kind === "break" ? "break" : "round" }];
      if (a.settings.instructions) base.blocks.push({ type: "instructions", items: String(a.settings.instructions).split("\n").filter(Boolean) });
      base.blocks = dropRulesOncePlaying(base.blocks);
    }
    return base;
  };

  /* Rules belong on screen while you explain them, not for the whole round. Once a clock
     is running the instruction list comes off so the prompt and timer own the screen. */
  function playing() {
    return ["round", "breakout", "break"].some(n => (TCL.Timers.get(n) || {}).status === "running");
  }
  function dropRulesOncePlaying(blocks) {
    if (!playing()) return blocks;
    return (blocks || []).filter(b => b && b.type !== "instructions");
  }

  function onMessage(msg, source) {
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "hello" || msg.type === "ping") {
      lastPing = Date.now();
      if (source && (!win || win.closed)) win = source;
      setStatus("connected");
      if (msg.type === "hello") Presenter.push(true);
    }
  }
  Presenter.initFacilitator = function () {
    window.addEventListener("message", e => { if (e.data && e.data.channel === CH) onMessage(e.data, e.source); });
    try { bc = new BroadcastChannel(CH); bc.onmessage = e => onMessage(e.data); } catch (e) { bc = null; }
    window.addEventListener("storage", e => { if (e.key === CH + "-ping") { try { onMessage(JSON.parse(e.newValue)); } catch (e2) { /* ignore */ } } });
    pollHandle = setInterval(() => {
      if (Presenter.status === "closed" || Presenter.status === "blocked") return;
      if (win && win.closed) { win = null; setStatus("disconnected"); return; }
      if (lastPing && Date.now() - lastPing > 4000) setStatus("disconnected");
    }, 1000);
    TCL.on("runner:changed", () => Presenter.push());
    TCL.on("session:changed", () => Presenter.push());
    TCL.on("score:changed", () => Presenter.push());
    TCL.on("timer:change", () => Presenter.push(true));
    TCL.on("route:changed", () => Presenter.push());
  };

  /* ---------- presentation side ---------- */
  Presenter.initPresentation = function (onPayload) {
    const reply = msg => {
      msg.channel = CH;
      try { if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*"); } catch (e) { /* ignore */ }
      try { if (bc) bc.postMessage(msg); } catch (e) { /* ignore */ }
      try { localStorage.setItem(CH + "-ping", JSON.stringify(Object.assign({ ts: Date.now() }, msg))); } catch (e) { /* ignore */ }
    };
    const handle = data => { if (data && data.type === "payload" && data.payload) onPayload(data.payload); };
    window.addEventListener("message", e => {
      /* Accept only from the opener (same file) or via the named channels */
      if (window.opener && e.source !== window.opener) return;
      handle(e.data);
    });
    try { bc = new BroadcastChannel(CH); bc.onmessage = e => handle(e.data); } catch (e) { bc = null; }
    window.addEventListener("storage", e => { if (e.key === CH) { try { handle(JSON.parse(e.newValue)); } catch (e2) { /* ignore */ } } });
    try { const cached = localStorage.getItem(CH); if (cached) handle(JSON.parse(cached)); } catch (e) { /* ignore */ }
    reply({ type: "hello" });
    setInterval(() => reply({ type: "ping" }), 1500);
  };
})();
